<!--
  Word görüntüleyici kabuğu. İnternet YOK: jszip + docx-preview aynı klasörden,
  APK içine gömülü olarak yüklenir. Flutter tarafı renderDocx(base64) çağırır.
-->
<!-- TUZAK: meta viewport'u JS ile değiştirmek Android WebView'da yeniden
     sığdırma YAPMAZ. Bu yüzden sayfa CSS zoom ile ekrana sığdırılır (fitPage);
     viewport doğal ölçekte kalır.

     BULANIKLIK (2026-08-01 kullanıcı bulgusu): `user-scalable=yes` ile gelen
     NATIVE pinch, sayfayı yeniden dizmez — çizilmiş kareyi büyütür, yani
     yakınlaştıkça yazı bulanıklaşır. Artık native yakınlaştırma KAPALI;
     pinch aşağıdaki JS ile yakalanıp CSS `zoom`a çevriliyor, tarayıcı metni
     yeni ölçekte YENİDEN diziyor → her ölçekte keskin. (Aynı ilke PDF
     tarafında da uygulanmıştı: yeniden-yerleşim > dönüşüm.) -->
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  /* SADAKAT: Word belgeleri çoğunlukla Microsoft'un tescilli fontlarını
     (Calibri/Times New Roman/Arial) kullanır; Android WebView'da bunlar YOK →
     rastgele bir yerel fonta düşülür, harf genişlikleri değişir → satır ve
     sayfa kırılımı Word'den sapar (sadakat kaybının en büyük kaynağı).
     Çözüm: uygulamayla gömülü, METRİK-UYUMLU açık kaynak karşılıkları
     (Carlito≈Calibri, Tinos≈Times, Arimo≈Arial — harf genişlikleri birebir)
     MS adlarıyla @font-face olarak tanımlanır. Dosyalar assets/fonts/'ta
     (pubspec fonts:); viewer assets/word/'ten yüklendiği için ../fonts/ ile
     erişilir (jszip.min.js ile aynı yerel file:// mekanizması). font-display
     block: doğru metrikle ölçülsün, yanlış fontla kısa bir çakma olmasın. */
  @font-face { font-family:'Calibri'; src:url('../fonts/Carlito-Regular.ttf'); font-weight:normal; font-style:normal; font-display:block; }
  @font-face { font-family:'Calibri'; src:url('../fonts/Carlito-Bold.ttf'); font-weight:bold; font-style:normal; font-display:block; }
  @font-face { font-family:'Calibri'; src:url('../fonts/Carlito-Italic.ttf'); font-weight:normal; font-style:italic; font-display:block; }
  @font-face { font-family:'Calibri'; src:url('../fonts/Carlito-BoldItalic.ttf'); font-weight:bold; font-style:italic; font-display:block; }
  /* Modern Word başlık fontu Calibri Light → Carlito (ince ağırlık yok, düzenli) */
  @font-face { font-family:'Calibri Light'; src:url('../fonts/Carlito-Regular.ttf'); font-weight:normal; font-style:normal; font-display:block; }
  @font-face { font-family:'Times New Roman'; src:url('../fonts/Tinos-Regular.ttf'); font-weight:normal; font-style:normal; font-display:block; }
  @font-face { font-family:'Times New Roman'; src:url('../fonts/Tinos-Bold.ttf'); font-weight:bold; font-style:normal; font-display:block; }
  @font-face { font-family:'Times New Roman'; src:url('../fonts/Tinos-Italic.ttf'); font-weight:normal; font-style:italic; font-display:block; }
  @font-face { font-family:'Times New Roman'; src:url('../fonts/Tinos-BoldItalic.ttf'); font-weight:bold; font-style:italic; font-display:block; }
  /* Arimo değişken font: kalınlık wght ekseninden (100–900 aralığı) */
  @font-face { font-family:'Arial'; src:url('../fonts/Arimo-Variable.ttf'); font-weight:100 900; font-style:normal; font-display:block; }
  @font-face { font-family:'Arial'; src:url('../fonts/Arimo-Italic-Variable.ttf'); font-weight:100 900; font-style:italic; font-display:block; }
  @font-face { font-family:'Helvetica'; src:url('../fonts/Arimo-Variable.ttf'); font-weight:100 900; font-style:normal; font-display:block; }
  @font-face { font-family:'Helvetica'; src:url('../fonts/Arimo-Italic-Variable.ttf'); font-weight:100 900; font-style:italic; font-display:block; }
  /* Metrik-uyumlu olmasa da, tanımsız serif fontlar (Cambria/Georgia) için
     rastgele cihaz serifi yerine tam Türkçe kapsamlı Tinos daha tutarlı. */
  @font-face { font-family:'Cambria'; src:url('../fonts/Tinos-Regular.ttf'); font-weight:normal; font-style:normal; font-display:block; }
  @font-face { font-family:'Cambria'; src:url('../fonts/Tinos-Bold.ttf'); font-weight:bold; font-style:normal; font-display:block; }
  @font-face { font-family:'Cambria'; src:url('../fonts/Tinos-Italic.ttf'); font-weight:normal; font-style:italic; font-display:block; }
  /* Biçim çubuğundaki yazı tipi listesi genişledi (2026-08-07, `kDocFonts`):
     Android'de bu adların HİÇBİRİ kurulu değil, tanım olmadan seçilen font
     sessizce cihazın varsayılanına düşerdi ("seçtim ama değişmedi"). Serif
     olanlar Tinos'a, sans olanlar Arimo'ya eşlenir — Türkçe kapsamı tam. */
  @font-face { font-family:'Georgia'; src:url('../fonts/Tinos-Regular.ttf'); font-weight:normal; font-style:normal; font-display:block; }
  @font-face { font-family:'Georgia'; src:url('../fonts/Tinos-Bold.ttf'); font-weight:bold; font-style:normal; font-display:block; }
  @font-face { font-family:'Georgia'; src:url('../fonts/Tinos-Italic.ttf'); font-weight:normal; font-style:italic; font-display:block; }
  @font-face { font-family:'Garamond'; src:url('../fonts/Tinos-Regular.ttf'); font-weight:normal; font-style:normal; font-display:block; }
  @font-face { font-family:'Garamond'; src:url('../fonts/Tinos-Bold.ttf'); font-weight:bold; font-style:normal; font-display:block; }
  @font-face { font-family:'Book Antiqua'; src:url('../fonts/Tinos-Regular.ttf'); font-weight:normal; font-style:normal; font-display:block; }
  @font-face { font-family:'Book Antiqua'; src:url('../fonts/Tinos-Bold.ttf'); font-weight:bold; font-style:normal; font-display:block; }
  @font-face { font-family:'Verdana'; src:url('../fonts/Arimo-Variable.ttf'); font-weight:100 900; font-style:normal; font-display:block; }
  @font-face { font-family:'Verdana'; src:url('../fonts/Arimo-Italic-Variable.ttf'); font-weight:100 900; font-style:italic; font-display:block; }
  @font-face { font-family:'Tahoma'; src:url('../fonts/Arimo-Variable.ttf'); font-weight:100 900; font-style:normal; font-display:block; }
  @font-face { font-family:'Tahoma'; src:url('../fonts/Arimo-Italic-Variable.ttf'); font-weight:100 900; font-style:italic; font-display:block; }
  @font-face { font-family:'Segoe UI'; src:url('../fonts/Arimo-Variable.ttf'); font-weight:100 900; font-style:normal; font-display:block; }
  @font-face { font-family:'Segoe UI'; src:url('../fonts/Arimo-Italic-Variable.ttf'); font-weight:100 900; font-style:italic; font-display:block; }
  /* ARAPÇA/İBRANİCE/CJK: yukarıdaki ikameler (Carlito/Tinos/Arimo) YALNIZ
     Latin-Yunan-Kiril taşır. `unicode-range` olmadan tarayıcı "Calibri" adını
     görüp bu dosyaları yükler, Arapça harfleri onlarda arar ve bulamayınca
     davranışı belirsizleşir (kimi WebView sürümünde kutu/tofu). Kapsam açıkça
     sınırlanınca eksik harf için aile BOŞ kalır ve cihazın kendi Arapça fontuna
     (Android'de Noto Naskh Arabic) düşülür — metrik uyumu zaten Latin için
     anlamlı, Arapça'da kayıp yok. */
  @font-face { font-family:'Calibri'; src:local('Noto Naskh Arabic'), local('Droid Arabic Naskh'), local('Arial'); unicode-range: U+0590-05FF, U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB1D-FDFF, U+FE70-FEFF; }
  @font-face { font-family:'Times New Roman'; src:local('Noto Naskh Arabic'), local('Droid Arabic Naskh'), local('Arial'); unicode-range: U+0590-05FF, U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB1D-FDFF, U+FE70-FEFF; }
  @font-face { font-family:'Arial'; src:local('Noto Naskh Arabic'), local('Droid Arabic Naskh'); unicode-range: U+0590-05FF, U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB1D-FDFF, U+FE70-FEFF; }
  html, body { margin: 0; padding: 0; background: #f3f2f1; }
  /* Fonta hiç ad vermeyen (theme default) metin de rastgele cihaz fontuna
     düşmesin: son çare olarak Calibri metrikli Carlito. docx-preview çoğu
     çalıştırmada fontu açıkça yazar, bu yalnızca boşluğu doldurur. */
  #container { padding: 8px 0 24px; font-family: 'Calibri', 'Carlito', sans-serif; }
  /* Sağdan sola belge (bkz. setDocDir): docx-preview paragraf/çalıştırma
     düzeyindeki w:bidi'yi uyguluyor ama BÖLÜM düzeyindekini yok sayıyor.
     Açık hizalaması olmayan paragraflar bu kurala düşer; `w:jc` yazan
     paragraflar docx-preview'ın kendi satır-içi stiliyle korunur (o daha
     özgül) — yani dosyada yazan hizalama EZİLMEZ. */
  body.rtl #container { direction: rtl; }
  body.rtl .docx-wrapper section.docx p,
  body.rtl .docx-wrapper section.docx li,
  body.rtl .docx-wrapper section.docx table { direction: rtl; }
  /* docx-preview sayfayı beyaz bir "kağıt" olarak çizer; gölge ekleyip
     PowerPoint/Word hissini tamamlıyoruz. */
  .docx-wrapper { background: #f3f2f1 !important; padding: 8px !important; }
  .docx-wrapper > section.docx {
    box-shadow: 0 1px 6px rgba(0,0,0,.25);
    margin-bottom: 12px !important;
  }
  #err { font: 14px sans-serif; color: #b00020; padding: 16px; display: none; }

  /* MOBİL AKIŞ GÖRÜNÜMÜ (2026-07-28 kullanıcı bulgusu: "Word'de yazı kalitesi
     çok düşük"). Kök neden çözünürlük değil BOYUT: A4 sayfa 794 px, telefon
     ~411 px → fitPage ~0.5 ölçek → 11 punto yazı 5-6 piksele iniyor.
     Burada sayfanın sabit genişliği kaldırılır, paragraflar ekrana sarılır ve
     ölçek 1'de kalır → yazı GERÇEK boyutunda, yakınlaştırmadan okunur.
     Bedeli: Word'ün sayfa kırılımı/kenar boşlukları görünmez (sayfa görünümü
     tek dokunuşla geri gelir). `!important` şart: docx-preview genişliği
     satır içi stille yazıyor. */
  body.flow .docx-wrapper { padding: 0 !important; }
  body.flow .docx-wrapper > section.docx {
    width: auto !important;
    height: auto !important;
    min-height: 0 !important;
    padding: 12px !important;
    margin: 0 0 8px !important;
    box-shadow: none;
  }
  body.flow .docx-wrapper > section.docx > article { width: auto !important; }
  /* Sabit genişlikli tablo/görsel ekranı yatay taşırmasın. */
  body.flow table { max-width: 100% !important; }
  body.flow img { max-width: 100% !important; height: auto !important; }

  /* Kullanıcının bu oturumda verdiği madde/numara işaretleri. Paragraf <li>
     olmadığı için (bkz. setListStyle) işaret CSS'ten çizilir. Sayaç, liste
     OLMAYAN her paragrafta sıfırlanır: art arda gelen numaralı paragraflar
     1,2,3 sayar, araya düz metin girince yeni liste 1'den başlar — Word de
     böyle davranır. */
  p:not([data-fk-list="number"]) { counter-reset: fklist; }
  p[data-fk-list] { padding-inline-start: 26px !important; position: relative; }
  p[data-fk-list="bullet"]::before {
    content: "\2022";
    position: absolute;
    inset-inline-start: 8px;
  }
  p[data-fk-list="number"] { counter-increment: fklist; }
  p[data-fk-list="number"]::before {
    content: counter(fklist) ".";
    position: absolute;
    inset-inline-start: 2px;
  }
</style>
<div id="container"></div>
<div id="err"></div>
<script src="jszip.min.js"></script>
<script src="docx-preview.min.js"></script>
<script>
  function report(msg) {
    if (window.Durum) window.Durum.postMessage(msg);
  }

  window.renderDocx = function (b64) {
    try {
      var bin = atob(b64);
      var buf = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
      docx.renderAsync(buf.buffer, document.getElementById('container'), null, {
        inWrapper: true,
        ignoreWidth: false,
        // SADAKAT: sayfa tam A4 yüksekliğinde çizilsin (kısa belgede altta boşluk
        // Word'deki gibi) — eski true, sayfayı içeriğe göre kısaltıyordu.
        ignoreHeight: false,
        breakPages: true,
        // SADAKAT: Word kaydederken sayfa kırma konumlarını (w:lastRenderedPageBreak)
        // belgeye yazar; false = onları KULLAN → sayfalama Word'le aynı yerde kırılır.
        // (Word'ün hiç açmadığı belgede bu işaretler yoktur → eski davranış, risksiz.)
        ignoreLastRenderedPageBreak: false,
        renderHeaders: true,
        renderFooters: true,
        renderFootnotes: true,
        renderEndnotes: true,
        experimental: true,
        useBase64URL: true
      }).then(function () {
        fitPage();
        reportPages();
        // Görseller/yerleşim geciken sayfalar için ikinci tur — sayfa sayısı
        // da orada kesinleşir (docx-preview section'ları asenkron ekleyebilir).
        setTimeout(function () { fitPage(); reportPages(); }, 400);
        // Aliaslı fontlar yüklenince metrikler değişir → yeniden sığdır (genişlik
        // sabit ama güvenli). document.fonts yoksa (eski WebView) sessiz geç.
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function () { fitPage(); reportPages(); });
        }
        report('ok');
      }).catch(function (e) {
        showError(e);
      });
    } catch (e) {
      showError(e);
    }
  };

  // ---- Canlı düzenleme köprüsü -------------------------------------------
  // Sayfa contenteditable yapılır; değişen paragraf 250ms sonra Flutter'a
  // {i: paragrafIndeksi, segs: [[metin,b,i,u],...]} olarak gönderilir (Kalem
  // kanalı). Paragraf sırası document.xml'deki w:p sırasıyla birebirdir
  // (başlık/altbilgi article dışında kaldığı için sayılmaz).
  var EDIT = false;
  var pending = {};

  function articles() {
    var a = document.querySelectorAll('.docx-wrapper section.docx article');
    return a.length ? a : document.querySelectorAll('.docx-wrapper section.docx');
  }

  function paraList() {
    var out = [];
    articles().forEach(function (a) {
      a.querySelectorAll('p').forEach(function (p) { out.push(p); });
    });
    return out;
  }

  // Paragraf listesi düzenleme boyunca önbellekte tutulur: her tuş vuruşunda
  // tüm belgeyi taramak büyük dosyalarda yazmayı kastırıyordu.
  var cachedParas = null;

  function setEditable(on) {
    EDIT = !!on;
    articles().forEach(function (a) {
      a.contentEditable = EDIT ? 'true' : 'false';
      a.spellcheck = false; // kırmızı dalgalı çizgi + denetim maliyeti olmasın
      a.setAttribute('autocorrect', 'off');
      a.setAttribute('autocapitalize', 'off');
    });
    cachedParas = EDIT ? paraList() : null;
    if (!EDIT && document.activeElement) document.activeElement.blur();
    // Flutter, paragraf sayısını kendi listesiyle karşılaştırıp eşleşmezse
    // düzenlemeyi kapatır (yanlış paragrafa yazma sigortası).
    if (EDIT && window.Kalem) {
      window.Kalem.postMessage(JSON.stringify({ n: cachedParas.length }));
    }
  }

  // Yapı beklenmedik şekilde değiştiyse (sigorta): sayıyı yeniden bildir.
  function structureChanged() {
    cachedParas = paraList();
    if (window.Kalem) {
      window.Kalem.postMessage(JSON.stringify({ n: cachedParas.length }));
    }
  }

  // Bir parça = [metin, kalın, italik, altçizgi, yazıTipi|null, punto|null].
  // Yazı tipi/punto YALNIZ kullanıcı açıkça seçtiyse (paragrafta data-fk-*
  // işareti varsa) doldurulur. Hesaplanmış değeri koşulsuz göndermek,
  // dosyadaki STİLDEN gelen fontu her düzenlemede satır içi bir w:rFonts'a
  // dondururdu (bkz. DocxEditor.setRuns yorumu).
  // Renk/vurgu YALNIZ kullanıcı verdiyse (data-fk-color / data-fk-hl işaretli
  // bir kapsayıcının içindeyse) taşınır. Hesaplanmış rengi koşulsuz göndermek
  // temadan/stilden gelen rengi her düzenlemede satır içi bir w:color'a
  // dondururdu — yazı tipiyle aynı gerekçe.
  function segsOf(p) {
    var out = [];
    var font = p.getAttribute('data-fk-font') || null;
    var sizeAttr = p.getAttribute('data-fk-size');
    var size = sizeAttr ? parseFloat(sizeAttr) : null;
    function walk(node, b, i, u, col, hl) {
      if (node.nodeType === 3) {
        if (node.textContent) {
          out.push([node.textContent, b, i, u, font, size, col, hl]);
        }
        return;
      }
      if (node.nodeType !== 1) return;
      if (node.nodeName === 'BR') {
        out.push(['\n', b, i, u, font, size, col, hl]);
        return;
      }
      var cs = window.getComputedStyle(node);
      var nb = b || parseInt(cs.fontWeight, 10) >= 600 || cs.fontWeight === 'bold';
      var ni = i || cs.fontStyle === 'italic';
      var nu = u || ((cs.textDecorationLine || cs.textDecoration || '')
                       .indexOf('underline') >= 0);
      var nc = node.getAttribute('data-fk-color') || col;
      var nh = node.getAttribute('data-fk-hl') || hl;
      for (var c = node.firstChild; c; c = c.nextSibling) {
        walk(c, nb, ni, nu, nc, nh);
      }
    }
    walk(p, false, false, false, null, null);
    return out;
  }

  // ---- Yazı rengi ve vurgu ------------------------------------------------
  // Bunlar SEÇİME uygulanır (yazı tipinin aksine): bir cümlenin üç kelimesini
  // sarıya boyamak Word'ün en sık kullanılan işlerinden. Güvenli olmasının
  // nedeni `execCommand`ın `<span>` ÜRETMESİ — <p> sayısı değişmez, paragraf
  // eşlemesi bozulmaz. Üretilen span'lar işaretlenir ki `segsOf` yalnız
  // kullanıcının verdiği rengi taşısın.
  function rgbToHex(v) {
    if (!v) return null;
    var m = v.match(/rgba?\((\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
    if (!m) return v.charAt(0) === '#' ? v.substring(1).toUpperCase() : null;
    function h(n) { var s = parseInt(n, 10).toString(16).toUpperCase(); return s.length < 2 ? '0' + s : s; }
    return h(m[1]) + h(m[2]) + h(m[3]);
  }

  function markInline(p) {
    // Paragrafın KENDİSİ de listede: seçim tüm paragrafı kapsıyorsa
    // `execCommand` rengi <span> yerine doğrudan <p>'ye yazıyor.
    var els = [p].concat([].slice.call(p.querySelectorAll('[style]')));
    for (var k = 0; k < els.length; k++) {
      var el = els[k];
      var c = rgbToHex(el.style.color);
      var bg = rgbToHex(el.style.backgroundColor);
      if (c) el.setAttribute('data-fk-color', c);
      if (bg) el.setAttribute('data-fk-hl', bg);
    }
  }

  // hex: "FF0000" · null = kaldır (rengi otomatiğe döndür).
  function applyInline(cmd, hex, attr) {
    if (!EDIT) return;
    document.execCommand('styleWithCSS', false, true);
    if (hex) {
      document.execCommand(cmd, false, '#' + hex);
    } else {
      // "Yok": execCommand'in geri alması yok — seçimdeki işaretli span'ların
      // stili elle temizlenir.
      var paras = selectedParas();
      for (var i = 0; i < paras.length; i++) {
        var els = paras[i].p.querySelectorAll('[' + attr + ']');
        for (var k = 0; k < els.length; k++) {
          els[k].removeAttribute(attr);
          if (attr === 'data-fk-color') els[k].style.color = '';
          else els[k].style.backgroundColor = '';
        }
      }
    }
    selectedParas().forEach(function (e) {
      markInline(e.p);
      sendPara(e.i, e.p);
    });
  }

  // ---- Madde işareti / numaralandırma -------------------------------------
  // `execCommand('insertUnorderedList')` BİLİNÇLİ olarak kullanılmıyor: <p>'yi
  // <li>'ye çevirip paragraf sayısını değiştirir ve canlı düzenlemenin eşleme
  // sigortası devreye girip düzenlemeyi tamamen kapatırdı. Bunun yerine liste
  // PARAGRAF ÖZELLİĞİ: işaret CSS'ten çizilir, Word tarafında `w:numPr` olur —
  // Word'ün kendi modeli de tam olarak budur.
  window.setListStyle = function (kind) {
    if (!EDIT) return;
    selectedParas().forEach(function (e) {
      if (kind === 'none' || e.p.getAttribute('data-fk-list') === kind) {
        e.p.removeAttribute('data-fk-list');
        if (window.Kalem) {
          window.Kalem.postMessage(JSON.stringify({ list: { i: e.i, v: 'none' } }));
        }
      } else {
        e.p.setAttribute('data-fk-list', kind);
        if (window.Kalem) {
          window.Kalem.postMessage(JSON.stringify({ list: { i: e.i, v: kind } }));
        }
      }
    });
  };

  window.setTextColor = function (hex) {
    applyInline('foreColor', hex || null, 'data-fk-color');
  };
  window.setHighlight = function (hex) {
    applyInline('hiliteColor', hex || null, 'data-fk-hl');
  };

  // Seçili metni Flutter'a verir (AI ile yeniden yazma, çeviri, arama kutusunu
  // doldurma). Seçim yoksa boş dizi gider — çağıran uyarıyı kendisi gösterir.
  // Seçim, alt sayfa (AI/çeviri) açılırken kaybolabilir → istek anında
  // Range SAKLANIR ve sonucu yazarken o kullanılır.
  var SAVED_RANGE = null;

  window.sendSelectionText = function () {
    var s = window.getSelection();
    var t = s ? s.toString() : '';
    SAVED_RANGE = (s && s.rangeCount) ? s.getRangeAt(0).cloneRange() : null;
    if (window.Kalem) {
      window.Kalem.postMessage(JSON.stringify({ seltext: t }));
    }
  };

  // AI/çeviri sonucunu saklanan seçimin yerine yazar. Metin düğümü düzeyinde
  // çalışır → <p> sayısı sabit, paragraf eşlemesi güvende.
  window.replaceSelectionText = function (text) {
    if (!EDIT || !SAVED_RANGE) return;
    var list = paraList();
    var node = SAVED_RANGE.startContainer;
    while (node && node.nodeType !== 1) node = node.parentNode;
    var p = node && node.closest ? node.closest('p') : null;
    SAVED_RANGE.deleteContents();
    if (text) SAVED_RANGE.insertNode(document.createTextNode(text));
    if (p) {
      p.normalize();
      var idx = list.indexOf(p);
      if (idx >= 0) sendPara(idx, p);
    }
    SAVED_RANGE = null;
  };

  // ---- Yazı tipi ve punto -------------------------------------------------
  // Seçime değil **paragrafa** uygulanır. Nedeni yapısal: canlı düzenlemenin
  // tamamı "DOM'daki <p> sırası = document.xml'deki w:p sırası" varsayımına
  // dayanıyor; seçimi span'la sarmak (surroundContents/extractContents)
  // paragraf sınırını aşan seçimlerde <p> bölebilir ve eşleme bozulunca
  // sigorta düzenlemeyi tamamen kapatır. Paragraf stili DOM'u DEĞİŞTİRMEZ.
  function selectedParas() {
    var s = window.getSelection();
    var list = paraList();
    if (!s || !s.anchorNode) return [];
    function idxOf(node) {
      while (node && node.nodeType !== 1) node = node.parentNode;
      var p = node && node.closest ? node.closest('p') : null;
      return p ? list.indexOf(p) : -1;
    }
    var a = idxOf(s.anchorNode), f = idxOf(s.focusNode);
    if (a < 0 && f < 0) return [];
    if (a < 0) a = f;
    if (f < 0) f = a;
    var out = [];
    for (var k = Math.min(a, f); k <= Math.max(a, f); k++) {
      out.push({ i: k, p: list[k] });
    }
    return out;
  }

  window.setFontFamily = function (name) {
    if (!EDIT) return;
    selectedParas().forEach(function (e) {
      e.p.style.fontFamily = name;
      e.p.setAttribute('data-fk-font', name);
      sendPara(e.i, e.p);
    });
    syncSelectionState();
  };

  window.setFontSize = function (pt) {
    if (!EDIT) return;
    selectedParas().forEach(function (e) {
      e.p.style.fontSize = pt + 'pt';
      e.p.setAttribute('data-fk-size', '' + pt);
      sendPara(e.i, e.p);
    });
    syncSelectionState();
  };

  // İmlecin bulunduğu paragrafın yazı tipi/puntosu (araç çubuğu göstersin).
  function currentFontInfo() {
    var s = window.getSelection();
    if (!s || !s.anchorNode) return {};
    var n = s.anchorNode;
    while (n && n.nodeType !== 1) n = n.parentNode;
    var p = n && n.closest ? n.closest('p') : null;
    if (!p) return {};
    var cs = window.getComputedStyle(p);
    // İlk aile adı yeter ("Calibri, sans-serif" → "Calibri"); tırnaklar atılır.
    var fam = (cs.fontFamily || '').split(',')[0].replace(/["']/g, '').trim();
    var px = parseFloat(cs.fontSize);
    return { font: fam, size: px ? Math.round(px * 0.75 * 10) / 10 : null };
  }

  function sendPara(idx, p) {
    // Debounce'lu gönderimde ucuz yapı kontrolü: sayı değiştiyse eşleme
    // güvensiz → Flutter'a bildir, bu paragrafı gönderme.
    if (cachedParas && paraList().length !== cachedParas.length) {
      structureChanged();
      return;
    }
    if (window.Kalem) {
      window.Kalem.postMessage(JSON.stringify({ i: idx, segs: segsOf(p) }));
    }
  }

  document.addEventListener('input', function (e) {
    if (!EDIT || !cachedParas) return;
    var n = e.target;
    while (n && n.nodeType !== 1) n = n.parentNode;
    var p = n && n.closest ? n.closest('p') : null;
    if (!p) return;
    var idx = cachedParas.indexOf(p);
    if (idx < 0) { structureChanged(); return; }
    clearTimeout(pending[idx]);
    pending[idx] = setTimeout(function () { sendPara(idx, p); }, 250);
  });

  // Enter yeni <p> üretip paragraf eşlemesini bozardı → satır sonuna çevrilir
  // (kaydta w:br olur). Yapıştırma da düz metin olarak eklenir.
  document.addEventListener('keydown', function (e) {
    if (!EDIT) return;
    if (e.key === 'Enter') {
      e.preventDefault();
      document.execCommand('insertLineBreak');
    }
  });
  document.addEventListener('paste', function (e) {
    if (!EDIT) return;
    e.preventDefault();
    var t = (e.clipboardData || window.clipboardData).getData('text/plain');
    if (t) document.execCommand('insertText', false, t.replace(/\r/g, ''));
  });

  // Seçimin B/I/U + yazı tipi/punto durumu araç çubuğuna yansır (150ms kısıtlı).
  var selTimer = null;
  function syncSelectionState() {
    if (!EDIT || !window.Kalem) return;
    var info = currentFontInfo();
    window.Kalem.postMessage(JSON.stringify({
      sel: {
        b: document.queryCommandState('bold'),
        i: document.queryCommandState('italic'),
        u: document.queryCommandState('underline'),
        font: info.font || '',
        size: info.size || 0
      }
    }));
  }
  document.addEventListener('selectionchange', function () {
    if (!EDIT || !window.Kalem) return;
    clearTimeout(selTimer);
    selTimer = setTimeout(syncSelectionState, 150);
  });

  function fmt(cmd) { // bold | italic | underline | justifyLeft/Center/Right/Full
    document.execCommand(cmd, false, null);
    if (cmd.indexOf('justify') === 0) { sendAligns(); return; }
    syncSelection();
    syncSelectionState();
  }

  // Hizalama paragrafın <p> stiline yazılır (yapı değişmez, eşleme bozulmaz);
  // seçimdeki her paragrafın yeni hizası Flutter'a {a:{i,v}} olarak bildirilir,
  // kaydetmede w:jc olur.
  function sendAligns() {
    var s = window.getSelection();
    if (!s || !s.anchorNode || !window.Kalem) return;
    var list = paraList();
    function idxOf(node) {
      while (node && node.nodeType !== 1) node = node.parentNode;
      var p = node && node.closest ? node.closest('p') : null;
      return p ? list.indexOf(p) : -1;
    }
    var a = idxOf(s.anchorNode), f = idxOf(s.focusNode);
    if (a < 0 && f < 0) return;
    if (a < 0) a = f;
    if (f < 0) f = a;
    var from = Math.min(a, f), to = Math.max(a, f);
    for (var k = from; k <= to; k++) {
      var ta = window.getComputedStyle(list[k]).textAlign;
      var v = ta === 'center' ? 'center'
        : (ta === 'right' || ta === 'end') ? 'right'
        : ta === 'justify' ? 'both' : 'left';
      window.Kalem.postMessage(JSON.stringify({ a: { i: k, v: v } }));
    }
  }

  function syncSelection() {
    var s = window.getSelection();
    if (!s || !s.anchorNode) return;
    var list = paraList();
    function idxOf(node) {
      while (node && node.nodeType !== 1) node = node.parentNode;
      var p = node && node.closest ? node.closest('p') : null;
      return p ? list.indexOf(p) : -1;
    }
    var a = idxOf(s.anchorNode), f = idxOf(s.focusNode);
    if (a < 0 && f < 0) return;
    if (a < 0) a = f;
    if (f < 0) f = a;
    var from = Math.min(a, f), to = Math.max(a, f);
    for (var k = from; k <= to; k++) sendPara(k, list[k]);
  }

  // ---- Belge içinde bul / değiştir ---------------------------------------
  // Slaytta ve Excel'de vardı, Word'de yoktu (KALANLAR maddesi). Arama DOM'a
  // hiç dokunmaz: eşleşme `Range` ile SEÇİLİR, tarayıcı kendi vurgusunu çizer.
  // Böylece bulmak paragraf eşlemesini bozamaz — düzenleme kapalıyken de
  // çalışır.
  var HITS = [];

  // Türkçe katlama: `toLocaleLowerCase('tr')` I→ı, İ→i doğru yapar; İngilizce
  // katlamada "İSTANBUL" ile "istanbul" eşleşmezdi.
  function fold(s) {
    try { return s.toLocaleLowerCase('tr'); } catch (e) { return s.toLowerCase(); }
  }

  // Paragrafın metin düğümleri, karakter ofsetleriyle: eşleşmeyi Range'e
  // çevirmek için hangi düğümün neresinde olduğunu bilmek gerekiyor.
  function textNodesOf(p) {
    var out = [];
    var at = 0;
    var walker = document.createTreeWalker(p, NodeFilter.SHOW_TEXT, null, false);
    var n;
    while ((n = walker.nextNode())) {
      var len = n.textContent.length;
      if (len) { out.push({ node: n, from: at, to: at + len }); at += len; }
    }
    return out;
  }

  function rangeAt(p, start, end) {
    var nodes = textNodesOf(p);
    var r = document.createRange();
    var set = 0;
    for (var k = 0; k < nodes.length; k++) {
      var t = nodes[k];
      if (set === 0 && start >= t.from && start < t.to) {
        r.setStart(t.node, start - t.from);
        set = 1;
      }
      if (set === 1 && end > t.from && end <= t.to) {
        r.setEnd(t.node, end - t.from);
        return r;
      }
    }
    return null;
  }

  window.findAll = function (q) {
    HITS = [];
    if (q) {
      var list = paraList();
      var needle = fold(q);
      for (var k = 0; k < list.length; k++) {
        var hay = fold(list[k].textContent || '');
        var at = hay.indexOf(needle);
        while (at >= 0) {
          HITS.push({ i: k, s: at, e: at + q.length });
          at = hay.indexOf(needle, at + Math.max(1, q.length));
        }
      }
    }
    if (window.Kalem) {
      window.Kalem.postMessage(JSON.stringify({ find: { n: HITS.length } }));
    }
  };

  window.findGo = function (k) {
    if (k < 0 || k >= HITS.length) return;
    var hit = HITS[k];
    var p = paraList()[hit.i];
    if (!p) return;
    var r = rangeAt(p, hit.s, hit.e);
    if (!r) return;
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(r);
    p.scrollIntoView({ block: 'center' });
  };

  // Tek bir eşleşmeyi değiştirir. Metin düğümü YERİNDE değişir, <p> sayısı
  // sabit kalır → paragraf eşlemesi güvende.
  window.replaceHit = function (k, text) {
    if (!EDIT || k < 0 || k >= HITS.length) return;
    var hit = HITS[k];
    var p = paraList()[hit.i];
    if (!p) return;
    var r = rangeAt(p, hit.s, hit.e);
    if (!r) return;
    r.deleteContents();
    if (text) r.insertNode(document.createTextNode(text));
    p.normalize();
    sendPara(hit.i, p);
  };

  // Tümünü değiştir: her paragraf tek geçişte yeniden kurulur.
  window.replaceAll = function (q, text) {
    if (!EDIT || !q) return;
    var list = paraList();
    var needle = fold(q);
    var count = 0;
    for (var k = 0; k < list.length; k++) {
      var p = list[k];
      var nodes = textNodesOf(p);
      var changed = false;
      for (var j = nodes.length - 1; j >= 0; j--) {
        var node = nodes[j].node;
        var src = node.textContent;
        var low = fold(src);
        var hitHere = false;
        // SAĞDAN SOLA değiştirilir: soldaki eşleşmelerin konumu bozulmasın.
        var at = low.lastIndexOf(needle);
        while (at >= 0) {
          src = src.substring(0, at) + text + src.substring(at + q.length);
          low = fold(src);
          count++;
          hitHere = true;
          at = low.lastIndexOf(needle, at - 1);
        }
        if (hitHere) { node.textContent = src; changed = true; }
      }
      if (changed) { p.normalize(); sendPara(k, p); }
    }
    HITS = [];
    if (window.Kalem) {
      window.Kalem.postMessage(JSON.stringify({ replaced: count }));
    }
  };

  // Sayfayı CSS zoom ile ekran genişliğine sığdırır: açılışta TÜM sayfa
  // görünür. pageW bir kez, zoom uygulanmadan ölçülür; döndürme/yeniden
  // boyutta aynı değerle yeniden sığdırılır.
  // Sağlamlaştırma: asenkron çizimde section henüz yerleşmemişse genişlik
  // 0/çok küçük gelir → ölçek uygulanmazdı ("sayfa sığmıyor" kök nedeni).
  // Bu durumda kısa aralıklarla yeniden denenir.
  var pageW = 0;
  var fitTries = 0;
  var FLOW = false;

  // Kullanıcının pinch/düğme ile eklediği çarpan. Sığdırma ölçeğiyle ÇARPILIR
  // ve tek bir CSS `zoom` olarak uygulanır: iki ayrı zoom (gövde + sarmalayıcı)
  // birbirini eziyordu, native pinch de üstüne biniyordu (bulanıklığın kaynağı).
  var USER = 1;
  var MIN_USER = 0.5, MAX_USER = 6;

  // Belgenin BÖLÜM düzeyi yönü (w:sectPr/w:bidi). docx-preview bunu yok
  // sayıyor, değer Flutter tarafında `DocxEditor.rightToLeft` ile okunup
  // buraya veriliyor. Sayfa çizildikten sonra da çağrılabilir (yalnız sınıf
  // ekler, yeniden çizim gerekmez).
  window.setDocDir = function (rtl) {
    document.body.classList.toggle('rtl', !!rtl);
    document.body.dir = rtl ? 'rtl' : 'ltr';
  };

  // Mobil akış / sayfa görünümü arasında geçiş. Akışta sığdırma ölçeği hiç
  // uygulanmaz; sayfaya dönerken genişlik yeniden ölçülür (pageW sıfırlanır).
  window.setFlow = function (on) {
    FLOW = !!on;
    document.body.classList.toggle('flow', FLOW);
    USER = 1;
    var wrap = document.querySelector('.docx-wrapper');
    if (FLOW) {
      if (wrap) wrap.style.zoom = '';
      reportZoom();
    } else {
      pageW = 0;
      fitTries = 0;
      fitPage();
    }
  };

  function viewportW() {
    return document.documentElement.clientWidth || window.innerWidth || 0;
  }

  // Sığdırma ölçeği (kullanıcı çarpanı hariç).
  function fitScale() {
    if (FLOW || !pageW) return 1;
    var vw = viewportW();
    return vw > 0 ? Math.min(1, vw / pageW) : 1;
  }

  function applyZoom() {
    var wrap = document.querySelector('.docx-wrapper');
    if (!wrap) return;
    // Akış görünümünde sığdırma yok, yalnız kullanıcı çarpanı geçerli.
    wrap.style.zoom = FLOW ? (USER === 1 ? '' : USER) : (fitScale() * USER);
    reportZoom();
  }

  function reportZoom() {
    if (window.Sayfa) {
      window.Sayfa.postMessage(JSON.stringify({ zoom: fitScale() * USER }));
    }
  }

  // Kullanıcı çarpanını [f] katına çıkarır; [ox]/[oy] odak noktasıdır
  /// (ekran koordinatı) — oradaki içerik yerinde kalsın diye kaydırma
  /// konumu ölçek oranıyla düzeltilir.
  window.zoomBy = function (f, ox, oy) {
    var before = USER;
    USER = Math.min(MAX_USER, Math.max(MIN_USER, USER * f));
    if (USER === before) return;
    var ratio = USER / before;
    var fx = typeof ox === 'number' ? ox : (window.innerWidth || 0) / 2;
    var fy = typeof oy === 'number' ? oy : (window.innerHeight || 0) / 2;
    var sx = window.pageXOffset, sy = window.pageYOffset;
    applyZoom();
    window.scrollTo((sx + fx) * ratio - fx, (sy + fy) * ratio - fy);
  };

  window.resetZoom = function () {
    USER = 1;
    applyZoom();
  };

  // JS pinch: native yakınlaştırma kapalı olduğu için iki parmak burada
  // yakalanır ve CSS zoom'a çevrilir → metin her ölçekte YENİDEN dizilir,
  // yani keskin kalır. Tek parmak dokunulmaz (normal kaydırma).
  var pinchDist = 0;
  var pinchUser = 1;
  function touchDistance(t) {
    var dx = t[0].clientX - t[1].clientX;
    var dy = t[0].clientY - t[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }
  document.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 2) { pinchDist = 0; return; }
    pinchDist = touchDistance(e.touches);
    pinchUser = USER;
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (e.touches.length !== 2 || !pinchDist) return;
    e.preventDefault(); // iki parmak = zoom, kaydırma değil
    var next = Math.min(MAX_USER,
        Math.max(MIN_USER, pinchUser * (touchDistance(e.touches) / pinchDist)));
    if (next === USER) return;
    var ratio = next / USER;
    var fx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    var fy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    var sx = window.pageXOffset, sy = window.pageYOffset;
    USER = next;
    applyZoom();
    window.scrollTo((sx + fx) * ratio - fx, (sy + fy) * ratio - fy);
  }, { passive: false });
  document.addEventListener('touchend', function () { pinchDist = 0; }, { passive: true });

  function fitPage() {
    if (FLOW) { applyZoom(); return; }
    var wrap = document.querySelector('.docx-wrapper');
    var sec = document.querySelector('.docx-wrapper > section.docx');
    if (!wrap || !sec) {
      if (fitTries++ < 20) setTimeout(fitPage, 150);
      return;
    }
    // Genişlik HER SEFERİNDE yeniden ölçülür (eskiden bir kez ölçülüp
    // önbelleğe alınıyordu): ilk ölçüm, docx-preview sayfayı yerleştirmeden
    // ya da fontlar yüklenmeden yapılırsa yanlış kalıyor ve bir daha
    // düzelmiyordu. Ölçümden önce zoom temizleniyor, yoksa kendi ölçeğimizi
    // ölçerdik.
    wrap.style.zoom = '';
    // `scrollWidth` DEĞİL `offsetWidth`: taşan bir tablo/başlık scrollWidth'i
    // şişirir ve SAYFAYI gereksiz yere küçültürdü — sayfa ekrana sığmalı,
    // taşan içerik yatayda kaydırılabilir.
    var w = sec.offsetWidth;
    if (w < 100) {
      if (fitTries++ < 20) setTimeout(fitPage, 150);
      return;
    }
    pageW = w + 16;
    applyZoom();

    // DOĞRULAMA TURU (2026-08-01 kullanıcı ekran görüntüsü: sayfa ekranın
    // ancak %59'unu kaplıyordu, yazı bu yüzden okunamayacak kadar küçüktü ve
    // "bulanık" görünüyordu). Ölçüme güvenmek yerine SONUCA bakılıyor: uygulanan
    // ölçekten sonra sayfa gerçekten ekranı dolduruyor mu? Doldurmuyorsa ölçek
    // bir kez düzeltilir. Hangi ölçüm yalan söylerse söylesin sonuç doğru olur.
    if (USER !== 1) return;
    var vw = viewportW();
    var shown = sec.getBoundingClientRect().width;
    if (vw <= 0 || shown <= 0) return;
    var err = (vw - 8) / shown;
    // Sayfa zaten ekrandan genişse (err < 1) küçültme yapılır; darsa büyütülür.
    // %2'lik sapma için uğraşmaya değmez.
    if (err > 1.02 || err < 0.98) {
      pageW = pageW / err;
      applyZoom();
    }
  }
  window.addEventListener('resize', fitPage);

  // ---- Sayfa sayacı -------------------------------------------------------
  // docx-preview her Word sayfasını ayrı bir <section class="docx"> olarak
  // çiziyor; toplam sayfa = section sayısı. Hangi sayfadayız, ekranın ÜST
  // ÇEYREĞİNDEKİ section'dan okunur (yarısı alınsaydı uzun bir sayfada
  // sayaç bir sonrakine erken atlardı).
  var pageCount = 0;
  var currentPage = 0;

  function sections() {
    return document.querySelectorAll('.docx-wrapper > section.docx');
  }

  function reportPages() {
    var secs = sections();
    if (secs.length !== pageCount) {
      pageCount = secs.length;
      if (window.Sayfa) {
        window.Sayfa.postMessage(JSON.stringify({ pages: pageCount }));
      }
    }
    updateCurrentPage();
  }

  function updateCurrentPage() {
    var secs = sections();
    if (!secs.length) return;
    var mark = (window.innerHeight || 0) * 0.25;
    var at = 1;
    for (var i = 0; i < secs.length; i++) {
      if (secs[i].getBoundingClientRect().top <= mark) at = i + 1;
    }
    if (at !== currentPage) {
      currentPage = at;
      if (window.Sayfa) {
        window.Sayfa.postMessage(JSON.stringify({ page: at }));
      }
    }
  }

  var pageTimer = null;
  window.addEventListener('scroll', function () {
    clearTimeout(pageTimer);
    pageTimer = setTimeout(updateCurrentPage, 80);
  }, { passive: true });

  // 1 tabanlı sayfaya kaydırır.
  window.goToPage = function (n) {
    var secs = sections();
    if (!secs.length) return;
    var i = Math.min(Math.max(1, n), secs.length) - 1;
    var top = secs[i].getBoundingClientRect().top + window.pageYOffset - 4;
    window.scrollTo(0, Math.max(0, top));
    updateCurrentPage();
  };

  function showError(e) {
    var el = document.getElementById('err');
    el.style.display = 'block';
    el.textContent = 'Belge görüntülenemedi: ' + e;
    report('hata: ' + e);
  }
</script>
