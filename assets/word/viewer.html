<!--
  Word görüntüleyici kabuğu. İnternet YOK: jszip + docx-preview aynı klasörden,
  APK içine gömülü olarak yüklenir. Flutter tarafı renderDocx(base64) çağırır.

<!-- TUZAK: meta viewport'u JS ile değiştirmek Android WebView'da yeniden
     sığdırma YAPMAZ. Bu yüzden sayfa CSS zoom ile ekrana sığdırılır (fitPage);
     viewport doğal ölçekte kalır.

     BULANIKLIK (2026-08-01 kullanıcı bulgusu): `user-scalable=yes` ile gelen
     NATIVE pinch, sayfayı yeniden dizmez — çizilmiş kareyi büyütür, yani
     yakınlaştıkça yazı bulanıklaşır. Artık native yakınlaştırma KAPALI;
     pinch aşağıdaki JS ile yakalanıp CSS `zoom`a çevriliyor, tarayıcı metni
     yeni ölçekte YENİDEN diziyor → her ölçekte keskin. (Aynı ilke PDF
     tarafında da uygulanmıştı: yeniden-yerleşim > dönüşüm.) -->
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  /* SADAKAT: Word belgeleri çoğunlukla Microsoft'un tescilli fontlarını
     (Calibri/Times New Roman/Arial) kullanır; Android WebView'da bunlar YOK →
     rastgele bir yerel fonta düşülür, harf genişlikleri değişir → satır ve

     erişilir (jszip.min.js ile aynı yerel file:// mekanizması). font-display
     block: doğru metrikle ölçülsün, yanlış fontla kısa bir çakma olmasın. */

  @font-face { font-family:'Calibri'; src:url('../fonts/Carlito-Bold.ttf'); font-weight:bold; font-style:normal; font-display:block; }
  @font-face { font-family:'Calibri'; src:url('../fonts/Carlito-Italic.ttf'); font-weight:normal; font-style:italic; font-display:block; }

  /* Modern Word başlık fontu Calibri Light → Carlito (ince ağırlık yok, düzenli) */
  @font-face { font-family:'Calibri Light'; src:url('../fonts/Carlito-Regular.ttf'); font-weight:normal; font-style:normal; font-display:block; }
  @font-face { font-family:'Times New Roman'; src:url('../fonts/Tinos-Regular.ttf'); font-weight:normal; font-style:normal; font-display:block; }
  @font-face { font-family:'Times New Roman'; src:url('../fonts/Tinos-Bold.ttf'); font-weight:bold; font-style:normal; font-display:block; }
  @font-face { font-family:'Times New Roman'; src:url('../fonts/Tinos-Italic.ttf'); font-weight:normal; font-style:italic; font-display:block; }
  @font-face { font-family:'Times New Roman'; src:url('../fonts/Tinos-BoldItalic.ttf'); font-weight:bold; font-style:italic; font-display:block; }
  /* Arimo değişken font: kalınlık wght ekseninden (100–900 aralığı) */
  @font-face { font-family:'Arial'; src:url('../fonts/Arimo-Variable.ttf'); font-weight:100 900; font-style:normal; font-display:block; }
  @font-face { font-family:'Arial'; src:url('../fonts/Arimo-Italic-Variable.ttf'); font-weight:100 900; font-style:italic; font-display:block; }
  @font-face { font-family:'Helvetica'; src:url('../fonts/Arimo-Variable.ttf'); font-weight:100 900; font-style:normal; font-display:block; }
  @font-face { font-family:'Helvetica'; src:url('../fonts/Arimo-Italic-Variable.ttf'); font-weight:100 900; font-style:italic; font-display:block; }
  /* Metrik-uyumlu olmasa da, tanımsız serif fontlar (Cambria/Georgia) için
     rastgele cihaz serifi yerine tam Türkçe kapsamlı Tinos daha tutarlı. */
  @font-face { font-family:'Cambria'; src:url('../fonts/Tinos-Regular.ttf'); font-weight:normal; font-style:normal; font-display:block; }
  @font-face { font-family:'Cambria'; src:url('../fonts/Tinos-Bold.ttf'); font-weight:bold; font-style:normal; font-display:block; }
  @font-face { font-family:'Cambria'; src:url('../fonts/Tinos-Italic.ttf'); font-weight:normal; font-style:italic; font-display:block; }
  /* Biçim çubuğundaki yazı tipi listesi genişledi (2026-08-07, `kDocFonts`):
     Android'de bu adların HİÇBİRİ kurulu değil, tanım olmadan seçilen font
     sessizce cihazın varsayılanına düşerdi ("seçtim ama değişmedi"). Serif
     olanlar Tinos'a, sans olanlar Arimo'ya eşlenir — Türkçe kapsamı tam. */
  @font-face { font-family:'Georgia'; src:url('../fonts/Tinos-Regular.ttf'); font-weight:normal; font-style:normal; font-display:block; }
  @font-face { font-family:'Georgia'; src:url('../fonts/Tinos-Bold.ttf'); font-weight:bold; font-style:normal; font-display:block; }
  @font-face { font-family:'Georgia'; src:url('../fonts/Tinos-Italic.ttf'); font-weight:normal; font-style:italic; font-display:block; }
  @font-face { font-family:'Garamond'; src:url('../fonts/Tinos-Regular.ttf'); font-weight:normal; font-style:normal; font-display:block; }
  @font-face { font-family:'Garamond'; src:url('../fonts/Tinos-Bold.ttf'); font-weight:bold; font-style:normal; font-display:block; }
  @font-face { font-family:'Book Antiqua'; src:url('../fonts/Tinos-Regular.ttf'); font-weight:normal; font-style:normal; font-display:block; }
  @font-face { font-family:'Book Antiqua'; src:url('../fonts/Tinos-Bold.ttf'); font-weight:bold; font-style:normal; font-display:block; }
  @font-face { font-family:'Verdana'; src:url('../fonts/Arimo-Variable.ttf'); font-weight:100 900; font-style:normal; font-display:block; }
  @font-face { font-family:'Verdana'; src:url('../fonts/Arimo-Italic-Variable.ttf'); font-weight:100 900; font-style:italic; font-display:block; }
  @font-face { font-family:'Tahoma'; src:url('../fonts/Arimo-Variable.ttf'); font-weight:100 900; font-style:normal; font-display:block; }
  @font-face { font-family:'Tahoma'; src:url('../fonts/Arimo-Italic-Variable.ttf'); font-weight:100 900; font-style:italic; font-display:block; }
  @font-face { font-family:'Segoe UI'; src:url('../fonts/Arimo-Variable.ttf'); font-weight:100 900; font-style:normal; font-display:block; }
  @font-face { font-family:'Segoe UI'; src:url('../fonts/Arimo-Italic-Variable.ttf'); font-weight:100 900; font-style:italic; font-display:block; }
  /* ARAPÇA/İBRANİCE/CJK: yukarıdaki ikameler (Carlito/Tinos/Arimo) YALNIZ
     Latin-Yunan-Kiril taşır. `unicode-range` olmadan tarayıcı "Calibri" adını
     görüp bu dosyaları yükler, Arapça harfleri onlarda arar ve bulamayınca
     davranışı belirsizleşir (kimi WebView sürümünde kutu/tofu). Kapsam açıkça
     sınırlanınca eksik harf için aile BOŞ kalır ve cihazın kendi Arapça fontuna
     (Android'de Noto Naskh Arabic) düşülür — metrik uyumu zaten Latin için
     anlamlı, Arapça'da kayıp yok. */
  @font-face { font-family:'Calibri'; src:local('Noto Naskh Arabic'), local('Droid Arabic Naskh'), local('Arial'); unicode-range: U+0590-05FF, U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB1D-FDFF, U+FE70-FEFF; }
  @font-face { font-family:'Times New Roman'; src:local('Noto Naskh Arabic'), local('Droid Arabic Naskh'), local('Arial'); unicode-range: U+0590-05FF, U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB1D-FDFF, U+FE70-FEFF; }
  @font-face { font-family:'Arial'; src:local('Noto Naskh Arabic'), local('Droid Arabic Naskh'); unicode-range: U+0590-05FF, U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB1D-FDFF, U+FE70-FEFF; }
  html, body { margin: 0; padding: 0; background: #f3f2f1; }
  /* Fonta hiç ad vermeyen (theme default) metin de rastgele cihaz fontuna
     düşmesin: son çare olarak Calibri metrikli Carlito. docx-preview çoğu
     çalıştırmada fontu açıkça yazar, bu yalnızca boşluğu doldurur. */
  #container { padding: 8px 0 24px; font-family: 'Calibri', 'Carlito', sans-serif; }
  /* Sağdan sola belge (bkz. setDocDir): docx-preview paragraf/çalıştırma
     düzeyindeki w:bidi'yi uyguluyor ama BÖLÜM düzeyindekini yok sayıyor.
     Açık hizalaması olmayan paragraflar bu kurala düşer; `w:jc` yazan
     paragraflar docx-preview'ın kendi satır-içi stiliyle korunur (o daha
     özgül) — yani dosyada yazan hizalama EZİLMEZ. */
  body.rtl #container { direction: rtl; }
  body.rtl .docx-wrapper section.docx p,
  body.rtl .docx-wrapper section.docx li,
  body.rtl .docx-wrapper section.docx table { direction: rtl; }
  /* docx-preview sayfayı beyaz bir "kağıt" olarak çizer; gölge ekleyip
     PowerPoint/Word hissini tamamlıyoruz. */
  .docx-wrapper { background: #f3f2f1 !important; padding: 8px !important; }
  .docx-wrapper > section.docx {
    box-shadow: 0 1px 6px rgba(0,0,0,.25);
    margin-bottom: 12px !important;
  }
  #err { font: 14px sans-serif; color: #b00020; padding: 16px; display: none; }

  /* MOBİL AKIŞ GÖRÜNÜMÜ (2026-07-28 kullanıcı bulgusu: "Word'de yazı kalitesi
     çok düşük"). Kök neden çözünürlük değil BOYUT: A4 sayfa 794 px, telefon
     ~411 px → fitPage ~0.5 ölçek → 11 punto yazı 5-6 piksele iniyor.
     Burada sayfanın sabit genişliği kaldırılır, paragraflar ekrana sarılır ve
     ölçek 1'de kalır → yazı GERÇEK boyutunda, yakınlaştırmadan okunur.
     Bedeli: Word'ün sayfa kırılımı/kenar boşlukları görünmez (sayfa görünümü
     tek dokunuşla geri gelir). `!important` şart: docx-preview genişliği
     satır içi stille yazıyor. */
  body.flow .docx-wrapper { padding: 0 !important; }
  body.flow .docx-wrapper > section.docx {
    width: auto !important;
    height: auto !important;
    min-height: 0 !important;
    padding: 12px !important;
    margin: 0 0 8px !important;
    box-shadow: none;
  }
  body.flow .docx-wrapper > section.docx > article { width: auto !important; }
  /* Sabit genişlikli tablo/görsel ekranı yatay taşırmasın. */
  body.flow table { max-width: 100% !important; }
  body.flow img { max-width: 100% !important; height: auto !important; }

  /* Kullanıcının bu oturumda verdiği madde/numara işaretleri. Paragraf <li>
     olmadığı için (bkz. setListStyle) işaret CSS'ten çizilir. Sayaç, liste
     OLMAYAN her paragrafta sıfırlanır: art arda gelen numaralı paragraflar
     1,2,3 sayar, araya düz metin girince yeni liste 1'den başlar — Word de
     böyle davranır. */
  /* Dokunulmaz ada (köprü, alan, dipnot başvurusu, sekme, resim — Faz 21):
     düzenlerken Word'ün alan gölgesi gibi hafifçe belli olur. */
  article[contenteditable="true"] .fk-island { background: rgba(0,0,0,.06); border-radius: 2px; }
  p:not([data-fk-list="number"]) { counter-reset: fklist; }
  p[data-fk-list] { padding-inline-start: 26px !important; position: relative; }
  p[data-fk-list="bullet"]::before {
    content: "\2022";
    position: absolute;
    inset-inline-start: 8px;
  }
  p[data-fk-list="number"] { counter-increment: fklist; }
  p[data-fk-list="number"]::before {
    content: counter(fklist) ".";
    position: absolute;
    inset-inline-start: 2px;
  }
</style>
<div id="container"></div>
<div id="err"></div>
<script src="jszip.min.js"></script>
<script src="docx-preview.min.js"></script>
<script>
  function report(msg) {
    if (window.Durum) window.Durum.postMessage(msg);
  }

  window.renderDocx = function (b64) {
    try {
      var bin = atob(b64);
      var buf = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
      docx.renderAsync(buf.buffer, document.getElementById('container'), null, {
        inWrapper: true,
        ignoreWidth: false,
        // SADAKAT: sayfa tam A4 yüksekliğinde çizilsin (kısa belgede altta boşluk
        // Word'deki gibi) — eski true, sayfayı içeriğe göre kısaltıyordu.
        ignoreHeight: false,
        breakPages: true,
        // SADAKAT: Word kaydederken sayfa kırma konumlarını (w:lastRenderedPageBreak)
        // belgeye yazar; false = onları KULLAN → sayfalama Word'le aynı yerde kırılır.
        // (Word'ün hiç açmadığı belgede bu işaretler yoktur → eski davranış, risksiz.)
        ignoreLastRenderedPageBreak: false,
        renderHeaders: true,
        renderFooters: true,
        renderFootnotes: true,
        renderEndnotes: true,
        experimental: true,
        useBase64URL: true
      }).then(function () {
        fixSymbolFonts();
        prepareMarkers();
        fitPage();
        reportPages();
        // Görseller/yerleşim geciken sayfalar için ikinci tur — sayfa sayısı
        // da orada kesinleşir (docx-preview section'ları asenkron ekleyebilir).
        setTimeout(function () { fitPage(); reportPages(); }, 400);
        // Aliaslı fontlar yüklenince metrikler değişir → yeniden sığdır (genişlik
        // sabit ama güvenli). document.fonts yoksa (eski WebView) sessiz geç.
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function () { fitPage(); reportPages(); });
        }
        report('ok');
      }).catch(function (e) {
        showError(e);
      });
    } catch (e) {
      showError(e);
    }
  };

  // ---- Symbol / Wingdings karakterleri -------------------------------------
  // KÖK NEDEN (kullanıcı 2026-10-22, ekran görüntüsüyle: "Word'te normalde
  // nokta simgesi var ama bizde görülmüyor"): Word madde imlerini ve w:sym
  // simgelerini Symbol / Wingdings yazı tiplerinin ÖZEL kod noktalarıyla
  // yazar (madde imi = Symbol U+F0B7, ok = Wingdings U+F0D8, onay =
  // Wingdings U+F0FC…). Bu yazı tipleri Android'de yok; yedek yazı tipinde
  // de U+F0xx glifi olmadığı için ▯ kutusu çiziliyordu. Burada karakterler
  // gerçek Unicode karşılıklarına çevrilir ve yazı tipi bildirimi kaldırılır.
  // Bilinmeyen özel karakter madde imi yerindeyse "•" olur.
  var SYMBOL_MAP = {
    0xB7: '\u2022', 0xD7: '\u22C5', 0xA7: '\u2663', 0xA8: '\u2666',
    0xA9: '\u2665', 0xAA: '\u2660', 0xAB: '\u2194', 0xAC: '\u2190',
    0xAD: '\u2191', 0xAE: '\u2192', 0xAF: '\u2193', 0xB0: '\u00B0',
    0xB1: '\u00B1', 0xB3: '\u2265', 0xA3: '\u2264', 0xB4: '\u00D7',
    0xB8: '\u00F7', 0xB9: '\u2260', 0xBB: '\u2248', 0xA5: '\u221E',
    0xD6: '\u221A', 0xE0: '\u25CA', 0xDE: '\u21D2', 0xDB: '\u21D4',
    0x2D: '\u2212', 0x2A: '\u2217', 0x22: '\u2200', 0x24: '\u2203'
  };
  // Yunan harfleri (Symbol'de a = α …).
  'abgdezhqiklmnxoprstufcyw'.split('').forEach(function (ch, k) {
    var lo = '\u03B1\u03B2\u03B3\u03B4\u03B5\u03B6\u03B7\u03B8\u03B9\u03BA\u03BB\u03BC\u03BD\u03BE\u03BF\u03C0\u03C1\u03C3\u03C4\u03C5\u03C6\u03C7\u03C8\u03C9'.charAt(k);
    var LAT = 'abgdezhqiklmnxoprstufcyw';
    SYMBOL_MAP[LAT.charCodeAt(k)] = lo;
    SYMBOL_MAP[LAT.toUpperCase().charCodeAt(k)] = lo.toUpperCase();
  });
  SYMBOL_MAP[0x6A] = '\u03D5'; SYMBOL_MAP[0x76] = '\u03D6'; SYMBOL_MAP[0x56] = '\u03C2';
  SYMBOL_MAP[0x4A] = '\u03D1';
  var WINGDINGS_MAP = {
    0x6C: '\u25CF', 0x6E: '\u25A0', 0x6F: '\u25A1', 0x71: '\u2751',
    0x72: '\u2752', 0x73: '\u2B27', 0x74: '\u29EB', 0x75: '\u25C6',
    0x76: '\u2756', 0x77: '\u2B25', 0xA7: '\u25AA', 0xA8: '\u25FB',
    0x9F: '\u2022', 0xA1: '\u25CB', 0xA4: '\u25C9', 0xD8: '\u27A2',
    0xD7: '\u27A4', 0xE0: '\u2192', 0xE8: '\u2794', 0xF0: '\u21E8',
    0xFC: '\u2713', 0xFB: '\u2717', 0xFE: '\u2611', 0xFD: '\u2612',
    0x4A: '\u263A', 0x4B: '\u2610', 0x4C: '\u2639', 0x46: '\u261E',
    0x2A: '\u2709', 0x28: '\u260E', 0x3F: '\u270D', 0x41: '\u270C',
    0x43: '\u261D', 0x44: '\u261F', 0x50: '\u2690', 0x51: '\u2708',
    0x52: '\u263C', 0x54: '\u2744', 0x58: '\u2720', 0x5B: '\u262F',
    0xAB: '\u2605', 0xB2: '\u2727', 0xA2: '\u25CE', 0x6D: '\u274D',
    0x70: '\u25FC', 0xF6: '\u2B60', 0xF7: '\u2B62', 0xEF: '\u21E6',
    0xE7: '\u2794', 0xD5: '\u232B', 0xFA: '\u25FC'
  };

  function symTable(font) {
    var f = (font || '').toLowerCase();
    // Wingdings 2/3 ve Webdings'in tabloları başka: yanlış simge çizmektense
    // madde iminde "•", metinde dokunma.
    if (/wingdings\s*[23]|webdings/.test(f)) return {};
    if (f.indexOf('wingdings') >= 0) return WINGDINGS_MAP;
    if (f.indexOf('symbol') >= 0) return SYMBOL_MAP;
    return null;
  }

  // [text] → Unicode; değişmediyse null. [bullet]: madde imi bağlamı.
  function mapSymbols(text, table, bullet) {
    var out = '', changed = false;
    for (var k = 0; k < text.length; k++) {
      var c = text.charCodeAt(k);
      var pua = c >= 0xF000 && c <= 0xF0FF;
      var code = pua ? c - 0xF000 : c;
      var rep = null;
      if (table && (pua || table === SYMBOL_MAP || table === WINGDINGS_MAP)) {
        rep = table[code] || null;
      } else if (pua) {
        // Yazı tipi bilinmiyor: madde iminde en olası Symbol/Wingdings.
        rep = SYMBOL_MAP[code] && code >= 0xA0 ? SYMBOL_MAP[code]
            : (WINGDINGS_MAP[code] || null);
      }
      if (!rep && pua) rep = bullet ? '\u2022' : null;
      if (rep) { out += rep; changed = true; } else { out += text.charAt(k); }
    }
    return changed ? out : null;
  }

  function fixSymbolFonts() {
    // 1) Madde imleri: docx-preview `p.docx-num-X-Y:before { content: "…";
    //    font-family: Symbol }` kuralları üretir.
    document.querySelectorAll('style').forEach(function (st) {
      var css = st.textContent;
      if (css.indexOf(':before') < 0) return;
      var next = css.replace(/([^{}]*:before\s*)\{([^{}]*)\}/g, function (all, sel, body) {
        var fm = /font-family:\s*([^;]+);?/i.exec(body);
        var table = fm ? symTable(fm[1]) : null;
        var changed = false;
        var nb = body.replace(/content:\s*"((?:[^"\\]|\\.)*)"/, function (m, txt) {
          var r = mapSymbols(txt, table, true);
          if (r === null) return m;
          changed = true;
          return 'content: "' + r + '"';
        });
        if (!changed) return all;
        if (fm && table) nb = nb.replace(fm[0], '');
        return sel + '{' + nb + '}';
      });
      if (next !== css) st.textContent = next;
    });
    // 2) Metin içindeki w:sym ve Symbol/Wingdings yazı tipli parçalar.
    document.querySelectorAll('#container span').forEach(function (sp) {
      if (sp.children.length) return;
      var table = symTable(sp.style.fontFamily);
      var txt = sp.textContent;
      var hasPua = /[\uF000-\uF0FF]/.test(txt);
      if (!table && !hasPua) return;
      var r = mapSymbols(txt, table, false);
      if (r === null) return;
      sp.setAttribute('data-fk-sym', txt);
      sp.setAttribute('data-fk-sym-shown', r);
      sp.textContent = r;
      if (table) sp.style.fontFamily = 'inherit';
    });
  }

  // ---- Canlı düzenleme köprüsü (Faz 21a, 2026-10-23) ----------------------
  // KİMLİK TABANLI EŞLEME: Flutter görünüme işaretli bir kopya gönderir; her
  // w:p'nin başında `_fkp<i>` yer imi vardır (docx-preview onu
  // <span id="_fkp<i>"> çizer). Eskiden "DOM'daki <p> sırası = document.xml
  // sırası" sayılıyordu; docx-preview Word'ün `w:lastRenderedPageBreak`
  // işaretinde paragrafı İKİYE böldüğü için Word'de kaydedilmiş çok sayfalı
  // belgelerde sayı tutmuyor, düzenleme hiç açılmıyordu (W1).
  // * <p data-fkp="i">  : modelin i. paragrafı (ilk parçası)
  // * <p data-fkc="i">  : sayfa kırmada bölünmüş i. paragrafın devamı
  // * <p data-fkx>      : modelde karşılığı olmayan (düzenlenemez)
  // DOKUNULMAZ ADALAR (W4): `_fkis<k>` … `_fkie<k>` arasındaki parça (köprü,
  // alan, dipnot başvurusu, sekme, resim …) contenteditable=false bir çipe
  // sarılır; parçalarda "￼" + ada kimliği olarak gider, XML'de özgün
  // düğüm yerinde kalır.
  var EDIT = false;
  var SPELL = true;
  var pending = {};
  var PARTS = [];          // model indeksi → [ilk parça, devam parçaları…]
  var KNOWN = new WeakSet(); // önceki hâli (base) Flutter'a gitmiş paragraflar
  var BASE = new Map();      // ilk parça → düzenleme öncesi parçalar
  var TOKEN = 0;

  function articles() {
    var a = document.querySelectorAll('.docx-wrapper section.docx article');
    return a.length ? a : document.querySelectorAll('.docx-wrapper section.docx');
  }

  function paraList() {
    var out = [];
    articles().forEach(function (a) {
      a.querySelectorAll('p').forEach(function (p) { out.push(p); });
    });
    return out;
  }

  // Çizimden hemen sonra bir kez: adalar sarılır, paragraflar işaretlenir.
  function prepareMarkers() {
    document.querySelectorAll('#container span[id^="_fkis"]').forEach(function (st) {
      var id = st.id.substring(5);
      var nodes = [], n = st.nextSibling, end = null;
      while (n) {
        if (n.nodeType === 1 && n.id === '_fkie' + id) { end = n; break; }
        nodes.push(n);
        n = n.nextSibling;
      }
      if (!end) { st.parentNode.removeChild(st); return; }
      var w = document.createElement('span');
      w.className = 'fk-island';
      w.setAttribute('contenteditable', 'false');
      w.setAttribute('data-fki', id);
      st.parentNode.insertBefore(w, st);
      nodes.forEach(function (x) { w.appendChild(x); });
      st.parentNode.removeChild(st);
      end.parentNode.removeChild(end);
    });
    document.querySelectorAll('#container span[id^="_fkie"]').forEach(function (e) {
      e.parentNode.removeChild(e);
    });
    document.querySelectorAll('#container span[id^="_fkp"]').forEach(function (m) {
      var p = m.closest('p');
      if (p) p.setAttribute('data-fkp', m.id.substring(4));
      m.parentNode.removeChild(m);
    });
    var arts = articles();
    for (var a = 0; a < arts.length; a++) {
      arts[a].querySelectorAll('p').forEach(function (p) {
        if (p.hasAttribute('data-fkp')) return;
        var art = arts[a];
        var prev = a > 0 ? arts[a - 1].lastElementChild : null;
        if (p.parentElement === art && p === art.firstElementChild &&
            prev && prev.tagName === 'P' && prev.hasAttribute('data-fkp')) {
          p.setAttribute('data-fkc', prev.getAttribute('data-fkp'));
        } else {
          p.setAttribute('data-fkx', '1');
          p.setAttribute('contenteditable', 'false');
        }
      });
    }
    indexParas();
  }

  function idxOfEl(p) {
    if (!p) return -1;
    var v = p.getAttribute('data-fkp');
    if (v === null) v = p.getAttribute('data-fkc');
    return v === null ? -1 : parseInt(v, 10);
  }

  // Bir düğümün ait olduğu model paragrafı (-1: düzenlenebilir değil).
  function idxAtNode(n) {
    while (n && n.nodeType !== 1) n = n.parentNode;
    while (n && n.closest) {
      var p = n.closest('p');
      if (!p) return -1;
      var i = idxOfEl(p);
      if (i >= 0) return i;
      n = p.parentNode;
    }
    return -1;
  }

  function indexParas() {
    PARTS = [];
    paraList().forEach(function (p) {
      var i = idxOfEl(p);
      if (i < 0) return;
      if (!PARTS[i]) PARTS[i] = [];
      if (p.hasAttribute('data-fkp')) PARTS[i].unshift(p); else PARTS[i].push(p);
    });
  }

  // İşaretli paragraf sayısı; delik varsa -1 (eşleme güvensiz).
  function markedCount() {
    for (var k = 0; k < PARTS.length; k++) {
      if (!PARTS[k] || !PARTS[k][0] || !PARTS[k][0].hasAttribute('data-fkp')) return -1;
    }
    return PARTS.length;
  }

  function post(o) { if (window.Kalem) window.Kalem.postMessage(JSON.stringify(o)); }

  function setEditable(on, spell) {
    EDIT = !!on;
    if (typeof spell === 'boolean') SPELL = spell;
    articles().forEach(function (a) {
      a.contentEditable = EDIT ? 'true' : 'false';
      // Telefon klavyesinin yarısı (yazım denetimi, otomatik düzeltme,
      // cümle başı büyük harf) artık açık (W8); ayardan kapatılabilir.
      a.spellcheck = EDIT && SPELL;
      a.setAttribute('autocorrect', SPELL ? 'on' : 'off');
      a.setAttribute('autocapitalize', SPELL ? 'sentences' : 'off');
    });
    if (EDIT) indexParas();
    if (!EDIT && document.activeElement) document.activeElement.blur();
    // Düzenleme açılınca imleç İLK paragrafa konur ve klavye açılır.
    if (EDIT) focusStart();
    // Flutter, işaretli paragraf sayısını kendi listesiyle karşılaştırır.
    if (EDIT) post({ n: markedCount() });
    postHist();
  }

  function focusStart() {
    var host = articles()[0];
    if (!host) return;
    try {
      host.focus({ preventScroll: true });
      var first = PARTS[0] && PARTS[0][0];
      if (!first) return;
      var range = document.createRange();
      range.setStart(first, 0);
      range.collapse(true);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    } catch (e) { /* seçim API'si yoksa: odak yeter */ }
  }

  // Beklenmedik yapı (tarayıcı kendi <p>'sini üretti): sigorta.
  function structureOk() {
    var bad = false;
    articles().forEach(function (a) {
      a.querySelectorAll('p').forEach(function (p) {
        if (!p.hasAttribute('data-fkp') && !p.hasAttribute('data-fkc') &&
            !p.hasAttribute('data-fkx')) bad = true;
      });
    });
    if (bad) post({ n: -1 });
    return !bad;
  }

  // Bir parça = [metin, kalın, italik, altçizgi, yazıTipi|null, punto|null,
  // renk|null, vurgu|null, üstüÇizili, adaKimliği|undefined]. Yazı tipi /
  // punto / renk / vurgu YALNIZ kullanıcı açıkça seçtiyse (data-fk-* işareti)
  // doldurulur — hesaplanmış değeri göndermek stilden gelen biçimi satır içi
  // dondururdu.
  function segsOfEl(p, out) {
    function walk(node, b, i, u, col, hl, font, size, s) {
      if (node.nodeType === 3) {
        if (node.textContent) out.push([node.textContent, b, i, u, font, size, col, hl, s]);
        return;
      }
      if (node.nodeType !== 1) return;
      var isl = node.getAttribute('data-fki');
      if (isl !== null) {
        out.push(['￼', b, i, u, font, size, col, hl, s, parseInt(isl, 10)]);
        return;
      }
      var sym = node.getAttribute('data-fk-sym');
      var shown = node.getAttribute('data-fk-sym-shown');
      if (sym !== null && shown !== null && node.textContent.indexOf(shown) === 0) {
        out.push([sym, b, i, u, font, size, col, hl, s]);
        var rest = node.textContent.substring(shown.length);
        if (rest) out.push([rest, b, i, u, font, size, col, hl, s]);
        return;
      }
      if (node.nodeName === 'BR') {
        // Tarayıcının boş satıra koyduğu sondaki <br> metin değildir.
        var trailing = node.nextSibling === null && node.parentNode === p;
        if (!node.hasAttribute('data-fk-ph') && !trailing) {
          out.push(['\n', b, i, u, font, size, col, hl, s]);
        }
        return;
      }
      var cs = window.getComputedStyle(node);
      var nb = b || parseInt(cs.fontWeight, 10) >= 600 || cs.fontWeight === 'bold';
      var ni = i || cs.fontStyle === 'italic';
      var deco = cs.textDecorationLine || cs.textDecoration || '';
      var nu = u || deco.indexOf('underline') >= 0;
      var ns = s || deco.indexOf('line-through') >= 0;
      var nc = node.getAttribute('data-fk-color') || col;
      var nh = node.getAttribute('data-fk-hl') || hl;
      var nf = node.getAttribute('data-fk-font') || font;
      var sa = node.getAttribute('data-fk-size');
      var nsz = sa ? parseFloat(sa) : size;
      for (var c = node.firstChild; c; c = c.nextSibling) {
        walk(c, nb, ni, nu, nc, nh, nf, nsz, ns);
      }
    }
    walk(p, false, false, false, null, null, null, null, false);
    return out;
  }

  function segsOf(i) {
    var out = [];
    (PARTS[i] || []).forEach(function (p) { segsOfEl(p, out); });
    return out;
  }

  // Düzenleme ÖNCESİ hâl: ilk değişiklikte bir kez alınır, Flutter fark
  // hesabını buna göre yapar (el değmeyen run'lar ve biçimleri korunur).
  function captureBase(i) {
    var main = PARTS[i] && PARTS[i][0];
    if (!main || KNOWN.has(main) || BASE.has(main)) return;
    BASE.set(main, segsOf(i));
  }

  function takeBase(i) {
    var main = PARTS[i] && PARTS[i][0];
    if (!main) return undefined;
    var b = BASE.get(main);
    if (b === undefined && !KNOWN.has(main)) b = segsOf(i);
    BASE.delete(main);
    KNOWN.add(main);
    return b;
  }

  function sendPara(idx) {
    clearTimeout(pending[idx]);
    delete pending[idx];
    if (!PARTS[idx] || !structureOk()) return;
    var msg = { i: idx, segs: segsOf(idx) };
    var base = takeBase(idx);
    if (base !== undefined) msg.base = base;
    post(msg);
  }

  // Bekleyen (gecikmeli) gönderimleri hemen yollar — yapısal bir işlemden
  // önce Flutter'ın modeli DOM ile aynı olmalı.
  function flushAll() {
    Object.keys(pending).forEach(function (k) { sendPara(parseInt(k, 10)); });
  }

  function paraAtCaret() {
    var s = window.getSelection();
    var i = s && s.anchorNode ? idxAtNode(s.anchorNode) : -1;
    return i >= 0 && PARTS[i] ? PARTS[i][0] : null;
  }

  window.caretParaIndex = function () {
    var s = window.getSelection();
    return s && s.anchorNode ? idxAtNode(s.anchorNode) : -1;
  };

  // ---- Geri al / yinele (W5) ---------------------------------------------
  // Paragraf düzeyi anlık görüntüler (innerHTML). Yazma birleşir: aynı
  // paragrafta 1 sn içindeki ardışık yazım tek adım; boşlukta (kelime
  // sınırı) kesilir — Word gibi. Yapısal işlemler (böl/birleştir/çoklu sil)
  // Flutter'daki XML anlık görüntüsüyle (token) birlikte geri alınır.
  var UNDO = [], REDO = [];
  var MAXH = 200;

  function shellOf(p) {
    var o = {};
    for (var k = 0; k < p.attributes.length; k++) {
      var a = p.attributes[k];
      if (a.name === 'data-fkp' || a.name === 'data-fkc') continue;
      o[a.name] = a.value;
    }
    return o;
  }

  function snapPara(i) {
    var parts = PARTS[i] || [];
    return {
      shell: parts[0] ? shellOf(parts[0]) : {},
      html: parts.map(function (p) { return p.innerHTML; })
    };
  }

  function pushHist(e) {
    UNDO.push(e);
    if (UNDO.length > MAXH) UNDO.shift();
    REDO = [];
    postHist();
  }

  function postHist() {
    post({ hist: { u: EDIT && UNDO.length > 0, r: EDIT && REDO.length > 0 } });
  }

  // Yazma / biçim adımı: [idxs] paragraflarının önceki hâli.
  function noteEdit(idxs, typing, data) {
    var now = Date.now();
    var top = UNDO[UNDO.length - 1];
    if (typing && top && top.kind === 'edit' && top.typing &&
        top.idxs.length === 1 && top.idxs[0] === idxs[0] &&
        now - top.t < 1000 && !top.closed) {
      top.t = now;
      if (data && /\s/.test(data)) top.closed = true;
      return;
    }
    var before = {};
    idxs.forEach(function (i) { before[i] = snapPara(i); });
    pushHist({ kind: 'edit', idxs: idxs.slice(), before: before, typing: !!typing,
      t: now, closed: !!(data && /\s/.test(data)) });
  }

  function restorePara(i, snap) {
    var parts = PARTS[i] || [];
    if (parts.length === snap.html.length) {
      parts.forEach(function (p, k) { p.innerHTML = snap.html[k]; });
    } else if (parts[0]) {
      parts[0].innerHTML = snap.html.join('');
      for (var k = 1; k < parts.length; k++) parts[k].innerHTML = '';
    }
  }

  // [i]'den başlayan [count] paragrafı [items] ile değiştirir (yapısal geri
  // al/yinele). Yeni paragraflar ilk paragrafın sayfasına konur.
  function replaceRange(i, count, items) {
    var anchor = PARTS[i] && PARTS[i][0];
    if (!anchor) return;
    var mark = document.createComment('fk');
    anchor.parentNode.insertBefore(mark, anchor);
    for (var k = i; k < i + count; k++) {
      (PARTS[k] || []).forEach(function (p) {
        if (p.parentNode) p.parentNode.removeChild(p);
      });
    }
    renumber(i + count, items.length - count);
    items.forEach(function (it, k) {
      var p = document.createElement('p');
      Object.keys(it.shell).forEach(function (n) { p.setAttribute(n, it.shell[n]); });
      p.innerHTML = it.html.join('');
      p.setAttribute('data-fkp', '' + (i + k));
      mark.parentNode.insertBefore(p, mark);
      KNOWN.add(p);
    });
    mark.parentNode.removeChild(mark);
    indexParas();
  }

  function undoRedo(isUndo) {
    if (!EDIT) return;
    flushAll();
    var e = (isUndo ? UNDO : REDO).pop();
    if (!e) return;
    if (e.kind === 'edit') {
      var other = {};
      e.idxs.forEach(function (i) { other[i] = snapPara(i); });
      e.idxs.forEach(function (i) { restorePara(i, e.before[i]); });
      e.before = other;
      e.idxs.forEach(function (i) { sendPara(i); });
    } else {
      var from = isUndo ? e.after : e.before;
      var to = isUndo ? e.before : e.after;
      replaceRange(e.i, from.length, to);
      var segs = [];
      for (var k = 0; k < to.length; k++) segs.push(segsOf(e.i + k));
      post({ restore: e.tok, undo: isUndo, segs: segs });
    }
    (isUndo ? REDO : UNDO).push(e);
    postHist();
  }
  window.undoEdit = function () { undoRedo(true); };
  window.redoEdit = function () { undoRedo(false); };

  // ---- Yapısal işlemler (W2/W3) ---------------------------------------------
  function renumber(from, delta) {
    if (!delta) return;
    document.querySelectorAll('#container p[data-fkp], #container p[data-fkc]').forEach(function (p) {
      var a = p.hasAttribute('data-fkp') ? 'data-fkp' : 'data-fkc';
      var v = parseInt(p.getAttribute(a), 10);
      if (v >= from) p.setAttribute(a, '' + (v + delta));
    });
  }

  // Düğümler arası atom sayısı (harf, satır sonu ve ada birer).
  function atomsIn(node) {
    if (node.nodeType === 3) return node.textContent.length;
    if (node.nodeType !== 1 && node.nodeType !== 11) return 0;
    if (node.nodeType === 1) {
      if (node.getAttribute('data-fki') !== null) return 1;
      if (node.nodeName === 'BR') return node.hasAttribute && node.hasAttribute('data-fk-ph') ? 0 : 1;
      var sym = node.getAttribute('data-fk-sym');
      if (sym !== null) return sym.length + Math.max(0,
          node.textContent.length - (node.getAttribute('data-fk-sym-shown') || '').length);
    }
    var n = 0;
    for (var c = node.firstChild; c; c = c.nextSibling) n += atomsIn(c);
    return n;
  }

  // İmlecin [i] paragrafındaki atom konumu (devam parçaları dahil).
  function caretOffset(i, r) {
    var parts = PARTS[i];
    var n = 0;
    for (var k = 0; k < parts.length; k++) {
      var p = parts[k];
      if (p.contains(r.startContainer) || p === r.startContainer) {
        var pre = document.createRange();
        pre.setStart(p, 0);
        pre.setEnd(r.startContainer, r.startOffset);
        return n + atomsIn(pre.cloneContents());
      }
      n += atomsIn(p);
    }
    return n;
  }

  function placeholder(p) {
    if (!p.firstChild || (p.textContent === '' && !p.querySelector('[data-fki],img,br'))) {
      var br = document.createElement('br');
      br.setAttribute('data-fk-ph', '1');
      p.appendChild(br);
    }
  }

  function dropPlaceholders(p) {
    p.querySelectorAll('br[data-fk-ph]').forEach(function (b) { b.parentNode.removeChild(b); });
  }

  function caretAt(node, offset) {
    var r = document.createRange();
    r.setStart(node, offset);
    r.collapse(true);
    var s = window.getSelection();
    s.removeAllRanges();
    s.addRange(r);
  }

  // Enter: imleçte paragrafı böler. Yeni paragraf aynı biçimdedir.
  function splitAtCaret() {
    var s = window.getSelection();
    if (!s || !s.rangeCount) return;
    var r = s.getRangeAt(0);
    if (!r.collapsed) { r.deleteContents(); r = s.getRangeAt(0); }
    var i = idxAtNode(r.startContainer);
    if (i < 0 || !PARTS[i]) return;
    flushAll();
    var base = takeBase(i);
    var at = caretOffset(i, r);
    var before = [snapPara(i)];
    var parts = PARTS[i];
    var k = 0;
    while (k < parts.length && !parts[k].contains(r.startContainer) && parts[k] !== r.startContainer) k++;
    if (k >= parts.length) k = parts.length - 1;
    var host = parts[k];
    var tail = document.createRange();
    tail.setStart(r.startContainer, r.startOffset);
    tail.setEnd(host, host.childNodes.length);
    var frag = tail.extractContents();
    var np = document.createElement('p');
    var sh = shellOf(host);
    Object.keys(sh).forEach(function (n) { np.setAttribute(n, sh[n]); });
    np.removeAttribute('data-fkx');
    np.appendChild(frag);
    host.parentNode.insertBefore(np, host.nextSibling);
    renumber(i + 1, 1);
    np.setAttribute('data-fkp', '' + (i + 1));
    // Bölünen paragrafın sonraki sayfadaki devamı artık yeni paragrafın.
    for (var j = k + 1; j < parts.length; j++) parts[j].setAttribute('data-fkc', '' + (i + 1));
    dropPlaceholders(host);
    placeholder(host);
    dropPlaceholders(np);
    placeholder(np);
    KNOWN.add(np);
    indexParas();
    caretAt(np, 0);
    var tok = ++TOKEN;
    var msg = { split: i, at: at, a: segsOf(i), b: segsOf(i + 1), tok: tok };
    if (base !== undefined) msg.base = base;
    post(msg);
    pushHist({ kind: 'struct', tok: tok, i: i, before: before,
      after: [snapPara(i), snapPara(i + 1)] });
  }

  function sameContainer(a, b) {
    if (!a || !b) return false;
    if (a.parentElement === b.parentElement) return true;
    var aa = a.parentElement && a.parentElement.tagName === 'ARTICLE';
    var bb = b.parentElement && b.parentElement.tagName === 'ARTICLE';
    return aa && bb;
  }

  // Geri silme paragraf başında / ileri silme paragraf sonunda: [i]'yi
  // bir öncekine katar.
  function mergeInto(i) {
    if (i <= 0 || !PARTS[i] || !PARTS[i - 1]) return;
    var prevParts = PARTS[i - 1], cur = PARTS[i];
    var target = prevParts[prevParts.length - 1];
    if (!sameContainer(target, cur[0])) return;
    flushAll();
    var baseA = takeBase(i - 1), baseB = takeBase(i);
    var before = [snapPara(i - 1), snapPara(i)];
    dropPlaceholders(target);
    var junction = target.childNodes.length;
    var main = cur[0];
    dropPlaceholders(main);
    while (main.firstChild) target.appendChild(main.firstChild);
    main.parentNode.removeChild(main);
    for (var k = 1; k < cur.length; k++) cur[k].setAttribute('data-fkc', '' + (i - 1));
    renumber(i + 1, -1);
    placeholder(target);
    indexParas();
    try { caretAt(target, Math.min(junction, target.childNodes.length)); } catch (e) {}
    var tok = ++TOKEN;
    var msg = { merge: i, segs: segsOf(i - 1), tok: tok };
    if (baseA !== undefined) msg.baseA = baseA;
    if (baseB !== undefined) msg.baseB = baseB;
    post(msg);
    pushHist({ kind: 'struct', tok: tok, i: i - 1, before: before, after: [snapPara(i - 1)] });
  }

  // Birden çok paragrafı kapsayan seçimi siler (+ yazılan metni koyar).
  function deleteAcross(r, text) {
    var a = idxAtNode(r.startContainer), b = idxAtNode(r.endContainer);
    if (a < 0 || b < 0 || b <= a) return false;
    for (var k = a + 1; k <= b; k++) {
      if (!PARTS[k] || !sameContainer(PARTS[k - 1][PARTS[k - 1].length - 1], PARTS[k][0])) return false;
    }
    flushAll();
    var bases = [], before = [];
    for (var j = a; j <= b; j++) { bases.push(takeBase(j)); before.push(snapPara(j)); }
    var startHost = null;
    PARTS[a].forEach(function (p) { if (p.contains(r.startContainer) || p === r.startContainer) startHost = p; });
    var endParts = PARTS[b];
    r.deleteContents();
    var target = startHost || PARTS[a][0];
    var src = null;
    endParts.forEach(function (p) { if (p.parentNode && !src) src = p; });
    var caretNode = target, caretOff = target.childNodes.length;
    var s = window.getSelection();
    if (s.rangeCount) { caretNode = s.getRangeAt(0).startContainer; caretOff = s.getRangeAt(0).startOffset; }
    if (src && src !== target) {
      dropPlaceholders(src);
      while (src.firstChild) target.appendChild(src.firstChild);
      src.parentNode.removeChild(src);
    }
    for (var m = a + 1; m <= b; m++) {
      (PARTS[m] || []).forEach(function (p) {
        if (!p.parentNode) return;
        if (p.hasAttribute('data-fkc') && m === b) { p.setAttribute('data-fkc', '' + a); return; }
        if (p.textContent === '' && !p.querySelector('[data-fki]')) p.parentNode.removeChild(p);
        else p.setAttribute('data-fkc', '' + a);
      });
    }
    renumber(b + 1, -(b - a));
    indexParas();
    try { caretAt(caretNode, caretOff); } catch (e) {}
    if (text) document.execCommand('insertText', false, text);
    dropPlaceholders(target);
    placeholder(target);
    var tok = ++TOKEN;
    post({ mrange: [a, b], bases: bases, segs: segsOf(a), tok: tok });
    pushHist({ kind: 'struct', tok: tok, i: a, before: before, after: [snapPara(a)] });
    return true;
  }

  function rangeIsAtStart(i, r) {
    var main = PARTS[i][0];
    if (!(main.contains(r.startContainer) || main === r.startContainer)) return false;
    var pre = document.createRange();
    pre.setStart(main, 0);
    pre.setEnd(r.startContainer, r.startOffset);
    return atomsIn(pre.cloneContents()) === 0;
  }

  function rangeIsAtEnd(i, r) {
    var parts = PARTS[i];
    var last = parts[parts.length - 1];
    if (!(last.contains(r.startContainer) || last === r.startContainer)) return false;
    var post_ = document.createRange();
    post_.setStart(r.startContainer, r.startOffset);
    post_.setEnd(last, last.childNodes.length);
    return atomsIn(post_.cloneContents()) === 0;
  }

  document.addEventListener('beforeinput', function (e) {
    if (!EDIT) return;
    var s = window.getSelection();
    if (!s || !s.rangeCount) return;
    var r = s.getRangeAt(0);
    var t = e.inputType || '';
    var a = idxAtNode(r.startContainer), b = idxAtNode(r.endContainer);
    if (a < 0) return;
    if (t === 'insertParagraph') {
      e.preventDefault();
      if (!r.collapsed && b > a && !deleteAcross(r, null)) return;
      splitAtCaret();
      return;
    }
    if (!r.collapsed && b > a) {
      e.preventDefault();
      var text = (t === 'insertText' || t === 'insertReplacementText') ? e.data : null;
      deleteAcross(r, text);
      return;
    }
    if (r.collapsed && t === 'deleteContentBackward' && rangeIsAtStart(a, r)) {
      e.preventDefault();
      mergeInto(a);
      return;
    }
    if (r.collapsed && t === 'deleteContentForward' && rangeIsAtEnd(a, r)) {
      e.preventDefault();
      if (PARTS[a + 1]) mergeInto(a + 1);
      return;
    }
    captureBase(a);
    noteEdit([a], t.indexOf('insert') === 0 || t.indexOf('delete') === 0, e.data);
  });

  document.addEventListener('input', function () {
    if (!EDIT) return;
    var p = paraAtCaret();
    if (!p) { structureOk(); return; }
    var idx = idxOfEl(p);
    dropPlaceholders(p);
    clearTimeout(pending[idx]);
    pending[idx] = setTimeout(function () { sendPara(idx); }, 250);
  });

  // Enter = yeni paragraf (Shift+Enter satır sonu). Android klavyelerinin
  // bir kısmı beforeinput yerine yalnız keydown 13 yollar — iki yol da aynı
  // işe çıkar.
  document.addEventListener('keydown', function (e) {
    if (!EDIT) return;
    if (e.key === 'Enter' || e.keyCode === 13) {
      e.preventDefault();
      if (e.shiftKey) {
        var i = window.caretParaIndex();
        if (i >= 0) { captureBase(i); noteEdit([i], false); }
        document.execCommand('insertLineBreak');
      } else {
        var s = window.getSelection();
        if (s && s.rangeCount) {
          var r = s.getRangeAt(0);
          var a = idxAtNode(r.startContainer), b = idxAtNode(r.endContainer);
          if (!r.collapsed && b > a && !deleteAcross(r, null)) return;
        }
        splitAtCaret();
      }
    }
  });

  // Yapıştırma düz metin; satır sonları yeni paragraf olur.
  document.addEventListener('paste', function (e) {
    if (!EDIT) return;
    e.preventDefault();
    var t = (e.clipboardData || window.clipboardData).getData('text/plain');
    if (!t) return;
    var lines = t.replace(/\r/g, '').split('\n');
    var s = window.getSelection();
    if (s && s.rangeCount) {
      var r = s.getRangeAt(0);
      var a = idxAtNode(r.startContainer), b = idxAtNode(r.endContainer);
      if (!r.collapsed && b > a) deleteAcross(r, null);
    }
    lines.forEach(function (line, k) {
      if (k > 0) splitAtCaret();
      var i = window.caretParaIndex();
      if (i >= 0) { captureBase(i); noteEdit([i], false); }
      if (line) document.execCommand('insertText', false, line);
    });

  // ---- Yazı rengi ve vurgu ------------------------------------------------
  function rgbToHex(v) {
    if (!v) return null;
    var m = v.match(/rgba?\((\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
    if (!m) return v.charAt(0) === '#' ? v.substring(1).toUpperCase() : null;
    function h(n) { var s = parseInt(n, 10).toString(16).toUpperCase(); return s.length < 2 ? '0' + s : s; }
    return h(m[1]) + h(m[2]) + h(m[3]);
  }

  function markInline(p) {
    var els = [p].concat([].slice.call(p.querySelectorAll('[style]')));
    for (var k = 0; k < els.length; k++) {
      var el = els[k];
      var c = rgbToHex(el.style.color);
      var bg = rgbToHex(el.style.backgroundColor);
      if (c) el.setAttribute('data-fk-color', c);
      if (bg) el.setAttribute('data-fk-hl', bg);
    }
  }

  // Seçimdeki model paragrafları: [{i, p: ilk parça, parts}].
  function selectedParas() {
    var s = window.getSelection();
    if (!s || !s.anchorNode) return [];
    var a = idxAtNode(s.anchorNode), f = idxAtNode(s.focusNode);
    if (a < 0 && f < 0) return [];
    if (a < 0) a = f;
    if (f < 0) f = a;
    var out = [];
    for (var k = Math.min(a, f); k <= Math.max(a, f); k++) {
      if (PARTS[k]) out.push({ i: k, p: PARTS[k][0], parts: PARTS[k] });
    }
    return out;
  }

  // Biçim işleminden önce: önceki hâl + geri al adımı.
  function beforeFormat() {
    var list = selectedParas();
    if (!list.length) return list;
    flushAll();
    list.forEach(function (e) { captureBase(e.i); });
    noteEdit(list.map(function (e) { return e.i; }), false);
    return list;
  }

  function applyInline(cmd, hex, attr) {
    if (!EDIT) return;
    var paras = beforeFormat();
    document.execCommand('styleWithCSS', false, true);
    if (hex) {
      document.execCommand(cmd, false, '#' + hex);
    } else {
      paras.forEach(function (e) {
        e.parts.forEach(function (p) {
          var els = p.querySelectorAll('[' + attr + ']');
          for (var k = 0; k < els.length; k++) {
            els[k].removeAttribute(attr);
            if (attr === 'data-fk-color') els[k].style.color = '';
            else els[k].style.backgroundColor = '';
          }
        });
      });
    }
    paras.forEach(function (e) {
      e.parts.forEach(markInline);
      sendPara(e.i);
    });
  }

  // ---- Madde işareti / numaralandırma -------------------------------------
  // `execCommand('insertUnorderedList')` BİLİNÇLİ olarak kullanılmıyor: <p>'yi
  // <li>'ye çevirip yapıyı bozar. Liste PARAGRAF ÖZELLİĞİ: işaret CSS'ten
  // çizilir, Word tarafında `w:numPr` olur.
  window.setListStyle = function (kind) {
    if (!EDIT) return;
    selectedParas().forEach(function (e) {
      var off = kind === 'none' || e.p.getAttribute('data-fk-list') === kind;
      e.parts.forEach(function (p) {
        if (off) p.removeAttribute('data-fk-list'); else p.setAttribute('data-fk-list', kind);
      });
      post({ list: { i: e.i, v: off ? 'none' : kind } });
    });
    syncSelectionState();
  };

  window.setTextColor = function (hex) {
    applyInline('foreColor', hex || null, 'data-fk-color');
  };
  window.setHighlight = function (hex) {
    applyInline('hiliteColor', hex || null, 'data-fk-hl');
  };

  var SAVED_RANGE = null;

  window.sendSelectionText = function () {
    var s = window.getSelection();
    var t = s ? s.toString() : '';
    SAVED_RANGE = (s && s.rangeCount) ? s.getRangeAt(0).cloneRange() : null;
    post({ seltext: t });
  };

  // AI/çeviri sonucunu saklanan seçimin yerine yazar (tek paragraf içinde).
  window.replaceSelectionText = function (text) {
    if (!EDIT || !SAVED_RANGE) return;
    var i = idxAtNode(SAVED_RANGE.startContainer);
    if (i >= 0) {
      flushAll();
      captureBase(i);
      noteEdit([i], false);
    }
    SAVED_RANGE.deleteContents();
    if (text) SAVED_RANGE.insertNode(document.createTextNode(text));
    if (i >= 0) {
      PARTS[i].forEach(function (p) { p.normalize(); });
      sendPara(i);
    }
    SAVED_RANGE = null;
  };

  // ---- Yazı tipi ve punto -------------------------------------------------
  function applyToSelection(kind, value) {
    var s = window.getSelection();
    if (!EDIT || !s || !s.rangeCount || s.isCollapsed) return false;
    var paras = beforeFormat();
    if (!paras.length) return false;
    document.execCommand('styleWithCSS', false, true);
    if (kind === 'size') {
      document.execCommand('fontSize', false, '7');
    } else {
      document.execCommand('fontName', false, value);
    }
    paras.forEach(function (e) {
      e.parts.forEach(function (part) {
        var els = [part].concat([].slice.call(part.querySelectorAll('span,font')));
        els.forEach(function (el) {
          if (kind === 'size') {
            if (el.style.fontSize === 'xxx-large' || el.getAttribute('size') === '7') {
              el.style.fontSize = value + 'pt';
              el.removeAttribute('size');
              el.setAttribute('data-fk-size', '' + value);
            }
          } else {
            var fam = (el.style.fontFamily || el.getAttribute('face') || '')
              .replace(/["']/g, '');
            if (fam && fam.split(',')[0].trim() === value) {
              el.setAttribute('data-fk-font', value);
            }
          }
        });
      });
      sendPara(e.i);
    });
    syncSelectionState();
    return true;
  }

  window.setFontFamily = function (name) {
    if (!EDIT) return;
    if (applyToSelection('font', name)) return;
    beforeFormat().forEach(function (e) {
      e.parts.forEach(function (p) {
        p.style.fontFamily = name;
        p.setAttribute('data-fk-font', name);
      });
      sendPara(e.i);
    });
    syncSelectionState();
  };

  window.setFontSize = function (pt) {
    if (!EDIT) return;
    if (applyToSelection('size', pt)) return;
    beforeFormat().forEach(function (e) {
      e.parts.forEach(function (p) {
        p.style.fontSize = pt + 'pt';
        p.setAttribute('data-fk-size', '' + pt);
      });
      sendPara(e.i);
    });
    syncSelectionState();
  };

  function currentFontInfo() {
    var s = window.getSelection();
    if (!s || !s.anchorNode) return {};
    var n = s.anchorNode;
    while (n && n.nodeType !== 1) n = n.parentNode;
    var p = n && n.closest ? n.closest('p') : null;
    if (!p) return {};
    var cs = window.getComputedStyle(n);
    var fam = (cs.fontFamily || '').split(',')[0].replace(/["']/g, '').trim();
    var px = parseFloat(cs.fontSize);
    var ta = window.getComputedStyle(p).textAlign;
    return {
      font: fam,
      size: px ? Math.round(px * 0.75 * 10) / 10 : null,
      align: ta === 'center' ? 'center' : (ta === 'right' || ta === 'end') ? 'right'
        : ta === 'justify' ? 'both' : 'left',
      list: p.getAttribute('data-fk-list') || ''
    };
  }

  // Seçimin biçim durumu araç çubuğuna yansır (150ms kısıtlı) — hizalama,
  // liste ve üstü çizili de (W7).
  var selTimer = null;
  function syncSelectionState() {
    if (!EDIT || !window.Kalem) return;
    var info = currentFontInfo();
    post({
      sel: {
        b: document.queryCommandState('bold'),
        i: document.queryCommandState('italic'),
        u: document.queryCommandState('underline'),
        s: document.queryCommandState('strikeThrough'),
        font: info.font || '',
        size: info.size || 0,
        align: info.align || 'left',
        list: info.list || ''
      }
    });
  }
  document.addEventListener('selectionchange', function () {
    if (!EDIT || !window.Kalem) return;
    clearTimeout(selTimer);
    selTimer = setTimeout(syncSelectionState, 150);
  });

  // bold | italic | underline | strikeThrough | justifyLeft/Center/Right/Full
  function fmt(cmd) {
    if (!EDIT) return;
    var paras = beforeFormat();
    document.execCommand(cmd, false, null);
    if (cmd.indexOf('justify') === 0) { sendAligns(paras); syncSelectionState(); return; }
    paras.forEach(function (e) { sendPara(e.i); });
    syncSelectionState();
  }

  // Hizalama paragrafın stiline yazılır; kaydetmede w:jc olur.
  function sendAligns(paras) {
    (paras || selectedParas()).forEach(function (e) {
      var ta = window.getComputedStyle(e.p).textAlign;
      var v = ta === 'center' ? 'center'
        : (ta === 'right' || ta === 'end') ? 'right'
        : ta === 'justify' ? 'both' : 'left';
      e.parts.forEach(function (p) { p.style.textAlign = ta; });
      post({ a: { i: e.i, v: v } });
    });
  }

  // ---- Resim (W9): yeniden çizim YOK ------------------------------------
  // Flutter resmi ada olarak kaydeder (kimlik), burada imlece satır içi
  // konur ve paragraf parçalarıyla gider; geri al da çalışır.
  window.insertImageIsland = function (id, src, w) {
    if (!EDIT) return -1;
    var s = window.getSelection();
    var i = s && s.anchorNode ? idxAtNode(s.anchorNode) : -1;
    if (i < 0) { i = PARTS.length - 1; if (i < 0) return -1; caretAt(PARTS[i][PARTS[i].length - 1], PARTS[i][PARTS[i].length - 1].childNodes.length); s = window.getSelection(); }
    flushAll();
    captureBase(i);
    noteEdit([i], false);
    var span = document.createElement('span');
    span.className = 'fk-island';
    span.setAttribute('contenteditable', 'false');
    span.setAttribute('data-fki', '' + id);
    var img = document.createElement('img');
    img.src = src;
    if (w > 0) img.style.width = w + 'px';
    img.style.maxWidth = '100%';
    span.appendChild(img);
    var r = s.getRangeAt(0);
    r.collapse(false);
    r.insertNode(span);
    var host = span.parentNode;
    if (host) dropPlaceholders(host.closest ? (host.closest('p') || host) : host);
    r.setStartAfter(span);
    r.collapse(true);
    s.removeAllRanges();
    s.addRange(r);
    sendPara(i);
    return i;
  };

  // İmlecin paragrafındaki resim adalarını siler; silinen sayı.
  window.deleteImagesAtCaret = function () {
    if (!EDIT) return 0;
    var i = window.caretParaIndex();
    if (i < 0 || !PARTS[i]) return 0;
    var found = [];
    PARTS[i].forEach(function (p) {
      p.querySelectorAll('.fk-island').forEach(function (isl) {
        if (isl.querySelector('img,svg,image')) found.push(isl);
      });
    });
    if (!found.length) return 0;
    flushAll();
    captureBase(i);
    noteEdit([i], false);
    found.forEach(function (isl) { isl.parentNode.removeChild(isl); });
    PARTS[i].forEach(placeholder);
    sendPara(i);
    return found.length;
  };

  // ---- Belge içinde bul / değiştir ---------------------------------------
  // Slaytta ve Excel'de vardı, Word'de yoktu (KALANLAR maddesi). Arama DOM'a
  // hiç dokunmaz: eşleşme `Range` ile SEÇİLİR, tarayıcı kendi vurgusunu çizer.
  // Böylece bulmak paragraf eşlemesini bozamaz — düzenleme kapalıyken de
  // çalışır.
  var HITS = [];

  // Türkçe katlama: `toLocaleLowerCase('tr')` I→ı, İ→i doğru yapar; İngilizce
  // katlamada "İSTANBUL" ile "istanbul" eşleşmezdi.
  function fold(s) {
    try { return s.toLocaleLowerCase('tr'); } catch (e) { return s.toLowerCase(); }
  }

  // Paragrafın metin düğümleri, karakter ofsetleriyle: eşleşmeyi Range'e
  // çevirmek için hangi düğümün neresinde olduğunu bilmek gerekiyor.
  function textNodesOf(p) {
    var out = [];
    var at = 0;
    var walker = document.createTreeWalker(p, NodeFilter.SHOW_TEXT, null, false);
    var n;
    while ((n = walker.nextNode())) {
      var len = n.textContent.length;
      if (len) { out.push({ node: n, from: at, to: at + len }); at += len; }
    }
    return out;
  }

  function rangeAt(p, start, end) {
    var nodes = textNodesOf(p);
    var r = document.createRange();
    var set = 0;
    for (var k = 0; k < nodes.length; k++) {
      var t = nodes[k];
      if (set === 0 && start >= t.from && start < t.to) {
        r.setStart(t.node, start - t.from);
        set = 1;
      }
      if (set === 1 && end > t.from && end <= t.to) {
        r.setEnd(t.node, end - t.from);
        return r;
      }
    }
    return null;
  }

  window.findAll = function (q) {
    HITS = [];
    if (q) {
      var list = paraList();
      var needle = fold(q);
      for (var k = 0; k < list.length; k++) {
        var hay = fold(list[k].textContent || '');
        var at = hay.indexOf(needle);
        while (at >= 0) {
          HITS.push({ i: k, s: at, e: at + q.length });
          at = hay.indexOf(needle, at + Math.max(1, q.length));
        }
      }
    }
    if (window.Kalem) {
      window.Kalem.postMessage(JSON.stringify({ find: { n: HITS.length } }));
    }
  };

  window.findGo = function (k) {
    if (k < 0 || k >= HITS.length) return;
    var hit = HITS[k];
    var p = paraList()[hit.i];
    if (!p) return;
    var r = rangeAt(p, hit.s, hit.e);
    if (!r) return;
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(r);
    p.scrollIntoView({ block: 'center' });
  };

  // Tek bir eşleşmeyi değiştirir. Metin düğümü YERİNDE değişir, <p> sayısı
  // sabit kalır → paragraf eşlemesi güvende.
  window.replaceHit = function (k, text) {
    if (!EDIT || k < 0 || k >= HITS.length) return;
    var hit = HITS[k];
    var p = paraList()[hit.i];
    if (!p) return;
    var r = rangeAt(p, hit.s, hit.e);
    if (!r) return;
    var mi = idxOfEl(p);
    if (mi >= 0) { flushAll(); captureBase(mi); noteEdit([mi], false); }
    r.deleteContents();
    if (text) r.insertNode(document.createTextNode(text));
    p.normalize();
    if (mi >= 0) sendPara(mi);
  };

  // Tümünü değiştir: her paragraf tek geçişte yeniden kurulur.
  window.replaceAll = function (q, text) {
    if (!EDIT || !q) return;
    var list = paraList();
    var needle = fold(q);
    var count = 0;
    var touched = {};
    flushAll();
    list.forEach(function (p) {
      var mi = idxOfEl(p);
      if (mi >= 0 && fold(p.textContent || '').indexOf(needle) >= 0) touched[mi] = 1;
    });
    var idxs = Object.keys(touched).map(function (x) { return parseInt(x, 10); });
    idxs.forEach(function (i) { captureBase(i); });
    if (idxs.length) noteEdit(idxs, false);
    for (var k = 0; k < list.length; k++) {
      var p = list[k];
      var nodes = textNodesOf(p);
      var changed = false;
      for (var j = nodes.length - 1; j >= 0; j--) {
        var node = nodes[j].node;
        var src = node.textContent;
        var low = fold(src);
        var hitHere = false;
        // SAĞDAN SOLA değiştirilir: soldaki eşleşmelerin konumu bozulmasın.
        var at = low.lastIndexOf(needle);
        while (at >= 0) {
          src = src.substring(0, at) + text + src.substring(at + q.length);
          low = fold(src);
          count++;
          hitHere = true;
          at = low.lastIndexOf(needle, at - 1);
        }
        if (hitHere) { node.textContent = src; changed = true; }
      }
      if (changed) { p.normalize(); }
    }
    idxs.forEach(function (i) { sendPara(i); });
    HITS = [];
    if (window.Kalem) {
      window.Kalem.postMessage(JSON.stringify({ replaced: count }));
    }
  };

  // Sayfayı CSS zoom ile ekran genişliğine sığdırır: açılışta TÜM sayfa
  // görünür. pageW bir kez, zoom uygulanmadan ölçülür; döndürme/yeniden
  // boyutta aynı değerle yeniden sığdırılır.
  // Sağlamlaştırma: asenkron çizimde section henüz yerleşmemişse genişlik
  // 0/çok küçük gelir → ölçek uygulanmazdı ("sayfa sığmıyor" kök nedeni).
  // Bu durumda kısa aralıklarla yeniden denenir.
  var pageW = 0;
  var fitTries = 0;
  var FLOW = false;

  // Kullanıcının pinch/düğme ile eklediği çarpan. Sığdırma ölçeğiyle ÇARPILIR
  // ve tek bir CSS `zoom` olarak uygulanır: iki ayrı zoom (gövde + sarmalayıcı)
  // birbirini eziyordu, native pinch de üstüne biniyordu (bulanıklığın kaynağı).
  var USER = 1;
  var MIN_USER = 0.5, MAX_USER = 6;

  // Belgenin BÖLÜM düzeyi yönü (w:sectPr/w:bidi). docx-preview bunu yok
  // sayıyor, değer Flutter tarafında `DocxEditor.rightToLeft` ile okunup
  // buraya veriliyor. Sayfa çizildikten sonra da çağrılabilir (yalnız sınıf
  // ekler, yeniden çizim gerekmez).
  window.setDocDir = function (rtl) {
    document.body.classList.toggle('rtl', !!rtl);
    document.body.dir = rtl ? 'rtl' : 'ltr';
  };

  // Mobil akış / sayfa görünümü arasında geçiş. Akışta sığdırma ölçeği hiç
  // uygulanmaz; sayfaya dönerken genişlik yeniden ölçülür (pageW sıfırlanır).
  // Okuma kipi (2026-10-28): Flutter çubukları belgenin ÜSTÜNDE kayan
  // katman; belge çubuk boyu kadar payla başlar/biter (WebView boyu sabit).
  window.setInsets = function (top, bottom) {
    document.body.style.paddingTop = (top | 0) + 'px';
    document.body.style.paddingBottom = (bottom | 0) + 'px';
  };

  window.setFlow = function (on) {
    FLOW = !!on;
    document.body.classList.toggle('flow', FLOW);
    USER = 1;
    var wrap = document.querySelector('.docx-wrapper');
    if (FLOW) {
      if (wrap) wrap.style.zoom = '';
      reportZoom();
    } else {
      pageW = 0;
      fitTries = 0;
      fitPage();
    }
  };

  function viewportW() {
    return document.documentElement.clientWidth || window.innerWidth || 0;
  }

  // Sığdırma ölçeği (kullanıcı çarpanı hariç).
  function fitScale() {
    if (FLOW || !pageW) return 1;
    var vw = viewportW();
    return vw > 0 ? Math.min(1, vw / pageW) : 1;
  }

  function applyZoom() {
    var wrap = document.querySelector('.docx-wrapper');
    if (!wrap) return;
    // Akış görünümünde sığdırma yok, yalnız kullanıcı çarpanı geçerli.
    wrap.style.zoom = FLOW ? (USER === 1 ? '' : USER) : (fitScale() * USER);
    reportZoom();
  }

  function reportZoom() {
    if (window.Sayfa) {
      window.Sayfa.postMessage(JSON.stringify({ zoom: fitScale() * USER }));
    }
  }

  // Kullanıcı çarpanını [f] katına çıkarır; [ox]/[oy] odak noktasıdır
  /// (ekran koordinatı) — oradaki içerik yerinde kalsın diye kaydırma
  /// konumu ölçek oranıyla düzeltilir.
  window.zoomBy = function (f, ox, oy) {
    var before = USER;
    USER = Math.min(MAX_USER, Math.max(MIN_USER, USER * f));
    if (USER === before) return;
    var ratio = USER / before;
    var fx = typeof ox === 'number' ? ox : (window.innerWidth || 0) / 2;
    var fy = typeof oy === 'number' ? oy : (window.innerHeight || 0) / 2;
    var sx = window.pageXOffset, sy = window.pageYOffset;
    applyZoom();
    window.scrollTo((sx + fx) * ratio - fx, (sy + fy) * ratio - fy);
  };

  window.resetZoom = function () {
    USER = 1;
    applyZoom();
  };

  // JS pinch: native yakınlaştırma kapalı olduğu için iki parmak burada
  // yakalanır ve CSS zoom'a çevrilir → metin her ölçekte YENİDEN dizilir,
  // yani keskin kalır. Tek parmak dokunulmaz (normal kaydırma).
  var pinchDist = 0;
  var pinchUser = 1;
  function touchDistance(t) {
    var dx = t[0].clientX - t[1].clientX;
    var dy = t[0].clientY - t[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }
  document.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 2) { pinchDist = 0; return; }
    pinchDist = touchDistance(e.touches);
    pinchUser = USER;
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (e.touches.length !== 2 || !pinchDist) return;
    e.preventDefault(); // iki parmak = zoom, kaydırma değil
    var next = Math.min(MAX_USER,
        Math.max(MIN_USER, pinchUser * (touchDistance(e.touches) / pinchDist)));
    if (next === USER) return;
    var ratio = next / USER;
    var fx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    var fy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    var sx = window.pageXOffset, sy = window.pageYOffset;
    USER = next;
    applyZoom();
    window.scrollTo((sx + fx) * ratio - fx, (sy + fy) * ratio - fy);
  }, { passive: false });
  document.addEventListener('touchend', function () { pinchDist = 0; }, { passive: true });

  function fitPage() {
    if (FLOW) { applyZoom(); return; }
    var wrap = document.querySelector('.docx-wrapper');
    var sec = document.querySelector('.docx-wrapper > section.docx');
    if (!wrap || !sec) {
      if (fitTries++ < 20) setTimeout(fitPage, 150);
      return;
    }
    // Genişlik HER SEFERİNDE yeniden ölçülür (eskiden bir kez ölçülüp
    // önbelleğe alınıyordu): ilk ölçüm, docx-preview sayfayı yerleştirmeden
    // ya da fontlar yüklenmeden yapılırsa yanlış kalıyor ve bir daha
    // düzelmiyordu. Ölçümden önce zoom temizleniyor, yoksa kendi ölçeğimizi
    // ölçerdik.
    wrap.style.zoom = '';
    // `scrollWidth` DEĞİL `offsetWidth`: taşan bir tablo/başlık scrollWidth'i
    // şişirir ve SAYFAYI gereksiz yere küçültürdü — sayfa ekrana sığmalı,
    // taşan içerik yatayda kaydırılabilir.
    var w = sec.offsetWidth;
    if (w < 100) {
      if (fitTries++ < 20) setTimeout(fitPage, 150);
      return;
    }
    pageW = w + 16;
    applyZoom();

    // DOĞRULAMA TURU (2026-08-01 kullanıcı ekran görüntüsü: sayfa ekranın
    // ancak %59'unu kaplıyordu, yazı bu yüzden okunamayacak kadar küçüktü ve
    // "bulanık" görünüyordu). Ölçüme güvenmek yerine SONUCA bakılıyor: uygulanan
    // ölçekten sonra sayfa gerçekten ekranı dolduruyor mu? Doldurmuyorsa ölçek
    // bir kez düzeltilir. Hangi ölçüm yalan söylerse söylesin sonuç doğru olur.
    if (USER !== 1) return;
    var vw = viewportW();
    var shown = sec.getBoundingClientRect().width;
    if (vw <= 0 || shown <= 0) return;
    var err = (vw - 8) / shown;
    // Sayfa zaten ekrandan genişse (err < 1) küçültme yapılır; darsa büyütülür.
    // %2'lik sapma için uğraşmaya değmez.
    if (err > 1.02 || err < 0.98) {
      pageW = pageW / err;
      applyZoom();
    }
  }
  // Klavye açılıp kapanınca yalnız YÜKSEKLİK değişir: yeniden sığdırma
  // gerekmez (W6 — eskiden her klavye hareketinde iki kez yeniden yerleşim).
  var lastVW = 0;
  window.addEventListener('resize', function () {
    var vw = viewportW();
    if (vw === lastVW) return;
    lastVW = vw;
    fitPage();
  });

  // ---- Sayfa sayacı -------------------------------------------------------
  // docx-preview her Word sayfasını ayrı bir <section class="docx"> olarak
  // çiziyor; toplam sayfa = section sayısı. Hangi sayfadayız, ekranın ÜST
  // ÇEYREĞİNDEKİ section'dan okunur (yarısı alınsaydı uzun bir sayfada
  // sayaç bir sonrakine erken atlardı).
  var pageCount = 0;
  var currentPage = 0;

  function sections() {
    return document.querySelectorAll('.docx-wrapper > section.docx');
  }

  function reportPages() {
    var secs = sections();
    if (secs.length !== pageCount) {
      pageCount = secs.length;
      if (window.Sayfa) {
        window.Sayfa.postMessage(JSON.stringify({ pages: pageCount }));
      }
    }
    updateCurrentPage();
  }

  function updateCurrentPage() {
    var secs = sections();
    if (!secs.length) return;
    var mark = (window.innerHeight || 0) * 0.25;
    var at = 1;
    for (var i = 0; i < secs.length; i++) {
      if (secs[i].getBoundingClientRect().top <= mark) at = i + 1;
    }
    if (at !== currentPage) {
      currentPage = at;
      if (window.Sayfa) {
        window.Sayfa.postMessage(JSON.stringify({ page: at }));
      }
    }
  }

  var pageTimer = null;
  // Okuma kipi (Faz 18): kaydirma farki kare basina bir kez Flutter'a gider;
  // cubuklar asagi kaydirinca cekilir, yukari kaydirinca gelir.
  var lastScrollY = window.pageYOffset, scrollRaf = false;
  window.addEventListener('scroll', function () {
    clearTimeout(pageTimer);
    pageTimer = setTimeout(updateCurrentPage, 80);
    if (scrollRaf) return;
    scrollRaf = true;
    requestAnimationFrame(function () {
      scrollRaf = false;
      var y = window.pageYOffset, dy = y - lastScrollY;
      lastScrollY = y;
      // Düzenlerken okuma kipi çubukları zaten kapalı: köprüyü her karede
      // yormayalım (W12).
      if (dy !== 0 && window.Sayfa && !EDIT) {
        window.Sayfa.postMessage(JSON.stringify({ scroll: dy, top: y <= 0 }));
      }
    });
  }, { passive: true });

  // 1 tabanlı sayfaya kaydırır.
  window.goToPage = function (n) {
    var secs = sections();
    if (!secs.length) return;
    var i = Math.min(Math.max(1, n), secs.length) - 1;
    var top = secs[i].getBoundingClientRect().top + window.pageYOffset - 4;
    window.scrollTo(0, Math.max(0, top));
    updateCurrentPage();
  };

  function showError(e) {
    var el = document.getElementById('err');
    el.style.display = 'block';
    el.textContent = 'Belge görüntülenemedi: ' + e;
    report('hata: ' + e);
  }
</script>
