name: dosya_okuyucu
description: "Sade, hızlı ve efektif çok formatlı dosya okuyucu/düzenleyici (PDF, Word, Excel, Slayt) + Gemini AI."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Türkçe/İngilizce/Arapça arayüz: Material ve Widgets katmanının kendi
  # metinleri (takvim, "Kes/Kopyala/Yapıştır", tarih biçimi) ve Arapça'da
  # sağdan sola akış bu paketten gelir. Bizim metinlerimiz kod tablosunda
  # (`lib/core/l10n/`), bu paket YALNIZ Flutter'ın kendi metinleri için.
  # Sürüm SDK'dan: Flutter 3.29.3 `intl 0.20.2` pinliyor — syncfusion_flutter_pdf
  # zaten aynı sürümü çekiyor, çakışma yok.
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Dosya seçme / yol
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  path: ^1.9.0

  # Başka uygulamalardan "Birlikte aç" / paylaş ile gelen dosyaları yakalama
  # (WhatsApp/Gmail'den atılan dosya doğrudan uygulamada açılır).
  receive_sharing_intent: ^1.8.1

  # Görüntüleyiciler
  # PDF: pdfium tabanlı pdfrx — sayfa üzerinde METİN SEÇME/kopyalama destekler
  # (pdfx bitmap çizdiği için seçim imkânsızdı). 1.3.x = Dart 3.7/Flutter 3.29
  # uyumlu son seri; 2.x KULLANILAMAZ: pdfrx_engine Dart >=3.8.1 + archive ^4
  # istiyor (excel paketi archive ^3'e bağlı → çözümleme çakışır, bkz. HAFIZA).
  # Seçim arayüzü bizim katmanımız: widgets/pdf_select_layer.dart.
  pdfrx: ^1.3.0

  # PDF YAZMA işleri (annotation gömme, sayfa döndür/sil/sırala, form doldurma).
  # Görüntüleme yine pdfrx/pdfium; Syncfusion yalnız düzenlenmiş PDF ÜRETİR.
  # 31.1.19'a SABİT: 32+ Flutter >=3.35 ister → CI 3.29.3'ü kırar. Bu sürüm
  # flutter>=3.29 + Dart 3.7 + xml 6.5.x ister (bizimkiyle birebir), archive'a
  # bağlı değil (excel'in archive ^3'üyle çakışmaz). Saf Dart (native yok).
  syncfusion_flutter_pdf: 31.1.19
  # Core'u da SABİTLE: pdf'in dep'i ^31.1.19 en yükseği (31.2.x) çeker ama
  # core 31.2.x Flutter >=3.35.1 ister → CI 3.29.3'ü kırar. 31.1.19 flutter>=3.29.
  syncfusion_flutter_core: 31.1.19

  # OCR: cihaz-içi ML Kit metin tanıma (Latin — Türkçe dahil), internet gerekmez.
  # 0.15.0 SABİT: 0.15.1+ Dart >=3.8 istiyor (CI 3.29.3 = Dart 3.7).
  google_mlkit_text_recognition: 0.15.0
  # Çeviri: cihaz-içi ML Kit (internet yalnız dil modeli ilk indirilirken gerekir).
  # 0.13.0 SABİT — son Dart 3.7 uyumlu sürüm (sdk >=2.16.0 <4.0.0, flutter >=2.5.0).
  # 0.13.1+ sdk >=3.8.0 + flutter >=3.32.0 ister → CI 3.29.3 (Dart 3.7) KIRILIR.
  # 0.12.0'a da DÜŞÜLEMEZ: commons ^0.9.0 ister, text_recognition 0.15.0 ise
  # commons ^0.11.0 → çözümleme çakışır. 0.13.0 ikisiyle de uyumlu tek sürüm.
  # (commons 0.11.1 de Dart >=3.8 ister; CI'da pub otomatik 0.11.0'a düşer —
  # pubspec.lock gitignore'da olduğu için CI kendi çözümlemesini yapar.)
  google_mlkit_translation: 0.13.0
  # Word'ü gerçek sayfa düzeniyle çizmek için (assets/word içindeki docx-preview
  # motoru gömülü çalışır — internet gerekmez)
  webview_flutter: ^4.10.0
  # Doğrudan bağımlılık (zaten geçişliydi): Word sayfa görünümündeki bulanıklık
  # düzeltmesi AndroidWebViewWidgetCreationParams ister (hybrid composition —
  # bkz. docx_view.dart 2026-08-06).
  webview_flutter_android: ^4.3.0

  # Office (Open XML) okuma/yazma
  excel: ^4.0.6
  archive: ^3.6.1
  xml: ^6.5.0

  # Arşiv okuma: RAR4/RAR5 + 7z + zip/tar/gz — SAF DART (MIT), platform kodu yok.
  # `archive` paketi RAR/7z okumaz; junrar saran Android eklentileri yalnız RAR4
  # çözer ve CI'da üretilen android/ iskeletine platform kodu ekletirdi.
  # sdk ^3.7.0 → CI Flutter 3.29.3 (Dart 3.7.2) ile uyumlu; ek bağımlılığı yok
  # (glob/path/web). Çıkarma isolate'te koşar (LZMA/PPMd CPU-yoğun).
  koni_archive: ^0.9.0

  # AI (Gemini REST) & ağ
  http: ^1.2.2

  # Depolama / ayarlar
  shared_preferences: ^2.3.2

  # Dönüştürme (PDF üretimi) & paylaşım / yazdırma
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.0.2

  # Durum yönetimi (hafif)
  provider: ^6.1.2

  # ── Dosya yöneticisi ────────────────────────────────────────────────────────
  # Depolama izni (Android 11+ "tüm dosyalara erişim" = MANAGE_EXTERNAL_STORAGE).
  # 11.3.1'e SABİT: 11.4.0+/12.x `sdk ^3.5.0 + flutter >=3.24` ister — CI 3.29.3
  # bunu sağlar ama alt paketi permission_handler_android 13.x compileSdk'yı
  # yukarı çeker. 11.3.1 (sdk >=2.15 <4.0, flutter >=2.8) en güvenli sürüm.
  permission_handler: 11.3.1
  # Video oynarken ekranın sönmesini engeller. YALNIZ video OYNARKEN tutulur
  # (duraklatınca ve ekrandan çıkınca bırakılır) — ses oynatıcıda hiç
  # kullanılmaz, orada ekranın kapanması zaten istenen davranış.
  # 1.4.0: Flutter 3.29.3 / Dart 3.7 ile çözümlenen sürüm (1.7.0 sdk >=3.8 ister).
  wakelock_plus: 1.4.0

  # Uygulama içi video + ses oynatıcı (ExoPlayer/Media3).
  # SÜRÜM ZİNCİRİ SABİT — CI Flutter 3.29.3 için: video_player 2.10.1
  # (flutter>=3.29) → alt paket `video_player_android` **2.8.15**, Flutter 3.29
  # ile uyumlu SON sürüm (2.8.16+ flutter>=3.35 ister → CI kırılır).
  # pubspec.lock gitignore'da olduğu için CI her koşuda yeniden çözümlüyor;
  # bu yüzden alt paket de doğrudan pinlendi (yoksa pub yeni sürümü seçer).
  video_player: 2.10.1
  video_player_android: 2.8.15

  # Ses çalar (müzik deneyimi): video_player ses dosyasını da açar ama ekrandan
  # çıkınca durur ve tekrar/karışık gibi çalar işlevleri yoktur. audioplayers
  # native MediaPlayer/ExoPlayer'ı doğrudan sürer → ekran kapansa da çalmaya
  # devam eder ve manifest'e servis eklemek gerekmez.
  # SÜRÜM SABİT: 6.6.0 + audioplayers_android 5.2.1, Flutter 3.29 uyumlu SON
  # sürümler (6.7.0 / 5.3.0 flutter >=3.35 ister). pubspec.lock gitignore'da.
  audioplayers: 6.6.0
  audioplayers_android: 5.2.1

  # Video küçük resmi (native MediaMetadataRetriever) — listelerde film karesi.
  # 2.2.0: sdk >=2.18.6 <4.0.0, flutter >=3.7 → CI 3.29.3 uyumlu (3.0.0 ise
  # flutter >=3.44 ister). NOT: eski `video_thumbnail` paketi sdk <3.0.0'da
  # kaldığı için Dart 3 ile KULLANILAMIYOR.
  fc_native_video_thumbnail: 2.2.0

  # Telefonda yüklü uygulamaların listesi (ad, ikon, sürüm, kurulum tarihi)
  # ve son kullanım zamanı (UsageStats — kullanıcı "kullanım erişimi" verirse).
  installed_apps: 2.1.1
  # Son kullanım: app_usage (compileSdk 35, namespace'li — modern).
  # `usage_stats` KULLANILAMADI: compileSdkVersion 30 ile yayınlanmış,
  # AGP kaynak bağlamada "resource android:attr/lStar not found" ile APK
  # derlemesini kırıyor (CI #103). app_usage ayrıca izin sayfasını da
  # kendisi açıyor (Settings.ACTION_USAGE_ACCESS_SETTINGS).
  app_usage: 4.0.1

  # Yerleşik görüntüleyicimiz olmayan dosyaları (apk/rar dışı biçimler…) sistemin
  # varsayılan uygulamasında açar. 4.x: sdk >=2.17 <4.0 → CI Dart 3.7 uyumlu.
  # Kendi FileProvider'ını manifest'ine gömer, ek manifest düzenlemesi gerekmez.
  open_filex: ^4.7.0

  # 120Hz+ ekran desteği (Android 60Hz kilidini açar; diğer platformlarda pasif)
  flutter_displaymode: ^0.6.0

  # ── Uzun işler: bildirim + medya dönüştürme ────────────────────────────────
  # İş kuyruğunun (services/fm/job_queue.dart) sistem bildirimi. 17.2.4'e
  # SABİT: sdk >=2.17 / flutter >=3.0 ister (CI 3.29.3 = Dart 3.7 rahat
  # kapsıyor) ve Android tarafı compileSdk 34 + Java 8 ile derleniyor.
  # 19.x KULLANILMADI: compileSdk 35 + Java 11 + desugar 2.1.4 dayatıyor,
  # tek bir bildirim için CI'daki derleme zincirini yukarı çekmeye değmez.
  # NOT: paket java.time kullandığı için UYGULAMA modülünde de core library
  # desugaring açık olmalı — CI'da build.gradle'a yamalanıyor (bkz. workflow).
  # Zamanlanmış bildirim kullanmıyoruz → `timezone` ilklendirmesi ve
  # SCHEDULE_EXACT_ALARM izni gerekmiyor.
  flutter_local_notifications: 17.2.4

  # Görüntü boyut düşürme/format çevirme (saf Dart; platform kodu yok).
  # 4.3.0'a SABİT — `archive ^3.6.1` ile UYUMLU SON sürüm. 4.4.0+ `archive ^4`
  # istiyor, `excel` paketi ise archive ^3'e bağlı → çözümleme çakışır
  # (HAFIZA'daki archive sürüm cehennemi). Zaten `pdf` paketi image ^4.1.0
  # çektiği için APK'ya yeni bir ağırlık GİRMİYOR, yalnız doğrudan
  # kullanabilmek için bildiriliyor.
  image: 4.3.0

  # Video sıkıştırma (native MediaCodec — ffmpeg YOK).
  # ffmpeg_kit_flutter KULLANILAMAZ: paket dağıtımdan kaldırıldı, ikili
  # dosyaları artık barındırılmıyor → derleme indirme hatasıyla çöker.
  # video_compress: kalite/çözünürlük kademesi + kare sayısı (fps) + sesi at.
  video_compress: 3.1.4
  # Birebir çözünürlük + kare sayısı (kullanıcı isteği 2026-07-29): FFmpeg.
  # `ffmpeg_kit_flutter` (özgün) dağıtımdan kaldırıldı — ikilileri artık
  # barındırılmıyor. Bu ÇATAL ikilileri Maven Central'da yeniden yayımlıyor
  # (`com.antonkarpenko:ffmpeg-kit-min-gpl`), Android modülünde `namespace`
  # var, compileSdk 35 / minSdk 24 (bizimkiyle aynı).
  # **`min` varyantı (LGPL v3) SEÇİLDİ — `min_gpl` DEĞİL.** Kullanıcı isteği:
  # "lisans kısmını hallet, Google Play'de sorun yaşamayalım".
  #  • `min_gpl` x264/x265/xvid taşıyor; bunlar GPL v3 → uygulamanın TAMAMI
  #    GPL v3'e girerdi (tüm kaynağı bu lisansla yayımlama zorunluluğu) ve
  #    GPL v3'ün "ek kısıtlama koyulamaz" maddesinin mağaza dağıtım
  #    şartlarıyla çakışması bilinen bir sorun.
  #  • `min` LGPL v3: dinamik bağlı .so olarak dağıtıldığı için yükümlülük
  #    atıf + kütüphane kaynağını sunma + yeniden bağlamaya izin vermekle
  #    sınırlı; uygulamanın kendi kodu etkilenmiyor (bkz. LICENSES.md).
  # Birebir çözünürlük KAYBEDİLMEDİ: ölçekleme/kare sayısı süzgeçleri FFmpeg'in
  # çekirdeğinde, GPL kütüphanelerde değil. H.264 yazmak için x264 yerine
  # cihazın **donanım kodlayıcısı** (`h264_mediacodec`) kullanılıyor — paket
  # FFmpeg 8.1.2 taşıyor, MediaCodec kodlayıcıları 6.1'den beri var. Yan
  # faydası: H.264 patent lisansı cihaz üreticisinde kalıyor ve kodlama
  # yazılım x264'ten kat kat hızlı.
  # Boyut: min (38.9 MB AAR) min_gpl'den (48.6 MB) ~10 MB küçük.
  # NOT: paket kotlin-stdlib 2.2.0 taşıyor → CI'daki Kotlin eklentisi 2.1.0'dan
  # 2.2.0'a çekildi (yeni derleyici eski metadata'yı okur; ters yön kırılır,
  # bkz. HAFIZA build 119).
  ffmpeg_kit_flutter_new_min: 3.6.0

  # `light_compressor` (serbest en×boy) DENENDİ ve EKLENMEDİ — 2026-07-29.
  # Paketin 2.2.0 Android modülü modern derleme zinciriyle uyumsuz, üç
  # bağımsız kırıcı var: (1) `namespace` yok, manifestte `package=` duruyor →
  # AGP 8 hata veriyor; (2) native bağımlılığı JitPack'te ama paket bu deposu
  # tüketen uygulamaya tanıtmıyor; (3) kendi buildscript'inde AGP 4.2.2
  # classpath'i bildiriyor. Üçünü yamayla zorlamak "tek paket için tüm
  # derleme zincirini oynatma" demekti (HAFIZA'da reddedilmiş yol).
  # Karşılığı: video için hedef ölçü en yakın alt kademeye eşleniyor
  # (services/fm/video_transcode.dart), fotoğrafta serbest ölçü tam çalışıyor.

  # Firebase (giriş + bulut senkron) — config yoksa uygulama yerel modda çalışır
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  google_sign_in: ^6.2.0
  # Belge tarayıcı: Google ML Kit Belge Tarayıcı sarmalayıcısı (kenar tespiti,
  # perspektif düzeltme, "taranmış" filtre — SCANNER_MODE_FULL, sonuç JPEG).
  # 1.2.x SON uyumlu seri: 2.x Dart >=3.8 ister, biz 3.7'deyiz (CI 3.29.3).
  # Play Services yoksa paket kendi yedek tarayıcısına düşer.
  cunning_document_scanner: ^1.2.3

  # Sesli okuma (cihazın kendi TTS motoru; internet gerekmez).
  flutter_tts: ^4.2.5

  # PDF içindeki dış bağlantıları tarayıcıda açmak için. Zaten printing üzerinden
  # dolaylı geliyordu; doğrudan bağımlılık yapıldı (dolaylıya güvenmek kırılgan).
  url_launcher: ^6.3.2
  background_downloader: ^8.9.0
  # ── Ağ depolama (NAS): FTP/FTPS/FTPES · SFTP · SMB · WebDAV · LAN ─────────
  # Hepsinin uyumluluğu bizim sürüm duvarımıza (Flutter 3.29.3 / Dart 3.7)
  # karşı `pub add --dry-run` ile ÖLÇÜLDÜ; hiçbiri çözümlemeyi kırmıyor.
  #
  # SFTP — saf Dart SSH istemcisi (MIT). Tercih edilen protokol: tek şifreli
  # bağlantı, FTP'nin pasif mod port pazarlığı yok.
  dartssh2: ^2.14.0
  # FTP + FTPS (örtük) + FTPES (açık TLS) — saf Dart (MIT). Üç protokol tek
  # sınıfta (`FtpFs`), aradaki tek fark `SecurityType` ve varsayılan port.
  # Aralık BİLEREK açık: CI (Flutter 3.29.3) 2.0.8+'ın `intl` kısıtı yüzünden
  # 2.0.7'de kalır, daha yeni bir Flutter 2.0.10 çeker — sürümü sabitlemek
  # ortamlardan birini "version solving failed" ile kırar. İki sürüm arasında
  # enum ADLARI değiştiği için (`SecurityType.FTPS` → `ftps`) `ftp_fs.dart`
  # sabitleri adıyla değil, harf duyarsız arayarak bulur. Bkz. HAFIZA 2026-08-05.
  ftpconnect: ^2.0.7
  # WebDAV (Nextcloud/ownCloud/Synology) — BSD 3-Clause, `dio` üstünde.
  webdav_client: ^1.2.2
  # Yerel ağ keşfi (mDNS/Bonjour) — Flutter ekibi, BSD. Tek başına yetmiyor
  # (duyuru yapmayan sunucuyu bulamaz), alt ağ port taramasıyla BİRLİKTE
  # kullanılıyor; bkz. services/fm/remote/lan_discovery.dart.
  multicast_dns: ^0.3.3
  # SMB/CIFS — Apache 2.0. **RİSKLİ, bilinçli seçim (kullanıcı kararı
  # 2026-07-30: "önce dene, tutmazsa listeden çıkar").** Sürüm 0.0.9 ve olgun
  # bir saf-Dart SMB istemcisi yok. Alternatif (Java `smbj`'yi platform
  # kanalıyla sarmak) depoya kendi android/ klasörümüzü sokardı — CI iskeleti
  # her derlemede `flutter create` ile üretiyor ve "tek paket için derleme
  # zincirini oynatma" daha önce reddedildi (bkz. light_compressor,
  # usage_stats). Çuvallarsa kullanıcı ANLAŞILIR bir hata görüyor
  # (`RemoteFs.mapError` → "SFTP ya da FTP deneyin"), sessiz boş klasör değil.
  smb_connect: ^0.0.9
  # NOT: PC'den telefona FTP **sunucusu** için paket YOK — hazır bir Dart FTP
  # sunucusu bulunmuyor, olanlar istemci. `dart:io` ServerSocket ile yazıldı
  # (services/fm/remote/ftp_server.dart): kök hapsi, kimlik doğrulama ve pasif
  # mod tamamen bizde, güvenlik açısından da doğrusu bu.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Uygulama ikonunu (launcher + adaptive) tek kaynaktan üretir.
  flutter_launcher_icons: ^0.14.1
  # Testte gerçek ExoPlayer yerine sahte oynatma motoru takmak için
  # (media_player_layout_test). video_player'ın zaten kilitli alt paketi.
  video_player_platform_interface: ^6.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/word/
    # Gizlilik politikası (tr/en/ar). Uygulama İÇİNDEN okunabilmesi şart:
    # mağazadan/GitHub'dan kuran kullanıcı depoyu görmez ve politikayı
    # okumak için internete çıkmak zorunda kalmamalı. Depodaki
    # docs/GIZLILIK.md aynı dosyalara işaret eder — tek kaynak.
    - assets/privacy/

  # Slayt sadakati: PowerPoint fontlarının (Calibri/Arial/Times) metrik-uyumlu,
  # dağıtılabilir açık kaynak karşılıkları. Eşleme pptx_render._mapFamily'de.
  # Lisans: OFL 1.1 (assets/fonts/OFL.txt + FONTS-NOTICE.txt).
  fonts:
    - family: Carlito # Calibri karşılığı (+ bilinmeyen sans varsayılanı)
      fonts:
        - asset: assets/fonts/Carlito-Regular.ttf
        - asset: assets/fonts/Carlito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Carlito-Italic.ttf
          style: italic
        - asset: assets/fonts/Carlito-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Tinos # Times New Roman karşılığı (+ serif fontlar)
      fonts:
        - asset: assets/fonts/Tinos-Regular.ttf
        - asset: assets/fonts/Tinos-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tinos-Italic.ttf
          style: italic
        - asset: assets/fonts/Tinos-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Arimo # Arial/Helvetica karşılığı (değişken font; kalın = wght ekseni)
      fonts:
        - asset: assets/fonts/Arimo-Variable.ttf
        - asset: assets/fonts/Arimo-Italic-Variable.ttf
          style: italic
    # ── Arayüz yazı tipi seçenekleri (2026-08-07 kullanıcı: "daha fazla yazı
    # tipi lazım"). Hepsi OFL; APK'yı şişirmemek için Latin + Latin Ext-A/B'ye
    # (Türkçe dahil) ALTKÜMELENDİ ve değişken eksenlerden yalnız `wght`
    # bırakıldı — 8,2 MB'lık ham set 2,2 MB'a indi (tool/fetch_ui_fonts.py).
    # Eğik (italik) kesitleri YOK: arayüzde kullanılmıyor, boyutu ikiye
    # katlardı.
    - family: Inter # modern arayüz sans'ı
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Lato # hümanist sans, yumuşak
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
    - family: Nunito # yuvarlak uçlu, sıcak
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
    - family: Merriweather # ekranda uzun metin için tasarlanmış serif
      fonts:
        - asset: assets/fonts/Merriweather-Variable.ttf
    - family: Roboto Slab # tırnaklı-blok (slab) serif
      fonts:
        - asset: assets/fonts/RobotoSlab-Variable.ttf
    - family: EB Garamond # klasik kitap serifi
      fonts:
        - asset: assets/fonts/EBGaramond-Variable.ttf
    - family: JetBrains Mono # GERÇEK gömülü tek aralıklı (cihazın 'monospace'i
      fonts:                 # telefondan telefona değişiyor)
        - asset: assets/fonts/JetBrainsMono-Variable.ttf

# Uygulama ikonu: assets/icon/ altındaki PNG'lerden CI'da üretilir
# (dart run flutter_launcher_icons). PNG'lerin kaynağı `tool/gen_icon.py`.
#
# 2026-08-30: KLASÖR ikonuna geçildi (kullanıcı kararı). Zemin artık düz beyaz
# DEĞİL, turkuaz→mavi köşegen degrade bir GÖRSEL — bu yüzden
# `adaptive_icon_background` bir renk değil dosya yolu. Üç katman:
#   icon.png        eski Android + mağaza görseli (degrade kart + işaret)
#   background.png  adaptive zemin (degrade, tuvali baştan başa doldurur)
#   foreground.png  adaptive ön plan (şeffaf, yalnız klasör)
# Tasarımın gerekçesi ve ölçüleri `tool/gen_icon.py` başlığında; 2026-08-09'da
# kurulan ortak simge dilinden BİLİNÇLİ sapma olduğu da orada yazılı.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "assets/icon/background.png"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  # KÖK NEDEN (2026-08-30): `flutter_launcher_icons` ön plana VARSAYILAN
  # olarak %16 inset uyguluyor (`adaptive_icon_foreground_inset` = 16) ve
  # ürettiği `ic_launcher.xml` içine `<inset android:inset="16%">` yazıyor.
  # Yani tuvale 66 dp diye çizilen işaret cihazda 66 × 0,68 ≈ 45 dp oluyordu —
  # kullanıcının iki kez "simge küçük, alanı doldurmuyor" demesinin sebebi
  # buydu; o turlarda şekil genişletilerek BELİRTİ tedavi edilmişti.
  # `tool/gen_icon.py` işaretin boyunu zaten maskeye göre ölçüyor (max_fit),
  # yani ikinci bir küçültmeye gerek yok: inset sıfırlanıyor.
  adaptive_icon_foreground_inset: 0
