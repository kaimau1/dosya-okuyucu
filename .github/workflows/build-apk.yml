name: APK Derle & Release

# LİMİT POLİTİKASI (2026-07-21): Her push'ta APK derlemek GitHub Actions
# dakikasını ve depolamayı (release/artifact) dolduruyordu. Artık:
#   • test  → her push'ta çalışır (yalnızca `flutter test`; hızlı, APK üretmez).
#   • apk   → SADECE commit mesajı özel işareti içerince, elle dispatch ile ya
#             da main dalında. İşaret bilinçli: normal/açıklama metninde ASLA
#             yazma (bkz. HAFIZA 2026-07-21 — düz "apk" kelimesi kazara tetikledi).
#             İşaret için HAFIZA'daki nota bak (prompt'ta açıkça yazılmaz).

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Ucuz doğrulama: yalnızca feature dallarında (main'de apk işi zaten test
  #    koşuyor; ayrı iş main'de sadece tekrar + APK'yı ~4 dk bekletme demekti). ──
  test:
    name: Testler (hızlı doğrulama)
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.3'

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Testler
        run: flutter test

  # ── Pahalı: imzalı APK + Release. Yalnızca istendiğinde çalışır. ────────────
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    # Takılma koruması: build #53'te `flutter build apk` bir Gradle/ağ stall'ında
    # 55 dk asılı kalıp job'ı çökertti (aynı kod bir sonraki koşuda 12 dk'da derlendi).
    # Bu sınır, olası bir takılmanın bir daha ~1 saat CI dakikası yakmasını önler.
    timeout-minutes: 30
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      contains(github.event.head_commit.message, '[release-apk]')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.3'

      # Gradle/pub bağımlılıklarını koşular arası önbelleğe al: ilk build sonrası
      # indirmeler diskten gelir → hem ~2-4 dk hızlanır hem de ağ stall'ına (build
      # #53'ün 55 dk takılmasının olası kök nedeni) daha az maruz kalınır.
      - name: Gradle & pub önbelleği
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
          key: gradle-pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            gradle-pub-${{ runner.os }}-

      - name: Platform iskeletini üret (android)
        run: |
          set -e
          mkdir -p .backup
          cp -r lib pubspec.yaml .backup/
          [ -d assets ] && cp -r assets .backup/ || true
          [ -f analysis_options.yaml ] && cp analysis_options.yaml .backup/ || true
          flutter create --org com.dosyaokuyucu --project-name dosya_okuyucu --platforms=android .
          cp -r .backup/lib .
          cp .backup/pubspec.yaml .
          [ -d .backup/assets ] && cp -r .backup/assets . || true
          [ -f .backup/analysis_options.yaml ] && cp .backup/analysis_options.yaml . || true
          rm -f test/widget_test.dart   # flutter create'in ürettiği örnek test projeyle uyumsuz

      - name: AndroidManifest'i değiştir (izin + ad + "Birlikte aç"/paylaş)
        run: |
          set -e
          # Elle bakımlı tam manifest'i kopyala: INTERNET izni, uygulama adı,
          # singleTask ve VIEW/SEND intent-filter'ları (başka uygulamalardan
          # gelen dosyaları açmak için). Kırılgan sed yerine tek kaynak.
          cp ci/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          echo "--- Kullanılan AndroidManifest ---"
          grep -E "INTERNET|launchMode|action.VIEW|action.SEND|label=" \
            android/app/src/main/AndroidManifest.xml || true

      - name: MainActivity'yi değiştir (uygulama boyutu platform kanalı)
        run: |
          set -e
          # `flutter create` boş bir MainActivity üretiyor; elle bakımlı
          # sürümde `StorageStatsManager` köprüsü var (uygulama başına kapladığı
          # alan — Dart tarafından okunamıyor). Manifest'le aynı desen.
          DIR=android/app/src/main/kotlin/com/dosyaokuyucu/dosya_okuyucu
          mkdir -p "$DIR"
          cp ci/MainActivity.kt "$DIR/MainActivity.kt"
          # Belge sağlayıcı (SAF): "Şuradan aç" listesinde görünmemizi sağlar.
          # Manifest'teki <provider android:name=".DosyaProvider"> bunu arar;
          # kopyalanmazsa derleme "class not found" ile kırılır.
          cp ci/DosyaProvider.kt "$DIR/DosyaProvider.kt"
          # Seçici kipi aktivitesi ("Şuradan aç" çekmecesindeki ok işareti).
          # Manifest'teki <activity android:name=".PickerActivity"> bunu arar.
          cp ci/PickerActivity.kt "$DIR/PickerActivity.kt"
          # `flutter create` java/ altına da üretmiş olabilir — ikisi birden
          # kalırsa "duplicate class" hatası verir.
          rm -f android/app/src/main/java/com/dosyaokuyucu/dosya_okuyucu/MainActivity.java
          echo "--- MainActivity ---"; head -5 "$DIR/MainActivity.kt"
          find android/app/src/main -name 'MainActivity.*'

      - name: Proguard kuralları (ML Kit R8 "missing class" düzeltmesi)
        run: |
          set -e
          # Flutter'ın Gradle eklentisi app/proguard-rules.pro'yu release
          # küçültmede otomatik dahil eder — build.gradle patch'i gerekmez.
          cp ci/proguard-rules.pro android/app/proguard-rules.pro
          echo "--- proguard-rules.pro ---"; cat android/app/proguard-rules.pro

      - name: minSdk 24 (Firebase + video küçük resmi) + NDK sürümü
        run: |
          set -e
          # Runner'da kurulu NDK sürümlerinden en yenisini seç.
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          NDK_VERSION=$(ls "$SDK/ndk" 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK_VERSION" ]; then
            NDK_VERSION=27.0.12077973
            echo "::warning::Runner'da kurulu NDK yok; $NDK_VERSION indirilecek."
          fi
          echo "Kullanılacak NDK: $NDK_VERSION"
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] || continue
            # 2026-07-25: 23 → 24. fc_native_video_thumbnail (video küçük
            # resmi) minSdk 24 ister; manifest birleştirici 23'te derlemeyi
            # kesiyordu. Firebase'in istediği 23 de kapsanıyor; Android 6 payı
            # bugün ihmal edilebilir.
            sed -i -E 's/minSdk(Version)?[[:space:]]*=?[[:space:]]*flutter\.minSdkVersion/minSdk = 24/' "$f"
            # NDK sürümü: **runner'da KURULU olan** kullanılır.
            #
            # Build 152 kırmızı: sabit "27.0.12077973" runner'da yoktu, Gradle
            # indirmeye çalıştı ve indirme bozuk geldi
            # ("java.util.zip.ZipException: Archive is not a ZIP archive").
            # Kurulu sürümü seçmek hem bu kırılganlığı kaldırıyor hem de her
            # derlemede ~500 MB indirmeyi atlıyor. Hiç NDK yoksa eski sabit
            # sürüme düşülür (o zaman indirme kaçınılmaz).
            grep -q 'ndkVersion' "$f" || \
              sed -i "0,/android {/s//android {\n    ndkVersion = \"$NDK_VERSION\"/" "$f"
          done
          echo "--- minSdk/ndk sonrası ---"; grep -R -E "minSdk|ndkVersion" android/app/build.gradle* || true

      - name: Core library desugaring (flutter_local_notifications java.time ister)
        run: |
          set -e
          # flutter_local_notifications java.time API'lerini kullanıyor; minSdk
          # 24 (< 26) olduğu için bu sınıflar UYGULAMA modülünde de desugar
          # edilmeli, yoksa derleme "Cannot find annotation method / missing
          # java.time" ile kırılır. Kütüphane kendi modülünde açıyor ama
          # desugaring modül başınadır.
          #
          # Eklenti dosyaya sonradan yamalanıyor çünkü `flutter create` her
          # koşuda android/ klasörünü yeniden üretiyor (elle düzenleme silinir).
          python3 - <<'PY'
          import re, pathlib
          patched = False
          for name in ('android/app/build.gradle.kts', 'android/app/build.gradle'):
              path = pathlib.Path(name)
              if not path.exists():
                  continue
              text = path.read_text()
              kts = name.endswith('.kts')
              flag = ('isCoreLibraryDesugaringEnabled = true' if kts
                      else 'coreLibraryDesugaringEnabled true')
              if 'oreLibraryDesugaring' not in text:
                  # compileOptions bloğunun açılışına bayrağı ekle.
                  new_text, count = re.subn(
                      r'(compileOptions\s*\{)', r'\1\n        ' + flag, text, count=1)
                  if count == 0:
                      raise SystemExit(f'compileOptions bloğu bulunamadı: {name}')
                  dep = ('dependencies {\n    coreLibraryDesugaring('
                         '"com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
                         if kts else
                         'dependencies {\n    coreLibraryDesugaring '
                         "'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n")
                  new_text = new_text.rstrip() + '\n\n' + dep
                  path.write_text(new_text)
                  patched = True
                  print(f'{name}: desugaring açıldı')
          if not patched:
              raise SystemExit('Desugaring yamalanamadı — build.gradle bulunamadı')
          PY
          echo "--- desugaring sonrası ---"
          grep -R -A3 -E "compileOptions|coreLibraryDesugaring" android/app/build.gradle* || true

      - name: Kotlin eklenti sürümünü yükselt (flutter_tts + ffmpeg-kit metadata)
        run: |
          set -e
          # flutter_tts 4.2.5 Kotlin 2.x ile derlenmiş kotlin-stdlib çekiyor;
          # Flutter 3.29.3 şablonunun Kotlin eklentisi 1.8.22 bu metadata'yı
          # OKUYAMIYOR ("compiled with an incompatible version of Kotlin",
          # build 119 kırmızı). Yeni derleyici eski metadata'yı okuyabildiği
          # için sürümü yükseltmek güvenli yön; düşürmek değil.
          #
          # 2026-07-29: 2.1.0 → **2.2.0**. ffmpeg_kit_flutter_new_min_gpl
          # kotlin-stdlib 2.2.0 çekiyor; 2.1.0 derleyicisi 2.2 metadata'sını
          # okuyamaz (aynı hata sınıfı, ters yön). Kotlin 2.2 Gradle eklentisi
          # Gradle 7.6.3+ ve AGP 7.3+ istiyor — şablonda Gradle 8.10.2 /
          # AGP 8.7.0 var, ikisi de fazlasıyla karşılıyor.
          for f in android/settings.gradle android/settings.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i -E 's/(id[( ]"org\.jetbrains\.kotlin\.android"\)? version )"[0-9.]+"/\1"2.2.0"/' "$f"
          done
          echo "--- kotlin eklenti sürümü ---"
          grep -R "kotlin.android" android/settings.gradle* || true

      - name: Kotlin/Java JVM hedef uyum kontrolünü yumuşat
        run: |
          set -e
          # Eklentiler Kotlin'i 17'ye, Java'yı 8/11'e derliyor (modül-içi uyumsuzluk).
          # Hedefleri DSL/görev ile zorla hizalamak AGP finalization'ıyla çakışıyor
          # ve zaten tutarlı modülleri bozuyor. En sağlam yol: uyum kontrolünü ERROR
          # yerine WARNING yapmak — karışık JVM bytecode Android'de sorun değil.
          echo "kotlin.jvm.target.validation.mode=warning" >> android/gradle.properties
          # Ağ dayanıklılığı: bir bağımlılık indirmesi asılırsa Gradle sonsuza kadar
          # beklemesin — 120 sn'de zaman aşımına uğrayıp yeniden denesin. Böylece
          # geçici bir stall dakikalarca (build #53'te ~55 dk) asılı kalmaz.
          echo "systemProp.org.gradle.internal.http.connectionTimeout=120000" >> android/gradle.properties
          echo "systemProp.org.gradle.internal.http.socketTimeout=120000" >> android/gradle.properties
          echo "--- gradle.properties ---"; tail -8 android/gradle.properties

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Uygulama ikonunu üret (launcher + adaptive)
        run: |
          set -e
          dart run flutter_launcher_icons
          echo "--- üretilen mipmap'ler ---"
          ls -R android/app/src/main/res/mipmap-* 2>/dev/null | head -40 || true

      - name: Testler (pptx render)
        run: flutter test

      # ABI'ye göre BÖLÜNMÜŞ derleme (2026-07-29): tek şişko APK 200 MB'tı
      # çünkü üç mimarinin yerel kütüphaneleri (ML Kit, PDFium, syncfusion,
      # video/ses, Firebase) aynı dosyaya giriyordu. Bölme AOT derlemesini
      # ÇOĞALTMAZ — zaten her mimari için ayrı snapshot üretiliyordu — yalnız
      # çıktıyı ayırır, yani süre uzamaz. x86_64 bilinçli olarak DIŞARIDA:
      # yalnız emülatörde işe yarar, gerçek telefonda kimse kullanmaz (ve bir
      # AOT derlemesi eksildiği için süre biraz kısalır).
      #
      # SÜRÜM NUMARASI (2026-08-28): `pubspec.yaml`taki `version: 0.1.0+1`
      # SABİTTİ; her derleme aynı `versionCode 1` ile çıkıyordu. Android bir
      # güncellemeyi ancak versionCode ARTARSA kabul eder (mağaza yolu ikinci
      # yüklemede tıkanırdı; APK ile de "aynı sürüm" kurulumları karışıyordu).
      # Artık numara CI'nın koşu sayacından gelir — tekdüze artar ve yayınlanan
      # Release etiketiyle (`v0.1.0-build-<run_number>`) BİREBİR aynıdır.
      # `--split-per-abi` ile Flutter'ın Gradle eklentisi her mimariye ayrı bir
      # versionCode (abi*1000 + numara) verir; mimariler birbirini ezmez.
      - name: APK derle (release, ABI'ye göre bölünmüş)
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" \
            --target-platform android-arm,android-arm64
          echo "--- üretilen APK'lar ---"
          ls -lh build/app/outputs/flutter-apk/*.apk
        env:
          BUILD_NAME: 0.1.0
          BUILD_NUMBER: ${{ github.run_number }}

      - name: İmza anahtarını hazırla (secret varsa kalıcı, yoksa üret)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          # Repo public olduğu için parola artık workflow'da düz metin DEĞİL.
          # Secret yoksa (fork/ilk kurulum) geçici anahtar bu yedek parolayla üretilir.
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'DosyaOkuyucuGecici' }}
        run: |
          set -e
          if [ -n "$KS_B64" ]; then
            # tr: secret'a yapışan CR/boşluk/satır sonu base64'ü bozar ("invalid input")
            printf '%s' "$KS_B64" | tr -d '\r\n \t' | base64 -d > release.jks
            echo "İmza anahtarı repo secret'ından yüklendi (kalıcı)."
          else
            keytool -genkeypair -v -keystore release.jks -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 10000 -alias dosyaokuyucu \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=Dosya Okuyucu, O=DosyaOkuyucu, C=TR"
            # **ANAHTAR ARTIK LOG'A BASILMIYOR** (2026-08-28). Depo public;
            # base64 keystore'u iş akışı loguna yazmak, o logu gören herkese
            # uygulamayı BİZİM İMZAMIZLA güncelleme yetkisi vermek demekti
            # (parola da yedek değerdi). Anahtar üretmek zaten yerelde iki
            # komut — bkz. SIGNING.md. Buradaki geçici anahtar YALNIZ bu
            # derlemenin imzalanması içindir, dışarı çıkmaz.
            echo "::warning::Bu derleme GEÇİCİ bir anahtarla imzalandı; sürümler arası imza DEĞİŞİR (güncelleme kurulamaz). Kalıcı imza için SIGNING.md'deki adımlarla anahtarı YERELDE üretip ANDROID_KEYSTORE_B64 ve ANDROID_KEYSTORE_PASSWORD secret'larını ekleyin."
          fi

      - name: APK'yı imzala ve doğrula
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'DosyaOkuyucuGecici' }}
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          # Bölünmüş derlemede birden çok APK var; hepsi AYNI anahtarla
          # imzalanmalı, yoksa kullanıcı mimari değiştirdiğinde "imza uyuşmuyor"
          # hatasıyla güncelleyemez.
          shopt -s nullglob
          APKS=(build/app/outputs/flutter-apk/app-*-release.apk)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "::error::İmzalanacak APK bulunamadı"; exit 1
          fi
          for APK in "${APKS[@]}"; do
            echo "imzalanıyor: $APK"
            "$APKSIGNER" sign \
              --ks release.jks \
              --ks-key-alias dosyaokuyucu \
              --ks-pass "pass:$KS_PASS" \
              --key-pass "pass:$KS_PASS" \
              "$APK"
          done
          echo "--- imza sertifikası (arm64) ---"
          "$APKSIGNER" verify --print-certs \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            | grep -iE "SHA-256|SHA-1|Signer #1 cert" | head -5

      # arm64 SADE adı alır (`dosya-okuyucu.apk`): 2016 sonrası pratikte her
      # telefon arm64-v8a. Kullanıcı her zamanki dosyayı indirmeye devam etsin,
      # mimari seçmek zorunda kalmasın. 32-bit cihazlar için ayrı dosya durur.
      - name: APK'ları adlandır
        run: |
          set -e
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            dist/dosya-okuyucu.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            dist/dosya-okuyucu-32bit-armeabi-v7a.apk
          ls -lh dist/

      # Ölçüm (tahmin değil): APK içinde neyin kaç MB tuttuğu. Boyut küçültme
      # turlarında hangi kalemin uğraşmaya değdiği buradan okunur.
      - name: Boyut raporu (APK içi en büyük dosyalar)
        run: |
          set -e
          echo "## APK boyutları" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh dist/ | awk '{print $5, $9}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "## arm64 APK içindeki en büyük 25 dosya (sıkıştırılmamış)" \
            >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # NF==4 süzmesi: `unzip -l`in başlık ve "toplam" satırları listeye
          # karışmasın (toplam satırı en büyük sayı olduğu için başa geçerdi).
          unzip -l dist/dosya-okuyucu.apk \
            | awk 'NF==4 && $1 ~ /^[0-9]+$/' \
            | sort -k1 -n -r | head -25 \
            | awk '{printf "%8.1f MB  %s\n", $1/1048576, $4}' \
            >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Artifact'lar mimariye göre AYRI (2026-08-17). Release adımı GitHub
      # kesintisinde düşebiliyor (bkz. aşağıdaki üç denemenin notu) ve o zaman
      # tek indirme yolu artifact kalıyor. Tek artifact'te iki APK birleşince
      # telefonda 101 MB'lık bir zip indirip içinden doğru dosyayı seçmek
      # gerekiyordu; ayrı olunca herkes yalnız kendi APK'sını (91 MB) indiriyor.
      - name: Artifact yükle (64-bit — herkesin indireceği)
        uses: actions/upload-artifact@v4
        with:
          name: dosya-okuyucu-apk
          path: dist/dosya-okuyucu.apk
          if-no-files-found: error

      - name: Artifact yükle (32-bit — yalnız çok eski cihazlar)
        uses: actions/upload-artifact@v4
        with:
          name: dosya-okuyucu-apk-32bit
          path: dist/dosya-okuyucu-32bit-armeabi-v7a.apk
          if-no-files-found: error

      # Sürüm notu DOSYAYA yazılır: aşağıdaki üç deneme aynı metni
      # `body_path` ile paylaşsın diye. (Metni her adımda tekrarlamak, biri
      # güncellenip diğerleri unutulduğunda sessizce ayrışırdı.)
      - name: Sürüm notunu hazırla
        run: |
          cat > dist/RELEASE_NOTES.md <<'NOTES'
          Otomatik derlenen, imzalı Android APK.

          **Yenilikler (bu sürümde):**
          - “Birlikte aç” / paylaş: WhatsApp/Gmail/Dosyalar’dan gelen dosyayı doğrudan açar
          - Geniş dosya türü desteği + içerik tanıma (uzantısız metin dosyaları dahil)
          - Her yerde yakınlaştır/uzaklaştır (görsel: pinch + çift-dokun + düğme), döndürme
          - Belge içi arama (Bul), metinde yazı boyutu, PDF sayfa göstergesi
          - Office düzenleme: Word biçim, Excel satır/sütun + formül + sayı biçimleri, PowerPoint slayt işlemleri
          - AI hızlı komutlar (Özetle / Ana noktalar / Basit anlat)
          - Özel uygulama ikonu

          Çok formatlı görüntüleme (PDF, Word, Excel, Slayt, metin, görsel), PDF/Slayt
          dönüştürme, paylaşım, Gemini AI sohbet, Firebase senkron (yapılandırıldığında).

          **Hangi dosyayı indirmeliyim?** → `dosya-okuyucu.apk`
          (2016 sonrası tüm telefonlar; 64-bit / arm64-v8a).
          Yalnızca çok eski 32-bit bir cihazda kurulmuyorsa
          `dosya-okuyucu-32bit-armeabi-v7a.apk` dosyasını deneyin.

          APK'lar bu sürümden itibaren mimariye göre **ayrı** derleniyor:
          tek dosyada üç mimarinin kütüphaneleri taşındığı için boyut
          gereksiz yere ~3 katıydı. İşlev aynı, indirme çok daha küçük.

          Kurulumda “bilinmeyen kaynak”a izin vermeniz gerekebilir.
          NOTES

      # ── Release: GERİ ÇEKİLMELİ üç deneme ────────────────────────────────
      #
      # 2026-08-17 (build 288 ve 290): APK derlendi, imzalandı ve artifact'e
      # yüklendi ama Release adımı ÜÇ kez 503 aldı ("No server is currently
      # available") ve iş kırmızı yandı. Sorun bizde değil, GitHub'ın Releases
      # API'sindeydi. `softprops/action-gh-release` kendi içinde üç kez dener
      # ama toplam ~2 SANİYE içinde — dakikalarca süren bir kesintiye karşı
      # hiçbir işe yaramıyor.
      #
      # İlk iki deneme `continue-on-error` ile sessizce geçilir, aralarında
      # gerçek bir bekleme vardır. ÜÇÜNCÜ deneme geçilmez: kesinti kalıcıysa
      # iş yine kırmızı yanar — sürümün yayımlanmadığını gizlemek istemiyoruz.
      - name: GitHub Release oluştur
        id: release1
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-build-${{ github.run_number }}
          name: Dosya Okuyucu v0.1.0 (build ${{ github.run_number }})
          make_latest: true
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/dosya-okuyucu.apk
            dist/dosya-okuyucu-32bit-armeabi-v7a.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release 503 aldı — bekle ve yeniden dene
        if: steps.release1.outcome == 'failure'
        run: sleep 90

      - name: GitHub Release oluştur (2. deneme)
        id: release2
        if: steps.release1.outcome == 'failure'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-build-${{ github.run_number }}
          name: Dosya Okuyucu v0.1.0 (build ${{ github.run_number }})
          make_latest: true
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/dosya-okuyucu.apk
            dist/dosya-okuyucu-32bit-armeabi-v7a.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release hâlâ olmadı — son kez bekle
        if: steps.release1.outcome == 'failure' && steps.release2.outcome == 'failure'
        run: sleep 240

      # Son deneme: burada başarısızlık İŞİ KIRAR (bilinçli).
      - name: GitHub Release oluştur (son deneme)
        if: steps.release1.outcome == 'failure' && steps.release2.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-build-${{ github.run_number }}
          name: Dosya Okuyucu v0.1.0 (build ${{ github.run_number }})
          make_latest: true
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/dosya-okuyucu.apk
            dist/dosya-okuyucu-32bit-armeabi-v7a.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
