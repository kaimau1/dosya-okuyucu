name: APK Derle & Release

# ── FAZ 1 DÜZENİ (2026-10-21, docs/FAZ_PLANI.md §3.8) ─────────────────────
#
#   changes ─┬─ verify  (pub get → analyze → test [+ Kotlin denetimi])  her dalda
#            └─ apk     (Android iskeleti → derle → imzala → denetle)   main/etiket/elle/[release-apk]
#                  └─ release (needs: verify + apk)                       main ve v* etiketi
#
# • verify ∥ apk PARALEL koşar (eskiden test, derlemeden önce sıralıydı:
#   ~4 dk duvar süresi). Release ikisi de yeşilse çıkar.
# • main push'u → tek bir "nightly" sürüm (her seferinde ÜZERİNE yazılır,
#   etiket yeni commit'e taşınır). `releases/latest/download/dosya-okuyucu.apk`
#   adresi bozulmasın diye nightly "en son" işaretli kalır.
# • `v*` etiketi → kalıcı, gerçek Release (arm + arm64 + AAB).
# • Eski sürümler budanır: nightly hariç en yeni 10 sürüm kalır (kullanıcı
#   onayı 2026-10-21). Hız sınırına takılmamak için koşu başına ≤ 100 silme.
# • `[release-apk]` işaretli commit: özellik dalında APK'yı artifact olarak
#   üretir, Release basmaz (2026-07-21 politikası).

on:
  push:
    branches:
      - main
      - 'claude/**'
      - 'ccr-*'
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'graphify-out/**'
      - '.claude/**'
      - 'hooks/**'
  workflow_dispatch:
    inputs:
      aab:
        description: 'Play için AAB + 32-bit APK da üret'
        type: boolean
        default: false
      flutter_version:
        description: 'Denenecek Flutter sürümü (varsayılan 3.44.6)'
        type: string
        default: '3.44.6'
      kisisel:
        description: 'Kişisel derleme (asistan köprüsüyle; YALNIZ artifact, Release yayınlanmaz)'
        type: boolean
        default: false

permissions:
  contents: write

# Art arda iki push → ilki iptal (C2). Etiketler ref'e göre ayrı gruptadır,
# yani bir sürüm etiketi main'deki derlemeyi iptal etmez.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# SÜRÜM DUVARI DENEMESİ (2026-08-28): Flutter sürümü tek yerde ve elle
# tetiklemede DEĞİŞTİRİLEBİLİR (targetSdk/Flutter yükseltmesini main'i
# kırmadan ölçmek için). Push'ta `inputs` boştur → 3.44.6 (Faz 7, 2026-10-21; yerel geliştirme sürümüyle aynı).
env:
  FLUTTER_VERSION: ${{ inputs.flutter_version || '3.44.6' }}

jobs:
  # ── Ne değişti? (C8/C11) ─────────────────────────────────────────────────
  # `paths-ignore` yalnız "hiç koşma"yı bilir. Burada daha ince karar:
  #   • yalnız test/** ve tool/** değiştiyse APK derlenmez (verify yeter);
  #   • ci/** değiştiyse verify Kotlin denetimini de koşar.
  # Kıyas yapılamıyorsa (yeni dal, zorla push, elle tetikleme) her şey koşar.
  changes:
    name: Değişiklik süzgeci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
      kotlin: ${{ steps.diff.outputs.kotlin }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -e
          APP=true; KOTLIN=true
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ] \
             && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$' \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            FILES=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            echo "Değişen dosyalar:"; echo "$FILES"
            if [ -n "$FILES" ] && ! echo "$FILES" | grep -qvE '^(test|tool)/'; then
              APP=false
            fi
            echo "$FILES" | grep -qE '^ci/' || KOTLIN=false
          fi
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "kotlin=$KOTLIN" >> "$GITHUB_OUTPUT"
          echo "app=$APP kotlin=$KOTLIN"

  # ── Doğrulama: her dalda (main dahil) ───────────────────────────────────
  verify:
    name: Doğrulama (analyze + test)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Flutter kurulumu (önbellekli)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Bağımlılıklar
        run: flutter pub get

      # KAPI (2026-08-28): `flutter analyze` info seviyesinde de sıfır dışı
      # çıkar — bu adım "hiç uyarı yok" demektir. Başka bir Flutter sürümü
      # denenirken kullanımdan kaldırma uyarıları BEKLENİR → bağlayıcı değil.
      - name: Statik çözümleme (analyze)
        continue-on-error: ${{ env.FLUTTER_VERSION != '3.44.6' }}
        run: flutter analyze

      - name: Birim ve widget testleri
        run: flutter test

      # C11: `ci/*.kt` yalnız APK derlemesinde derleniyordu; tek satırlık bir
      # tür hatası 13 dk'lık turun SONUNDA çıkıyordu (HAFIZA 2026-09-02).
      # kotlinc runner imajında yoksa betik sessizce atlar.
      - name: Kotlin tür denetimi (ci/ değiştiyse)
        if: needs.changes.outputs.kotlin == 'true'
        run: bash tool/check_kotlin.sh

  # ── Derleme: imzalı APK (+ istenirse AAB) ───────────────────────────────
  apk:
    name: Android APK
    needs: changes
    runs-on: ubuntu-latest
    # Takılma koruması: build #53'te bir Gradle/ağ stall'ı 55 dk asılı kaldı.
    timeout-minutes: 30
    if: >-
      needs.changes.outputs.app == 'true' && (
        github.event_name == 'workflow_dispatch' ||
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/v') ||
        contains(github.event.head_commit.message, '[release-apk]'))
    outputs:
      name: ${{ steps.version.outputs.name }}
      number: ${{ steps.version.outputs.number }}
      full: ${{ steps.version.outputs.full }}
    steps:
      - uses: actions/checkout@v4

      - name: Java kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kurulumu (önbellekli)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # C3: Gradle önbelleği. main dışındaki dallar SALT OKUNUR kullanır →
      # özellik dalları main'in önbelleğini kirletmez.
      - name: Gradle önbelleği
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # ── SÜRÜM NUMARASI (dokunulmadı, yalnız taşındı) ─────────────────────
      # TEK kaynak `lib/core/app_version.dart`: ana/ara numara orada elle,
      # YAMA numarası koşu sayacından. versionName, versionCode, Release
      # başlığı ve uygulama içi sürüm dördü birden aynı. Depodaki dosyaya
      # DOKUNULMUYOR (yalnız derleme kopyası `sed`leniyor).
      - name: Sürüm numarasını belirle
        id: version
        run: |
          set -e
          F=lib/core/app_version.dart
          MAJOR=$(sed -nE 's/^const appVersionMajor = ([0-9]+);/\1/p' "$F")
          MINOR=$(sed -nE 's/^const appVersionMinor = ([0-9]+);/\1/p' "$F")
          PATCH=${{ github.run_number }}
          NAME="$MAJOR.$MINOR.$PATCH"
          sed -i -E "s/^const appVersionPatch = [0-9]+;/const appVersionPatch = $PATCH;/" "$F"
          sed -i -E "s/^const appBuildNumber = [0-9]+;/const appBuildNumber = $PATCH;/" "$F"
          sed -i -E "s/^version: [0-9]+\.[0-9]+\.[0-9]+\+[0-9]+/version: $NAME+$PATCH/" pubspec.yaml
          # Etiket ya da elle AAB isteği → tam derleme (arm + arm64 + AAB).
          FULL=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]] || [ "${{ inputs.aab }}" = "true" ]; then FULL=true; fi
          {
            echo "name=$NAME"; echo "number=$PATCH"; echo "full=$FULL"
          } >> "$GITHUB_OUTPUT"
          echo "BUILD_NAME=$NAME" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$PATCH" >> "$GITHUB_ENV"
          echo "FULL_BUILD=$FULL" >> "$GITHUB_ENV"
          echo "Sürüm: $NAME (build $PATCH), tam derleme: $FULL"
          grep -n "appVersion" "$F"

      # C7: 9 ayrı yama adımı tek betikte — yerelde de koşar.
      - name: Android iskeleti + yamalar (ci/prepare_android.sh)
        # Kişisel derleme (asistan köprüsü) yalnız elle; genel derlemede betik
        # köprünün manifestte OLMADIĞINI denetler (ci/kisisel/).
        env:
          DOSYA_KISISEL: ${{ inputs.kisisel && '1' || '0' }}
        run: bash ci/prepare_android.sh

      # C4: push'ta yalnız arm64 (pratikte her telefon). 32-bit yalnız tam
      # derlemede. `--split-per-abi` her mimariye ayrı versionCode verir.
      # C9: `--obfuscate --split-debug-info` → libapp.so küçülür; çökme
      # izlerini çözmek için semboller artifact olarak saklanır
      # (`flutter symbolize -i iz.txt -d app.android-arm64.symbols`).
      - name: APK derle (release, karartılmış)
        run: |
          set -e
          PLATFORMS=android-arm64
          [ "$FULL_BUILD" = "true" ] && PLATFORMS=android-arm,android-arm64
          flutter build apk --release --split-per-abi \
            --obfuscate --split-debug-info=build/symbols \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" \
            --target-platform "$PLATFORMS"
          ls -lh build/app/outputs/flutter-apk/*.apk

      - name: İmza anahtarını hazırla (secret varsa kalıcı, yoksa geçici)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'DosyaOkuyucuGecici' }}
        run: |
          set -e
          if [ -n "$KS_B64" ]; then
            # tr: secret'a yapışan CR/boşluk/satır sonu base64'ü bozar.
            printf '%s' "$KS_B64" | tr -d '\r\n \t' | base64 -d > release.jks
            echo "İmza anahtarı repo secret'ından yüklendi (kalıcı)."
          else
            keytool -genkeypair -v -keystore release.jks -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 10000 -alias dosyaokuyucu \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=Dosya Okuyucu, O=DosyaOkuyucu, C=TR"
            # Anahtar LOG'A BASILMAZ (depo public — bkz. SIGNING.md).
            echo "::warning::Bu derleme GEÇİCİ bir anahtarla imzalandı; sürümler arası imza DEĞİŞİR (güncelleme kurulamaz). Kalıcı imza için SIGNING.md'deki adımlarla ANDROID_KEYSTORE_B64 ve ANDROID_KEYSTORE_PASSWORD secret'larını ekleyin."
          fi

      # Bölünmüş derlemedeki tüm APK'lar AYNI anahtarla imzalanır.
      - name: APK'yı imzala ve doğrula
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'DosyaOkuyucuGecici' }}
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner | sort -V | tail -1)
          shopt -s nullglob
          APKS=(build/app/outputs/flutter-apk/app-*-release.apk)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "::error::İmzalanacak APK bulunamadı"; exit 1
          fi
          for APK in "${APKS[@]}"; do
            echo "imzalanıyor: $APK"
            "$APKSIGNER" sign --ks release.jks --ks-key-alias dosyaokuyucu \
              --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" "$APK"
          done
          echo "--- imza sertifikası (arm64) ---"
          "$APKSIGNER" verify --print-certs \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            | grep -iE "SHA-256|SHA-1|Signer #1 cert" | head -5 | tee -a "$GITHUB_STEP_SUMMARY"

      # Play yükleme birimi. `jarsigner` (AAB bir jar'dır), APK ile AYNI
      # keystore. Release'e EKLENMEZ — telefona kurulamaz, kafa karıştırır.
      - name: AAB derle ve imzala (tam derlemede)
        if: steps.version.outputs.full == 'true'
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'DosyaOkuyucuGecici' }}
        run: |
          set -e
          flutter build appbundle --release \
            --obfuscate --split-debug-info=build/symbols-aab \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" \
            --target-platform android-arm,android-arm64,android-x64
          AAB=build/app/outputs/bundle/release/app-release.aab
          jarsigner -keystore release.jks -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -sigalg SHA256withRSA -digestalg SHA-256 "$AAB" dosyaokuyucu
          jarsigner -verify "$AAB" > /dev/null && echo "AAB imzası doğrulandı"
          mkdir -p dist-aab
          cp "$AAB" dist-aab/dosya-okuyucu.aab

      # arm64 SADE adı alır (`dosya-okuyucu.apk`) — kullanıcı her zamanki
      # dosyayı indirir; `releases/latest/download/dosya-okuyucu.apk` sabit.
      - name: APK'ları adlandır
        run: |
          set -e
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/dosya-okuyucu.apk
          if [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
              dist/dosya-okuyucu-32bit-armeabi-v7a.apk
          fi
          ls -lh dist/

      # Ölçüm: APK içinde neyin kaç MB tuttuğu (boyut turlarının pusulası).
      - name: Boyut raporu
        run: |
          set -e
          {
            echo "## APK boyutları"
            echo '```'; ls -l dist/ | awk 'NR>1 {printf "%6.1f MB  %s\n", $5/1048576, $9}'; echo '```'
            echo "## arm64 APK içindeki en büyük 25 dosya (sıkıştırılmamış)"
            echo '```'
            unzip -l dist/dosya-okuyucu.apk | awk 'NF==4 && $1 ~ /^[0-9]+$/' \
              | sort -k1 -n -r | head -25 \
              | awk '{printf "%8.1f MB  %s\n", $1/1048576, $4}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # C10 + 2026-09-26 denetimleri — derleme yeşil diye VARSAYILMAZ, ölçülür:
      #   • pdfium.wasm ve gömülü OCR APK'da yok, targetSdk 36;
      #   • 16 KB sayfa hizası (Play şartı, Kasım 2025'ten beri): zip hizası
      #     (`zipalign -P 16`) + her .so'nun ELF LOAD hizası ≥ 0x4000;
      #   • arm64 APK boyut bütçesi (Faz 7'de düşürülecek).
      - name: APK denetimi (içerik, 16 KB hiza, boyut bütçesi)
        env:
          BUDGET_MB: 80
        run: |
          set -e
          APK=dist/dosya-okuyucu.apk
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          if unzip -l "$APK" | grep -q 'pdfium.wasm'; then
            echo "::error::pdfium.wasm hâlâ APK'da"; exit 1
          fi
          if unzip -l "$APK" | grep -q 'libmlkit_google_ocr_pipeline.so'; then
            echo "::error::Gömülü OCR kütüphanesi hâlâ APK'da (ikame çalışmadı)"; exit 1
          fi
          # Faz 19: başlatıcı kısayolları, uygulama başına dil ve açılış ekranı
          # kaynakları APK'da olmalı (ci/res kopyalaması sessizce düşerse).
          RES=$("$BT/aapt2" dump resources "$APK")
          for r in xml/shortcuts xml/locales_config color/splash_bg; do
            if ! grep -q "$r" <<<"$RES"; then
              echo "::error::$r kaynağı APK'da yok"; exit 1
            fi
          done
          TARGET=$("$BT/aapt2" dump badging "$APK" | sed -nE "s/.*targetSdkVersion:'([0-9]+)'.*/\1/p")
          if [ "$TARGET" != "36" ]; then
            echo "::error::targetSdk 36 değil ($TARGET)"; exit 1
          fi
          for f in dist/*.apk; do
            if ! "$BT/zipalign" -c -P 16 -v 4 "$f" > zipalign.log 2>&1; then
              grep -v "(OK" zipalign.log | tail -20
              echo "::error::$f 16 KB zip hizasında değil"; exit 1
            fi
          done
          python3 - "$APK" <<'PY'
          import struct, sys, zipfile
          bad = []
          with zipfile.ZipFile(sys.argv[1]) as z:
              for n in z.namelist():
                  if not (n.startswith('lib/arm64-v8a/') and n.endswith('.so')):
                      continue
                  d = z.read(n)
                  if d[:4] != b'\x7fELF' or d[4] != 2:
                      continue
                  phoff, = struct.unpack_from('<Q', d, 0x20)
                  phentsize, phnum = struct.unpack_from('<HH', d, 0x36)
                  aligns = [struct.unpack_from('<Q', d, phoff + i * phentsize + 0x30)[0]
                            for i in range(phnum)
                            if struct.unpack_from('<I', d, phoff + i * phentsize)[0] == 1]
                  low = min(aligns) if aligns else 0
                  print(f'{n}: LOAD hizası 0x{low:x}')
                  if low < 0x4000:
                      bad.append(n)
          if bad:
              print('::error::16 KB ELF hizası tutmayan kütüphaneler: ' + ', '.join(bad))
              raise SystemExit(1)
          PY
          SIZE=$(stat -c %s "$APK")
          SIZE_MB=$(python3 -c "print(f'{$SIZE/1048576:.1f}')")
          if [ "$SIZE" -gt $((BUDGET_MB * 1048576)) ]; then
            echo "::error::arm64 APK $SIZE_MB MB — bütçe $BUDGET_MB MB"; exit 1
          fi
          LIBAPP=$(unzip -l "$APK" | awk '$4=="lib/arm64-v8a/libapp.so"{printf "%.1f", $1/1048576}')
          {
            echo "## İçerik denetimi"
            echo "- pdfium.wasm: yok ✔"
            echo "- gömülü OCR: yok ✔"
            echo "- targetSdk: $TARGET ✔"
            echo "- 16 KB hiza (zip + ELF): ✔"
            echo "- arm64 APK: $SIZE_MB MB / bütçe $BUDGET_MB MB ✔"
            echo "- libapp.so (karartılmış): $LIBAPP MB"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Artifact — APK (64-bit)
        uses: actions/upload-artifact@v4
        with:
          name: dosya-okuyucu-apk
          path: dist/dosya-okuyucu.apk
          if-no-files-found: error

      - name: Artifact — APK (32-bit, tam derlemede)
        if: steps.version.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dosya-okuyucu-apk-32bit
          path: dist/dosya-okuyucu-32bit-armeabi-v7a.apk
          if-no-files-found: error

      - name: Artifact — AAB (tam derlemede)
        if: steps.version.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dosya-okuyucu-aab
          path: dist-aab/dosya-okuyucu.aab
          retention-days: 14

      - name: Artifact — Dart sembolleri (çökme izi çözmek için)
        uses: actions/upload-artifact@v4
        with:
          name: dart-symbols-${{ steps.version.outputs.name }}
          path: build/symbols*
          retention-days: 90

  # ── Yayın: nightly (main) ya da gerçek sürüm (v* etiketi) ────────────────
  release:
    name: GitHub Release
    needs: [verify, apk]
    # Kişisel derleme (asistan köprüsü) dağıtıma GİRMEZ: Release yayınlanmaz.
    if: >-
      !inputs.kisisel &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BUILD_NAME: ${{ needs.apk.outputs.name }}
      BUILD_NUMBER: ${{ needs.apk.outputs.number }}
    steps:
      # `fetch-depth: 20` — sürüm notundaki son değişiklikler `git log`dan.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - uses: actions/download-artifact@v4
        with:
          pattern: dosya-okuyucu-apk*
          path: dist
          merge-multiple: true

      - name: Sürüm notunu hazırla
        run: |
          set -e
          {
            echo "**Sürüm ${BUILD_NAME}** (derleme ${BUILD_NUMBER}) — \`$(git rev-parse --short HEAD)\`"
            echo
            echo "**Bu derlemedeki son değişiklikler:**"
            git log -8 --pretty='- %s'
            echo
            echo "**Hangi dosyayı indirmeliyim?** → \`dosya-okuyucu.apk\` (64-bit / arm64-v8a)."
            if [ -f dist/dosya-okuyucu-32bit-armeabi-v7a.apk ]; then
              echo "Yalnız çok eski 32-bit bir cihazda kurulmuyorsa \`dosya-okuyucu-32bit-armeabi-v7a.apk\`."
            else
              echo "32-bit APK yalnız sürüm etiketli (v*) derlemelerde üretilir."
            fi
            echo
            echo "Kurulumda “bilinmeyen kaynak”a izin vermeniz gerekebilir."
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      # C5 + C6: tek adım, üstel bekleme (30/90/240 sn). 2026-08-17'de
      # Releases API dakikalarca 503 verdi; eylemin kendi 2 sn'lik yeniden
      # denemesi yetmiyordu. Son deneme de düşerse iş KIRMIZI yanar.
      #   • main → `nightly`: varsa etiket yeni commit'e taşınır, dosyalar
      #     üzerine yazılır; yoksa oluşturulur. "En son" işaretli kalır ki
      #     kullanıcının bildiği indirme adresi çalışsın.
      #   • v* → o etiketle kalıcı sürüm.
      - name: Release yayımla (3 deneme)
        run: |
          set -u
          publish() {
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              TAG="${GITHUB_REF#refs/tags/}"
              if gh release view "$TAG" >/dev/null 2>&1; then
                gh release upload "$TAG" dist/*.apk --clobber
              else
                gh release create "$TAG" dist/*.apk --verify-tag \
                  --title "Dosya Okuyucu $TAG (${BUILD_NAME})" \
                  --notes-file RELEASE_NOTES.md --latest
              fi
            else
              TAG=nightly
              TITLE="Dosya Okuyucu nightly v${BUILD_NAME}"
              if gh release view "$TAG" >/dev/null 2>&1; then
                gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" \
                  -f sha="$GITHUB_SHA" -F force=true >/dev/null &&
                gh release edit "$TAG" --title "$TITLE" \
                  --notes-file RELEASE_NOTES.md --prerelease=false --latest &&
                gh release upload "$TAG" dist/*.apk --clobber
              else
                gh release create "$TAG" dist/*.apk --target "$GITHUB_SHA" \
                  --title "$TITLE" --notes-file RELEASE_NOTES.md --latest
              fi
            fi
          }
          for WAIT in 30 90 240 0; do
            if publish; then echo "Release yayımlandı."; exit 0; fi
            [ "$WAIT" -eq 0 ] && break
            echo "::warning::Release denemesi düştü; $WAIT sn sonra yeniden."
            sleep "$WAIT"
          done
          echo "::error::Release 4 denemede de yayımlanamadı (APK artifact'te duruyor)."
          exit 1

      # C5 budama (kullanıcı onayı 2026-10-21): nightly hariç en yeni 10
      # sürüm kalır; eskiler etiketleriyle silinir. GITHUB_TOKEN saatlik API
      # sınırına takılmamak için koşu başına en çok 100 silme — birikmiş
      # ~370 sürüm birkaç main push'unda erir. Budama başarısızsa sürüm
      # yayımlanmış olduğundan iş kırılmaz.
      - name: Eski sürümleri buda (son 10 kalsın)
        continue-on-error: true
        env:
          KEEP: 10
          MAX_DELETE: 100
        run: |
          set -e
          gh release list --limit 1000 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[].tagName' \
            | grep -vx nightly | tail -n +$((KEEP + 1)) | head -n "$MAX_DELETE" > old.txt || true
          echo "Silinecek: $(wc -l < old.txt) sürüm"
          while read -r TAG; do
            [ -n "$TAG" ] || continue
            gh release delete "$TAG" --yes --cleanup-tag || echo "::warning::$TAG silinemedi"
          done < old.txt
