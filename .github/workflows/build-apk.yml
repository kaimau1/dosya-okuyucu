name: APK Derle & Release

# ── FAZ 1 DÜZENİ (2026-10-21, docs/FAZ_PLANI.md §3.8) ─────────────────────
#
#   changes ─┬─ verify  (pub get → analyze → test [+ Kotlin denetimi])  her dalda
#            └─ apk     (Android iskeleti → derle → imzala → denetle)   main/etiket/elle/[release-apk]
#                  └─ release (needs: verify + apk)                       main ve v* etiketi
#
# • verify ∥ apk PARALEL koşar (eskiden test, derlemeden önce sıralıydı:
#   ~4 dk duvar süresi). Release ikisi de yeşilse çıkar.
# • main push'u (başlıkta [apk] ya da faz PR birleşmesi) → tek bir "nightly" sürüm (her seferinde ÜZERİNE yazılır,
#   etiket yeni commit'e taşınır). `releases/latest/download/dosya-okuyucu.apk`
#   adresi bozulmasın diye nightly "en son" işaretli kalır.
# • `v*` etiketi → kalıcı, gerçek Release (arm + arm64 + AAB).
# • Eski sürümler budanır: nightly hariç en yeni 10 sürüm kalır (kullanıcı
#   onayı 2026-10-21). Hız sınırına takılmamak için koşu başına ≤ 100 silme.
# • `[release-apk]` işaretli commit: özellik dalında APK'yı artifact olarak
#   üretir, Release basmaz (2026-07-21 politikası).
# • Kişisel derleme (kişisel özellikler): elle `kisisel: true` YA DA commit
#   mesajında `[kisisel]` → ayrı `kisisel` ön-sürümü (nightly değişmez).

on:
  push:
    branches:
      - main
      - 'claude/**'
      - 'ccr-*'
      - 'faz-*'
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'graphify-out/**'
      - '.claude/**'
      - 'hooks/**'
  workflow_dispatch:
    inputs:
      aab:
        description: 'Play için AAB + 32-bit APK da üret'
        type: boolean
        default: false
      flutter_version:
        description: 'Denenecek Flutter sürümü (varsayılan 3.47.9)'
        type: string
        default: '3.47.9'
      kisisel:
        description: 'Kişisel derleme (kişisel özelliklerle; ayrı `kisisel` ön-sürümüne yayınlanır, nightly/en son değişmez)'
        type: boolean
        default: false
      play:
        description: 'AAB Play izin varyantıyla (QUERY_ALL_PACKAGES vb. çıkarılır; APK değişmez — ci/play_variant.py)'
        type: boolean
        default: false
      play_remove:
        description: 'Play AAB''sinden çıkarılacak izinler (virgüllü kısa adlar)'
        type: string
        default: 'QUERY_ALL_PACKAGES,READ_MEDIA_IMAGES,READ_MEDIA_VIDEO,READ_MEDIA_AUDIO,READ_MEDIA_VISUAL_USER_SELECTED'

# G9.2 (2026-11-12): en az yetki — üst düzey yalnız okuma; yazma yetkisi
# yalnız sürüm yayımlayan `release` işinde.
permissions:
  contents: read

# Art arda iki push → ilki iptal (C2). Etiketler ref'e göre ayrı gruptadır,
# yani bir sürüm etiketi main'deki derlemeyi iptal etmez.
concurrency:
  # Kişisel derleme ayrı grupta: aynı daldaki genel (nightly) koşuyu iptal etmesin.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (inputs.kisisel || contains(github.event.head_commit.message, '[kisisel]')) && 'kisisel' || 'genel' }}
  cancel-in-progress: true

# SÜRÜM DUVARI DENEMESİ (2026-08-28): Flutter sürümü tek yerde ve elle
# tetiklemede DEĞİŞTİRİLEBİLİR (targetSdk/Flutter yükseltmesini main'i
# kırmadan ölçmek için). Push'ta `inputs` boştur → 3.47.9 (Faz 44, 2026-11-07; yerel C:/src/flutter-3479 ile aynı).
env:
  FLUTTER_VERSION: ${{ inputs.flutter_version || '3.47.9' }}

jobs:
  # ── Ne değişti? (C8/C11) ─────────────────────────────────────────────────
  # `paths-ignore` yalnız "hiç koşma"yı bilir. Burada daha ince karar:
  #   • yalnız test/** ve tool/** değiştiyse APK derlenmez (verify yeter);
  #   • ci/** değiştiyse verify Kotlin denetimini de koşar.
  # Kıyas yapılamıyorsa (yeni dal, zorla push, elle tetikleme) her şey koşar.
  changes:
    name: Değişiklik süzgeci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      pull-requests: read
    outputs:
      app: ${{ steps.diff.outputs.app }}
      kotlin: ${{ steps.diff.outputs.kotlin }}
      apk_isareti: ${{ steps.isaret.outputs.apk }}
      surum: ${{ steps.surum.outputs.name }}
      test_mod: ${{ steps.secim.outputs.mod }}
      test_liste: ${{ steps.secim.outputs.liste }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -e
          APP=true; KOTLIN=true
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ] \
             && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$' \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            FILES=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            echo "Değişen dosyalar:"; echo "$FILES"
            if [ -n "$FILES" ] && ! echo "$FILES" | grep -qvE '^(test|tool)/'; then
              APP=false
            fi
            echo "$FILES" | grep -qE '^ci/' || KOTLIN=false
          fi
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "kotlin=$KOTLIN" >> "$GITHUB_OUTPUT"
          echo "app=$APP kotlin=$KOTLIN"

      # [apk] İŞARETİ (2026-11-05, kullanıcı kararı): main push'u APK/nightly
      # ancak commit BAŞLIĞINDA [apk] varsa derler (CI/belge birleştirmesi
      # sürüm üretmesin). Yalnız başlık: gövdede geçen söz tetiklemesin.
      # PR birleştirmesinde başlık = merge_pull_request `commit_title`.
      - name: Derleme işareti ([apk])
        id: isaret
        run: |
          title=$(git log -1 --pretty=%s)
          # Faz PR'ı birleşmesi (`Merge pull request #N from <sahip>/faz-NN`) de
          # derler: zamanlanmış faz görevleri başlığa [apk] yazmıyor.
          if [[ "$title" == *'[apk]'* ]] || [[ "$title" =~ ^Merge\ pull\ request\ \#[0-9]+\ from\ [^/]+/faz- ]]; then
            echo "apk=true" >> "$GITHUB_OUTPUT"; echo "APK derlenecek: $title"
          else echo "apk=false" >> "$GITHUB_OUTPUT"; echo "Başlıkta [apk] yok → main'de APK derlenmez."; fi

      # SÜRÜM ADI (2026-11-05, kullanıcı kararı): ANA.ARA lib/core/app_version.dart'tan,
      # son hane main'de yayınlanan APK sayısı (tool/surum_hesapla.sh; işaret =
      # [apk] ya da faz PR birleşmesi). Başlıkta [minor] → ARA +1. versionCode koşu no.
      - name: Sürüm adı
        id: surum
        run: |
          F=lib/core/app_version.dart
          MAJOR=$(sed -nE 's/^const appVersionMajor = ([0-9]+);/\1/p' "$F")
          MINOR=$(sed -nE 's/^const appVersionMinor = ([0-9]+);/\1/p' "$F")
          name=$(bash tool/surum_hesapla.sh "$F" '^const appVersion(Major|Minor) =' "$MAJOR.$MINOR" \
            '\[apk\]|^Merge pull request #[0-9]+ from [^/]+/faz-')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Sürüm: $name"

      # TEST SEÇİMİ (2026-11-05, kullanıcı kararı): dalda yalnız etkilenen
      # testler (main'den ayrıldığı yerden bu yana); main'de PR başında yeşil
      # olan aynı ağaç tekrar test edilmez. Tam takım: başlıkta [tam], etiket
      # ya da elle tetik (tool/ci_test_secimi.sh).
      - name: Test seçimi
        id: secim
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tool/ci_test_secimi.sh 'Doğrulama'

  # ── Doğrulama: her dalda (main dahil) ───────────────────────────────────
  # 3 PARÇA PARALEL (2026-11-05): analyze + Kotlin denetimi 0. parçada.
  # Kırmızı parça: Actions'ta "Re-run failed jobs" yalnız onu yeniden koşar.
  # mod=atla → adımlar koşmaz, iş saniyede YEŞİL biter (release beklemesin).
  verify:
    name: Doğrulama (${{ matrix.shard }}/3)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Test seçimi (tool/ci_test_secimi.sh) PR başının check-run'larına bakar.
    permissions:
      contents: read
      checks: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      MOD: ${{ needs.changes.outputs.test_mod }}
    steps:
      - name: Atlandı (aynı ağaç PR başında yeşil)
        if: env.MOD == 'atla'
        run: echo "main ağacı, birleştirilen PR başıyla aynı ve orada yeşil — doğrulama atlandı."

      - uses: actions/checkout@v4
        if: env.MOD != 'atla'

      # Faz 42 / 1: yeni doğrudan bağımlılık ci/bagimliliklar.txt'te onaysızsa
      # kırmızı (APK bütçesi, performans anayasası kural 7). Flutter gerekmez.
      - name: Bağımlılık bütçesi
        if: env.MOD != 'atla' && matrix.shard == 0
        run: python3 tool/bagimlilik_denetimi.py

      # Güvenlik fazı G0: kapatılmış açıkların geri gelmesini ve onaysız yeni
      # saldırı yüzeyini (sunucu, dışa açık bileşen, WebView JS) yakalar.
      # Flutter gerekmez; bekleyen kurallar uyarı kipinde (tool/guvenlik_denetimi.sh).
      - name: Güvenlik denetimi
        if: env.MOD != 'atla' && matrix.shard == 0
        run: bash tool/guvenlik_denetimi.sh

      - name: Flutter kurulumu (önbellekli)
        if: env.MOD != 'atla'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # pubspec.lock depoda (2026-11-02): CI artık her koşuda yeniden
      # çözümlemiyor; kilit pubspec'le uyuşmazsa adım kırılır (yerelde
      # `flutter pub get` koşturup kilidi commit'le).
      - name: Bağımlılıklar
        if: env.MOD != 'atla'
        run: flutter pub get --enforce-lockfile

      # PDFium ikilisi (pdfium_dart kancası): önbellek + `gh` ile önceden
      # indirme — GitHub indirme ucu 504 verince bütün testler kırılıyordu
      # (2026-11-08). Bkz. tool/pdfium_onyukle.sh.
      - name: PDFium önbelleği
        if: env.MOD != 'atla'
        uses: actions/cache@v4
        with:
          path: .dart_tool/hooks_runner/shared/pdfium_dart/build/chromium_*
          key: pdfium-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - name: PDFium önden indir
        if: env.MOD != 'atla'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tool/pdfium_onyukle.sh linux-x64

      # KAPI (2026-08-28): `flutter analyze` info seviyesinde de sıfır dışı
      # çıkar — bu adım "hiç uyarı yok" demektir. Başka bir Flutter sürümü
      # denenirken kullanımdan kaldırma uyarıları BEKLENİR → bağlayıcı değil.
      - name: Statik çözümleme (analyze)
        if: env.MOD != 'atla' && matrix.shard == 0
        continue-on-error: ${{ env.FLUTTER_VERSION != '3.47.9' }}
        run: flutter analyze

      # -j verilmez: varsayılan eşzamanlılık (yükte süre sınırına takılan
      # ölçüm testleri var — HAFIZA 2026-11-02).
      - name: Birim ve widget testleri
        if: env.MOD != 'atla'
        env:
          LISTE: ${{ needs.changes.outputs.test_liste }}
        run: |
          if [ "$MOD" = secili ]; then
            printf '%s\n' "$LISTE" | sed '/^$/d' | while read -r f; do [ -f "$f" ] && echo "$f"; done | sort > /tmp/tum.txt
          else
            find test -name '*_test.dart' | sort > /tmp/tum.txt
          fi
          mapfile -t files < <(awk -v n=3 -v i=${{ matrix.shard }} '(NR-1) % n == i' /tmp/tum.txt)
          echo "Seçim: $MOD — toplam $(wc -l < /tmp/tum.txt), bu parçada ${#files[@]} test dosyası."
          if [ ${#files[@]} -eq 0 ]; then echo "Bu parçaya test düşmedi."; exit 0; fi
          # Perf etiketli dosyalar ayrı kapıda koşar (aşağıda) — burada çift
          # koşmasın (--exclude-tags yalnız perf dosyası kalınca "No tests ran" = 79).
          mapfile -t files < <(for f in "${files[@]}"; do grep -qE "@Tags\(\[.perf.\]\)" "$f" || echo "$f"; done)
          # PDF Pro tezgâhı kendi adımında (qpdf + mutool ile) koşar.
          mapfile -t files < <(for f in "${files[@]}"; do [ "$f" = test/pdf_pro/bench_test.dart ] || echo "$f"; done)
          if [ ${#files[@]} -eq 0 ]; then echo "Bu parçada yalnız perf testleri vardı."; exit 0; fi
          # PDFium'lu testler (PDF Pro köprüsü): Linux flutter_tester yerel
          # varlığı yükleyemiyor → önden indirilen kütüphane.
          export PDFIUM_PATH=$(ls "$PWD"/.dart_tool/hooks_runner/shared/pdfium_dart/build/chromium_*/linux-x64/libpdfium.so 2>/dev/null | head -1)
          flutter test "${files[@]}"

      # PERF GERİLEME KAPISI (Faz 42 / 5): `perf` etiketli eşik testleri HER
      # koşuda (seçimden bağımsız) 0. parçada; eşik aşımı kırmızı. Ölçülen
      # `PERF anahtar=değer` satırları iş özetine yazılır (A/B pusulası).
      - name: Perf gerileme kapısı (--tags perf)
        if: env.MOD != 'atla' && matrix.shard == 0
        run: |
          set -o pipefail
          mapfile -t perf < <(grep -rlE "@Tags\(\[.perf.\]\)" test | sort)
          echo "Perf test dosyaları: ${#perf[@]}"
          flutter test --tags perf "${perf[@]}" 2>&1 | tee perf.log
          {
            echo "## Perf ölçümleri (CI, debug JIT — cihaz değil)"
            echo '```'; grep -oE 'PERF [a-z0-9_]+=[^ ]+( [a-z0-9_]+=[^ ]+)*' perf.log | sort -u; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # PDF PRO TEZGÂHI (Faz 51, PK8): külliyatta düzenleme motoru ölçülür;
      # taban (test/pdf_pro/baseline.json) altına düşmek kırmızı. Bağımsız
      # doğrulayıcılar: qpdf --check + mutool draw (ikinci çizici). Yalnız
      # tezgâh seçime girdiyse (PDF kodu/külliyat değişti) ya da tam takımda.
      - name: PDF Pro tezgâhı (qpdf + mutool)
        if: >-
          env.MOD != 'atla' && matrix.shard == 0 &&
          (env.MOD != 'secili' || contains(needs.changes.outputs.test_liste, 'test/pdf_pro/bench_test.dart'))
        run: |
          set -o pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends qpdf mupdf-tools >/dev/null
          qpdf --version | head -1
          # Linux flutter_tester'da pdfium_dart yerel varlığı yüklenemiyor
          # ("Native assets file not found") → önden indirilen kütüphane.
          export PDFIUM_PATH=$(ls "$PWD"/.dart_tool/hooks_runner/shared/pdfium_dart/build/chromium_*/linux-x64/libpdfium.so | head -1)
          echo "PDFIUM_PATH=$PDFIUM_PATH"
          flutter test test/pdf_pro/bench_test.dart 2>&1 | tee bench.log
          {
            echo "## PDF Pro tezgâhı"
            echo '```'; grep -E '^PDFPRO_' bench.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # C11: `ci/*.kt` yalnız APK derlemesinde derleniyordu; tek satırlık bir
      # tür hatası 13 dk'lık turun SONUNDA çıkıyordu (HAFIZA 2026-09-02).
      # kotlinc runner imajında yoksa betik sessizce atlar.
      - name: Kotlin tür denetimi (ci/ değiştiyse)
        if: env.MOD != 'atla' && matrix.shard == 0 && needs.changes.outputs.kotlin == 'true'
        run: bash tool/check_kotlin.sh

  # ── Derleme: imzalı APK (+ istenirse AAB) ───────────────────────────────
  apk:
    name: Android APK
    needs: changes
    runs-on: ubuntu-latest
    # Takılma koruması: build #53'te bir Gradle/ağ stall'ı 55 dk asılı kaldı.
    timeout-minutes: 30
    if: >-
      needs.changes.outputs.app == 'true' && (
        github.event_name == 'workflow_dispatch' ||
        (github.ref == 'refs/heads/main' && needs.changes.outputs.apk_isareti == 'true') ||
        startsWith(github.ref, 'refs/tags/v') ||
        contains(github.event.head_commit.message, '[release-apk]') ||
        contains(github.event.head_commit.message, '[kisisel]'))
    outputs:
      name: ${{ steps.version.outputs.name }}
      number: ${{ steps.version.outputs.number }}
      full: ${{ steps.version.outputs.full }}
    steps:
      - uses: actions/checkout@v4

      - name: Java kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kurulumu (önbellekli)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # C3: Gradle önbelleği. main dışındaki dallar SALT OKUNUR kullanır →
      # özellik dalları main'in önbelleğini kirletmez.
      - name: Gradle önbelleği
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # ── SÜRÜM NUMARASI (dokunulmadı, yalnız taşındı) ─────────────────────
      # TEK kaynak `lib/core/app_version.dart`: ana/ara numara orada elle,
      # YAMA numarası koşu sayacından. versionName, versionCode, Release
      # başlığı ve uygulama içi sürüm dördü birden aynı. Depodaki dosyaya
      # DOKUNULMUYOR (yalnız derleme kopyası `sed`leniyor).
      - name: Sürüm numarasını belirle
        id: version
        run: |
          set -e
          F=lib/core/app_version.dart
          # Ad `changes` işinde hesaplandı (tool/surum_hesapla.sh); derleme no = koşu no.
          NAME="${{ needs.changes.outputs.surum }}"
          PATCH=${{ github.run_number }}
          sed -i -E "s/^const appVersionPatch = [0-9]+;/const appVersionPatch = ${NAME##*.};/" "$F"
          sed -i -E "s/^const appBuildNumber = [0-9]+;/const appBuildNumber = $PATCH;/" "$F"
          sed -i -E "s/^version: [0-9]+\.[0-9]+\.[0-9]+\+[0-9]+/version: $NAME+$PATCH/" pubspec.yaml
          # Etiket ya da elle AAB isteği → tam derleme (arm + arm64 + AAB).
          FULL=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]] || [ "${{ inputs.aab }}" = "true" ]; then FULL=true; fi
          {
            echo "name=$NAME"; echo "number=$PATCH"; echo "full=$FULL"
          } >> "$GITHUB_OUTPUT"
          echo "BUILD_NAME=$NAME" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$PATCH" >> "$GITHUB_ENV"
          echo "FULL_BUILD=$FULL" >> "$GITHUB_ENV"
          echo "Sürüm: $NAME (build $PATCH), tam derleme: $FULL"
          grep -n "appVersion" "$F"

      # C7: 9 ayrı yama adımı tek betikte — yerelde de koşar.
      - name: Android iskeleti + yamalar (ci/prepare_android.sh)
        # Kişisel derleme yalnız elle ya da `[kisisel]` ile.
        env:
          DOSYA_KISISEL: ${{ (inputs.kisisel || contains(github.event.head_commit.message, '[kisisel]')) && '1' || '0' }}
        run: bash ci/prepare_android.sh

      - name: PDFium önbelleği (Android)
        uses: actions/cache@v4
        with:
          path: .dart_tool/hooks_runner/shared/pdfium_dart/build/chromium_*
          key: pdfium-android-${{ hashFiles('pubspec.lock') }}-${{ env.FULL_BUILD }}
      - name: PDFium önden indir (Android)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="android-arm64"
          [ "$FULL_BUILD" = "true" ] && T="$T android-arm android-x64"
          bash tool/pdfium_onyukle.sh $T

      # C4: push'ta yalnız arm64 (pratikte her telefon). 32-bit yalnız tam
      # derlemede. `--split-per-abi` her mimariye ayrı versionCode verir.
      # C9: `--obfuscate --split-debug-info` → libapp.so küçülür; çökme
      # izlerini çözmek için semboller artifact olarak saklanır
      # (`flutter symbolize -i iz.txt -d app.android-arm64.symbols`).
      - name: APK derle (release, karartılmış)
        # OpenSubtitles anahtarı (altyazı arama) YALNIZ kişisel derlemeye girer:
        # genel APK herkese açık sürümde, anahtar oradan sökülebilirdi.
        env:
          OS_KEY: ${{ (inputs.kisisel || contains(github.event.head_commit.message, '[kisisel]')) && secrets.OPENSUBTITLES_API_KEY || '' }}
          # Oto güncelleme kişisel derlemede `kisisel` sürümünü izler (genelle ezilmesin).
          DOSYA_KISISEL: ${{ (inputs.kisisel || contains(github.event.head_commit.message, '[kisisel]')) && '1' || '0' }}
        run: |
          set -e
          PLATFORMS=android-arm64
          [ "$FULL_BUILD" = "true" ] && PLATFORMS=android-arm,android-arm64
          flutter build apk --release --split-per-abi \
            --obfuscate --split-debug-info=build/symbols \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" \
            --dart-define=OPENSUBTITLES_API_KEY="$OS_KEY" \
            --dart-define=DOSYA_KISISEL="$DOSYA_KISISEL" \
            --target-platform "$PLATFORMS"
          ls -lh build/app/outputs/flutter-apk/*.apk

      - name: İmza anahtarını hazırla (secret varsa kalıcı, yoksa geçici)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'DosyaOkuyucuGecici' }}
        run: |
          set -e
          if [ -n "$KS_B64" ]; then
            # tr: secret'a yapışan CR/boşluk/satır sonu base64'ü bozar.
            printf '%s' "$KS_B64" | tr -d '\r\n \t' | base64 -d > release.jks
            echo "İmza anahtarı repo secret'ından yüklendi (kalıcı)."
          else
            # G9.3 (2026-11-12): yayımlanan derleme (main / v* etiketi) geçici
            # anahtarla İMZALANMAZ — kullanıcıdaki uygulama güncellenemez olurdu.
            # 'DosyaOkuyucuGecici' parolası yalnız bu geçici anahtar içindir.
            if [ "$GITHUB_REF" = "refs/heads/main" ] || [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::ANDROID_KEYSTORE_B64 secret'ı yok — main/etiket derlemesi kalıcı anahtar ister (SIGNING.md)."
              exit 1
            fi
            keytool -genkeypair -v -keystore release.jks -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 10000 -alias dosyaokuyucu \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=Dosya Okuyucu, O=DosyaOkuyucu, C=TR"
            # Anahtar LOG'A BASILMAZ (depo public — bkz. SIGNING.md).
            echo "::warning::Bu derleme GEÇİCİ bir anahtarla imzalandı; sürümler arası imza DEĞİŞİR (güncelleme kurulamaz). Kalıcı imza için SIGNING.md'deki adımlarla ANDROID_KEYSTORE_B64 ve ANDROID_KEYSTORE_PASSWORD secret'larını ekleyin."
          fi

      # Bölünmüş derlemedeki tüm APK'lar AYNI anahtarla imzalanır.
      - name: APK'yı imzala ve doğrula
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'DosyaOkuyucuGecici' }}
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner | sort -V | tail -1)
          shopt -s nullglob
          APKS=(build/app/outputs/flutter-apk/app-*-release.apk)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "::error::İmzalanacak APK bulunamadı"; exit 1
          fi
          for APK in "${APKS[@]}"; do
            echo "imzalanıyor: $APK"
            "$APKSIGNER" sign --ks release.jks --ks-key-alias dosyaokuyucu \
              --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" "$APK"
          done
          echo "--- imza sertifikası (arm64) ---"
          "$APKSIGNER" verify --print-certs \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            | grep -iE "SHA-256|SHA-1|Signer #1 cert" | head -5 | tee -a "$GITHUB_STEP_SUMMARY"

      # Play yükleme birimi. `jarsigner` (AAB bir jar'dır), APK ile AYNI
      # keystore. Release'e EKLENMEZ — telefona kurulamaz, kafa karıştırır.
      - name: AAB derle ve imzala (tam derlemede)
        if: steps.version.outputs.full == 'true'
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'DosyaOkuyucuGecici' }}
          DOSYA_PLAY: ${{ inputs.play && '1' || '0' }}
          DOSYA_PLAY_REMOVE: ${{ inputs.play_remove || 'QUERY_ALL_PACKAGES,READ_MEDIA_IMAGES,READ_MEDIA_VIDEO,READ_MEDIA_AUDIO,READ_MEDIA_VISUAL_USER_SELECTED' }}
        run: |
          set -e
          # Play izin varyantı (A6.4): APK'lar ZATEN derlendi; manifest yalnız
          # AAB için yamanır, sonra birleşmiş manifestte izin YOK denetlenir.
          if [ "$DOSYA_PLAY" = "1" ]; then
            python3 ci/play_variant.py apply
          fi
          flutter build appbundle --release \
            --obfuscate --split-debug-info=build/symbols-aab \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" \
            --target-platform android-arm,android-arm64,android-x64
          AAB=build/app/outputs/bundle/release/app-release.aab
          if [ "$DOSYA_PLAY" = "1" ]; then
            python3 ci/play_variant.py verify $(find build/app/intermediates \
              -path '*merged_manifest*' -path '*release*' -name AndroidManifest.xml)
            echo "Play izin varyantı: $DOSYA_PLAY_REMOVE çıkarıldı" >> "$GITHUB_STEP_SUMMARY"
          fi
          jarsigner -keystore release.jks -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -sigalg SHA256withRSA -digestalg SHA-256 "$AAB" dosyaokuyucu
          jarsigner -verify "$AAB" > /dev/null && echo "AAB imzası doğrulandı"
          mkdir -p dist-aab
          cp "$AAB" dist-aab/dosya-okuyucu.aab

      # arm64 SADE adı alır (`dosya-okuyucu.apk`) — kullanıcı her zamanki
      # dosyayı indirir; `releases/latest/download/dosya-okuyucu.apk` sabit.
      - name: APK'ları adlandır
        run: |
          set -e
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/dosya-okuyucu.apk
          # Sürümlü ad da (2026-11-05): sabit ad bağlantı için, sürümlü ad indirilenler için.
          cp dist/dosya-okuyucu.apk "dist/dosya-okuyucu-v${BUILD_NAME}.apk"
          if [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
              dist/dosya-okuyucu-32bit-armeabi-v7a.apk
          fi
          ls -lh dist/

      # Ölçüm: APK içinde neyin kaç MB tuttuğu (boyut turlarının pusulası).
      - name: Boyut raporu
        run: |
          set -e
          {
            echo "## APK boyutları"
            echo '```'; ls -l dist/ | awk 'NR>1 {printf "%6.1f MB  %s\n", $5/1048576, $9}'; echo '```'
            echo "## arm64 APK içindeki en büyük 25 dosya (sıkıştırılmamış)"
            echo '```'
            unzip -l dist/dosya-okuyucu.apk | awk 'NF==4 && $1 ~ /^[0-9]+$/' \
              | sort -k1 -n -r | head -25 \
              | awk '{printf "%8.1f MB  %s\n", $1/1048576, $4}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # C10 + 2026-09-26 denetimleri — derleme yeşil diye VARSAYILMAZ, ölçülür:
      #   • pdfium.wasm ve gömülü OCR APK'da yok, targetSdk 36;
      #   • 16 KB sayfa hizası (Play şartı, Kasım 2025'ten beri): zip hizası
      #     (`zipalign -P 16`) + her .so'nun ELF LOAD hizası ≥ 0x4000;
      #   • arm64 APK boyut bütçesi. 80 → 100 (2026-11-02): mpv motoru (libmpv
      #     12 MB, VLC benzeri kodek desteği) + LiteRT (6,5 MB, görsel büyütme).
      - name: APK denetimi (içerik, 16 KB hiza, boyut bütçesi)
        env:
          BUDGET_MB: 100
        run: |
          set -e
          APK=dist/dosya-okuyucu.apk
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          if unzip -l "$APK" | grep -q 'pdfium.wasm'; then
            echo "::error::pdfium.wasm hâlâ APK'da"; exit 1
          fi
          if unzip -l "$APK" | grep -q 'libmlkit_google_ocr_pipeline.so'; then
            echo "::error::Gömülü OCR kütüphanesi hâlâ APK'da (ikame çalışmadı)"; exit 1
          fi
          # Faz 19: başlatıcı kısayolları, uygulama başına dil ve açılış ekranı
          # kaynakları APK'da olmalı (ci/res kopyalaması sessizce düşerse).
          RES=$("$BT/aapt2" dump resources "$APK")
          for r in xml/shortcuts xml/locales_config color/splash_bg; do
            if ! grep -q "$r" <<<"$RES"; then
              echo "::error::$r kaynağı APK'da yok"; exit 1
            fi
          done
          TARGET=$("$BT/aapt2" dump badging "$APK" | sed -nE "s/.*targetSdkVersion:'([0-9]+)'.*/\1/p")
          if [ "$TARGET" != "36" ]; then
            echo "::error::targetSdk 36 değil ($TARGET)"; exit 1
          fi
          for f in dist/*.apk; do
            if ! "$BT/zipalign" -c -P 16 -v 4 "$f" > zipalign.log 2>&1; then
              grep -v "(OK" zipalign.log | tail -20
              echo "::error::$f 16 KB zip hizasında değil"; exit 1
            fi
          done
          python3 - "$APK" <<'PY'
          import struct, sys, zipfile
          bad = []
          with zipfile.ZipFile(sys.argv[1]) as z:
              for n in z.namelist():
                  if not (n.startswith('lib/arm64-v8a/') and n.endswith('.so')):
                      continue
                  d = z.read(n)
                  if d[:4] != b'\x7fELF' or d[4] != 2:
                      continue
                  phoff, = struct.unpack_from('<Q', d, 0x20)
                  phentsize, phnum = struct.unpack_from('<HH', d, 0x36)
                  aligns = [struct.unpack_from('<Q', d, phoff + i * phentsize + 0x30)[0]
                            for i in range(phnum)
                            if struct.unpack_from('<I', d, phoff + i * phentsize)[0] == 1]
                  low = min(aligns) if aligns else 0
                  print(f'{n}: LOAD hizası 0x{low:x}')
                  if low < 0x4000:
                      bad.append(n)
          if bad:
              print('::error::16 KB ELF hizası tutmayan kütüphaneler: ' + ', '.join(bad))
              raise SystemExit(1)
          PY
          SIZE=$(stat -c %s "$APK")
          SIZE_MB=$(python3 -c "print(f'{$SIZE/1048576:.1f}')")
          if [ "$SIZE" -gt $((BUDGET_MB * 1048576)) ]; then
            echo "::error::arm64 APK $SIZE_MB MB — bütçe $BUDGET_MB MB"; exit 1
          fi
          # Faz 42 / 5: TABAN kapısı — tabandan %2 fazla büyüme kırmızı
          # (başlıkta [boyut] → bilinçli büyüme, yalnız uyarı).
          BASE=$(grep -vE '^\s*(#|$)' ci/apk_boyut_tabani.txt | head -1 | tr -d ' ')
          LIMIT=$((BASE * 102 / 100))
          GROW=$(python3 -c "print(f'{($SIZE-$BASE)*100/$BASE:+.2f}')")
          TITLE=$(git log -1 --pretty=%s)
          if [ "$SIZE" -gt "$LIMIT" ]; then
            if [[ "$TITLE" == *'[boyut]'* ]]; then
              echo "::warning::APK tabandan %$GROW büyük ([boyut] işaretli) — ci/apk_boyut_tabani.txt → $SIZE"
            else
              echo "::error::arm64 APK tabandan %$GROW büyük (sınır %2; taban $BASE, şimdi $SIZE). Gerekçeyle başlığa [boyut] yaz ve tabanı güncelle."; exit 1
            fi
          fi
          LIBAPP=$(unzip -l "$APK" | awk '$4=="lib/arm64-v8a/libapp.so"{printf "%.1f", $1/1048576}')
          {
            echo "## İçerik denetimi"
            echo "- pdfium.wasm: yok ✔"
            echo "- gömülü OCR: yok ✔"
            echo "- targetSdk: $TARGET ✔"
            echo "- 16 KB hiza (zip + ELF): ✔"
            echo "- arm64 APK: $SIZE_MB MB / bütçe $BUDGET_MB MB ✔"
            echo "- taban farkı: %$GROW (taban $BASE B, sınır %2)"
            echo "- libapp.so (karartılmış): $LIBAPP MB"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Artifact — APK (64-bit)
        uses: actions/upload-artifact@v4
        with:
          name: dosya-okuyucu-apk
          # Sürümlü ad da yüklenir: uygulama içi güncelleme sürümü bu addan
          # okur (2026-11-10 kök neden: yalnız sabit ad gidiyordu → "güncel").
          path: |
            dist/dosya-okuyucu.apk
            dist/dosya-okuyucu-v*.apk
          if-no-files-found: error

      - name: Artifact — APK (32-bit, tam derlemede)
        if: steps.version.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dosya-okuyucu-apk-32bit
          path: dist/dosya-okuyucu-32bit-armeabi-v7a.apk
          if-no-files-found: error

      - name: Artifact — AAB (tam derlemede)
        if: steps.version.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dosya-okuyucu-aab
          path: dist-aab/dosya-okuyucu.aab
          retention-days: 14

      - name: Artifact — Dart sembolleri (çökme izi çözmek için)
        uses: actions/upload-artifact@v4
        with:
          name: dart-symbols-${{ steps.version.outputs.name }}
          path: build/symbols*
          retention-days: 90

  # ── Yayın: nightly (main) ya da gerçek sürüm (v* etiketi) ────────────────
  release:
    name: GitHub Release
    needs: [verify, apk]
    # Kişisel derleme (kişisel özellikler) genel dağıtıma GİRMEZ: nightly/en son
    # değişmez; yalnız ayrı `kisisel` ön-sürümü (prerelease, latest DEĞİL)
    # güncellenir — kullanıcı oradan indirir (2026-11-01). Her daldan olur.
    if: >-
      (inputs.kisisel || contains(github.event.head_commit.message, '[kisisel]')) ||
      github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Sürüm oluşturma/düzenleme/silme + etiket taşıma.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BUILD_NAME: ${{ needs.apk.outputs.name }}
      BUILD_NUMBER: ${{ needs.apk.outputs.number }}
    steps:
      # `fetch-depth: 200` — sürüm notu bir önceki sürümden bu yana yapılan
      # commit'lerin gövdelerinden (tool/surum_notu.sh) çıkarılır.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 200

      - uses: actions/download-artifact@v4
        with:
          pattern: dosya-okuyucu-apk*
          path: dist
          merge-multiple: true

      - name: Sürüm notunu hazırla
        run: |
          set -e
          # Bir önceki sürümün commit'i: üzerine yazılan etiket (nightly /
          # kisisel) henüz taşınmadı; v* için bir önceki v* etiketi.
          if [ "${{ (inputs.kisisel || contains(github.event.head_commit.message, '[kisisel]')) && '1' || '0' }}" = "1" ]; then
            PREV_TAG=kisisel
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            git fetch --quiet --force origin 'refs/tags/v*:refs/tags/v*' || true
            PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          else
            PREV_TAG=nightly
          fi
          PREV_SHA=""
          if [ -n "$PREV_TAG" ]; then
            git fetch --quiet --force origin "refs/tags/$PREV_TAG:refs/tags/$PREV_TAG" || true
            PREV_SHA=$(git rev-parse -q --verify "refs/tags/$PREV_TAG^{commit}" || true)
          fi
          echo "Önceki sürüm: ${PREV_TAG:-yok} ${PREV_SHA:-}"
          {
            if [ "${{ (inputs.kisisel || contains(github.event.head_commit.message, '[kisisel]')) && '1' || '0' }}" = "1" ]; then
              echo "> **KİŞİSEL derleme** — kişisel özellikleri içerir; genel dağıtım değildir."
              echo
            fi
            echo "## Sürüm ${BUILD_NAME}"
            echo
            # Son kullanıcı notu (2026-11-10): bir önceki sürümden bu yana
            # commit gövdelerindeki "Yeni:/Düzeltme:/İyileştirme:" satırları.
            bash tool/surum_notu.sh "$PREV_SHA"
            echo
            echo "<sub>Derleme ${BUILD_NUMBER} · \`$(git rev-parse --short HEAD)\`</sub>"
            echo
            echo "**Hangi dosyayı indirmeliyim?** → \`dosya-okuyucu.apk\` (64-bit / arm64-v8a)."
            if [ -f dist/dosya-okuyucu-32bit-armeabi-v7a.apk ]; then
              echo "Yalnız çok eski 32-bit bir cihazda kurulmuyorsa \`dosya-okuyucu-32bit-armeabi-v7a.apk\`."
            else
              echo "32-bit APK yalnız sürüm etiketli (v*) derlemelerde üretilir."
            fi
            echo
            echo "Kurulumda “bilinmeyen kaynak”a izin vermeniz gerekebilir."
            echo
            # G9.6 (2026-11-12): uygulama içi güncelleme indirdiği APK'nın
            # SHA-256'sını bu satırlarla karşılaştırır; uymazsa siler, kurmaz.
            for f in dist/*.apk; do
              echo "<!-- sha256:$(basename "$f")=$(sha256sum "$f" | cut -d' ' -f1) -->"
            done
            # G12.4: bu sürümden eski kurulumlara "güvenlik güncellemesi gerekli".
            MIN_GUVENLI=$(grep -vE '^\s*(#|$)' ci/min_guvenli_surum.txt 2>/dev/null | head -1 | tr -d '[:space:]' || true)
            if [ -n "$MIN_GUVENLI" ]; then
              echo "<!-- min-guvenli: ${MIN_GUVENLI} -->"
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      # C5 + C6: tek adım, üstel bekleme (30/90/240 sn). 2026-08-17'de
      # Releases API dakikalarca 503 verdi; eylemin kendi 2 sn'lik yeniden
      # denemesi yetmiyordu. Son deneme de düşerse iş KIRMIZI yanar.
      #   • main → `nightly`: varsa etiket yeni commit'e taşınır, dosyalar
      #     üzerine yazılır; yoksa oluşturulur. "En son" işaretli kalır ki
      #     kullanıcının bildiği indirme adresi çalışsın.
      #   • v* → o etiketle kalıcı sürüm.
      - name: Release yayımla (3 deneme)
        run: |
          set -u
          # Üzerine yazılan sürümde (nightly/kisisel) eski sürümlü APK'lar birikmesin.
          eski_sil() {
            gh release view "$1" --json assets --jq '.assets[].name' 2>/dev/null \
              | grep -E '^dosya-okuyucu-v.*\.apk$' | grep -vxF "dosya-okuyucu-v${BUILD_NAME}.apk" \
              | while read -r a; do gh release delete-asset "$1" "$a" -y || true; done
          }
          publish() {
            if [ "${{ (inputs.kisisel || contains(github.event.head_commit.message, '[kisisel]')) && '1' || '0' }}" = "1" ]; then
              TAG=kisisel
              TITLE="Dosya Okuyucu KİŞİSEL v${BUILD_NAME}"
              if gh release view "$TAG" >/dev/null 2>&1; then
                gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" \
                  -f sha="$GITHUB_SHA" -F force=true >/dev/null &&
                gh release edit "$TAG" --title "$TITLE" \
                  --notes-file RELEASE_NOTES.md --prerelease --latest=false &&
                gh release upload "$TAG" dist/*.apk --clobber && eski_sil "$TAG"
              else
                gh release create "$TAG" dist/*.apk --target "$GITHUB_SHA" \
                  --title "$TITLE" --notes-file RELEASE_NOTES.md \
                  --prerelease --latest=false
              fi
            elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              TAG="${GITHUB_REF#refs/tags/}"
              if gh release view "$TAG" >/dev/null 2>&1; then
                gh release upload "$TAG" dist/*.apk --clobber
              else
                gh release create "$TAG" dist/*.apk --verify-tag \
                  --title "Dosya Okuyucu $TAG (${BUILD_NAME})" \
                  --notes-file RELEASE_NOTES.md --latest
              fi
            else
              TAG=nightly
              TITLE="Dosya Okuyucu nightly v${BUILD_NAME}"
              if gh release view "$TAG" >/dev/null 2>&1; then
                gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" \
                  -f sha="$GITHUB_SHA" -F force=true >/dev/null &&
                gh release edit "$TAG" --title "$TITLE" \
                  --notes-file RELEASE_NOTES.md --prerelease=false --latest &&
                gh release upload "$TAG" dist/*.apk --clobber && eski_sil "$TAG"
              else
                gh release create "$TAG" dist/*.apk --target "$GITHUB_SHA" \
                  --title "$TITLE" --notes-file RELEASE_NOTES.md --latest
              fi
            fi
          }
          for WAIT in 30 90 240 0; do
            if publish; then echo "Release yayımlandı."; exit 0; fi
            [ "$WAIT" -eq 0 ] && break
            echo "::warning::Release denemesi düştü; $WAIT sn sonra yeniden."
            sleep "$WAIT"
          done
          echo "::error::Release 4 denemede de yayımlanamadı (APK artifact'te duruyor)."
          exit 1

      # C5 budama (kullanıcı onayı 2026-10-21): nightly hariç en yeni 10
      # sürüm kalır; eskiler etiketleriyle silinir. GITHUB_TOKEN saatlik API
      # sınırına takılmamak için koşu başına en çok 100 silme — birikmiş
      # ~370 sürüm birkaç main push'unda erir. Budama başarısızsa sürüm
      # yayımlanmış olduğundan iş kırılmaz.
      - name: Eski sürümleri buda (son 10 kalsın)
        continue-on-error: true
        env:
          KEEP: 10
          MAX_DELETE: 100
        run: |
          set -e
          gh release list --limit 1000 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[].tagName' \
            | grep -vxE 'nightly|kisisel' | tail -n +$((KEEP + 1)) | head -n "$MAX_DELETE" > old.txt || true
          echo "Silinecek: $(wc -l < old.txt) sürüm"
          while read -r TAG; do
            [ -n "$TAG" ] || continue
            gh release delete "$TAG" --yes --cleanup-tag || echo "::warning::$TAG silinemedi"
          done < old.txt
