include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_const_constructors: true
    avoid_print: false
    # 2026-11-22: salt biçem kuralı; dal kırmızılarının yarısı yalnız bundandı
    # (`if (x != null) x` → `?x`). Davranışı etkilemez.
    use_null_aware_elements: false

analyzer:
  errors:
    # Derlemeyi engellememesi için bilgi/uyarıları yumuşat.
    deprecated_member_use: warning
    use_build_context_synchronously: warning
  exclude:
    - build/**
    - android/**
    - third_party/**
